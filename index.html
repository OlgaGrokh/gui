and is not duplicated on the page: one value — one chip.","html":"\u003ch2>C6. Syncing with the page chips\u003c/h2>\n\u003cul>\n\u003cli>A quick filter is \u003cstrong>duplicated\u003c/strong> in the drawer. This keeps the drawer a complete list of the page&#39;s filters: the user can set everything in one place and apply it with one Apply.\u003c/li>\n\u003cli>In the drawer, quick filters come first, in the same order as on the page.\u003c/li>\n\u003cli>A value applied in the drawer is immediately visible in the quick filter on the page, and vice versa.\u003c/li>\n\u003cli>A quick filter \u003cstrong>does not turn into\u003c/strong> an applied-filter chip and is not duplicated on the page: one value — one chip.\u003c/li>\n\u003c/ul>\n"},{"md":"## C7. Not yet covered\n\n- **Dependent filters.** For example, Sub-product options depend on the selected Product. What happens to the selected Sub-product if Product changes in the draft?\n- **Section groups.** Are group subheadings needed when there are more than 15 filters?\n- **Drawer width** and behavior on narrow screens.\n- **Request error after Apply.** The drawer is already closed — where should the error be shown (F2)?\n- **Counter on All Filters** — open question B2.\n\n---\n\n# Block D. Applying, validation, clearing","html":"\u003ch2>C7. Not yet covered\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Dependent filters.\u003c/strong> For example, Sub-product options depend on the selected Product. What happens to the selected Sub-product if Product changes in the draft?\u003c/li>\n\u003cli>\u003cstrong>Section groups.\u003c/strong> Are group subheadings needed when there are more than 15 filters?\u003c/li>\n\u003cli>\u003cstrong>Drawer width\u003c/strong> and behavior on narrow screens.\u003c/li>\n\u003cli>\u003cstrong>Request error after Apply.\u003c/strong> The drawer is already closed — where should the error be shown (F2)?\u003c/li>\n\u003cli>\u003cstrong>Counter on All Filters\u003c/strong> — open question B2.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Block D. Applying, validation, clearing\u003c/h1>\n"},{"md":"## D1. Apply button\n\n**Rule: Apply is always enabled** — in the chip dropdown and in the drawer. It does not depend on whether a field is empty or whether anything has changed.\n\n### What happens on click\n\n1. All fields shown in this container (the dropdown, or the whole drawer) are validated.\n2. There are errors → see D2. Nothing is applied; the container stays open.\n3. No errors:\n   - the draft becomes the applied value;\n   - an empty field / empty selection = the filter is **removed** (the parameter is not sent in the request);\n   - the dropdown / drawer closes;\n   - the table is re-requested and the chips update.\n4. If the draft matches the applied value, the container closes and the request may be skipped (an optimization, not a requirement).\n\n### Also\n\n- Enter in a dropdown text field = Apply.\n- In the drawer, Apply applies **all** filters at once. There is no partial apply: if even one field is invalid, nothing is applied.\n\n### Rationale (comment on the decision)\n\nI agree with the decision. Arguments for:\n\n- it follows the product convention \"we don't disable buttons\";\n- it fixes a real bug: erasing a value and applying an empty one was impossible except via × or Clear all — which is not obvious;\n- a disabled button doesn't explain *why* it is disabled; an enabled button + an error on the field does.\n\nWhat to watch out for so the decision doesn't create new problems:\n\n- \"Apply with an empty value\" must **remove** the filter, not send `\"\"` in the request. This should be stated explicitly in the dev ticket; otherwise the backend may start filtering by an empty string;\n- \"Apply with no changes\" should not trigger an unnecessary table reload (item 4 above).","html":"\u003ch2>D1. Apply button\u003c/h2>\n\u003cp>\u003cstrong>Rule: Apply is always enabled\u003c/strong> — in the chip dropdown and in the drawer. It does not depend on whether a field is empty or whether anything has changed.\u003c/p>\n\u003ch3>What happens on click\u003c/h3>\n\u003col>\n\u003cli>All fields shown in this container (the dropdown, or the whole drawer) are validated.\u003c/li>\n\u003cli>There are errors → see D2. Nothing is applied; the container stays open.\u003c/li>\n\u003cli>No errors:\u003cul>\n\u003cli>the draft becomes the applied value;\u003c/li>\n\u003cli>an empty field / empty selection = the filter is \u003cstrong>removed\u003c/strong> (the parameter is not sent in the request);\u003c/li>\n\u003cli>the dropdown / drawer closes;\u003c/li>\n\u003cli>the table is re-requested and the chips update.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>If the draft matches the applied value, the container closes and the request may be skipped (an optimization, not a requirement).\u003c/li>\n\u003c/ol>\n\u003ch3>Also\u003c/h3>\n\u003cul>\n\u003cli>Enter in a dropdown text field = Apply.\u003c/li>\n\u003cli>In the drawer, Apply applies \u003cstrong>all\u003c/strong> filters at once. There is no partial apply: if even one field is invalid, nothing is applied.\u003c/li>\n\u003c/ul>\n\u003ch3>Rationale (comment on the decision)\u003c/h3>\n\u003cp>I agree with the decision. Arguments for:\u003c/p>\n\u003cul>\n\u003cli>it follows the product convention &quot;we don&#39;t disable buttons&quot;;\u003c/li>\n\u003cli>it fixes a real bug: erasing a value and applying an empty one was impossible except via × or Clear all — which is not obvious;\u003c/li>\n\u003cli>a disabled button doesn&#39;t explain \u003cem>why\u003c/em> it is disabled; an enabled button + an error on the field does.\u003c/li>\n\u003c/ul>\n\u003cp>What to watch out for so the decision doesn&#39;t create new problems:\u003c/p>\n\u003cul>\n\u003cli>&quot;Apply with an empty value&quot; must \u003cstrong>remove\u003c/strong> the filter, not send \u003ccode>&quot;&quot;\u003c/code> in the request. This should be stated explicitly in the dev ticket; otherwise the backend may start filtering by an empty string;\u003c/li>\n\u003cli>&quot;Apply with no changes&quot; should not trigger an unnecessary table reload (item 4 above).\u003c/li>\n\u003c/ul>\n"},{"md":"## D2. Validation\n\n### When to show an error\n\n| Moment | Behavior |\n|---|---|\n| User is typing | No error shown (don't scold halfway through). Exception: if an error is already shown on the field, it is re-checked on every keystroke and disappears as soon as the value becomes valid. |\n| Focus leaves the field (blur) | The field is validated; on error — red border + error text under the field. |\n| Click on Apply | All fields in the container are validated (including ones the user hasn't touched). |\n\n### Clicking Apply with an invalid value\n\nThe button stays enabled, but:\n\n- the value is **not applied and not sent**;\n- the dropdown / drawer **does not close**;\n- invalid fields get a red border and error text;\n- **focus moves to the first invalid field** (instead of just being removed). I suggest this instead of \"remove focus\": the user can fix the value right away, and it works for keyboard and screen-reader users. If the team specifically wants blur, that's acceptable, but at least focus position on the button shouldn't be lost.\n- in the drawer: if the invalid field is inside a collapsed accordion, the accordion expands and the drawer scrolls to the first field with an error.\n\n### Closing with an invalid draft\n\nClick outside / Esc / clicking the chip again — closes the container; the invalid draft is discarded and errors are reset. The applied value stays the same.\n\n### Required fields\n\nA filter is optional by nature. The red \"required\" dots in the filter mockups (IMG_2344, IMG_2349) should either be removed (visual, later) or tied to a specific case where an empty value is not allowed. Suggestion: there are no required filters; if a page has a mandatory parameter, it is a default value (D4) that cannot be removed.\n\n### Comment on the decision\n\nI agree: an enabled button + blocked submission is the right combination. It is standard form behavior (\"validate on submit, don't disable submit\"). What matters is that clicking Apply produces a **visible** reaction; otherwise the user will think the button is broken. Hence moving focus to the field with the error and expanding the accordion in the drawer.","html":"\u003ch2>D2. Validation\u003c/h2>\n\u003ch3>When to show an error\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Moment\u003c/th>\n\u003cth>Behavior\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>User is typing\u003c/td>\n\u003ctd>No error shown (don&#39;t scold halfway through). Exception: if an error is already shown on the field, it is re-checked on every keystroke and disappears as soon as the value becomes valid.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Focus leaves the field (blur)\u003c/td>\n\u003ctd>The field is validated; on error — red border + error text under the field.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on Apply\u003c/td>\n\u003ctd>All fields in the container are validated (including ones the user hasn&#39;t touched).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Clicking Apply with an invalid value\u003c/h3>\n\u003cp>The button stays enabled, but:\u003c/p>\n\u003cul>\n\u003cli>the value is \u003cstrong>not applied and not sent\u003c/strong>;\u003c/li>\n\u003cli>the dropdown / drawer \u003cstrong>does not close\u003c/strong>;\u003c/li>\n\u003cli>invalid fields get a red border and error text;\u003c/li>\n\u003cli>\u003cstrong>focus moves to the first invalid field\u003c/strong> (instead of just being removed). I suggest this instead of &quot;remove focus&quot;: the user can fix the value right away, and it works for keyboard and screen-reader users. If the team specifically wants blur, that&#39;s acceptable, but at least focus position on the button shouldn&#39;t be lost.\u003c/li>\n\u003cli>in the drawer: if the invalid field is inside a collapsed accordion, the accordion expands and the drawer scrolls to the first field with an error.\u003c/li>\n\u003c/ul>\n\u003ch3>Closing with an invalid draft\u003c/h3>\n\u003cp>Click outside / Esc / clicking the chip again — closes the container; the invalid draft is discarded and errors are reset. The applied value stays the same.\u003c/p>\n\u003ch3>Required fields\u003c/h3>\n\u003cp>A filter is optional by nature. The red &quot;required&quot; dots in the filter mockups (IMG_2344, IMG_2349) should either be removed (visual, later) or tied to a specific case where an empty value is not allowed. Suggestion: there are no required filters; if a page has a mandatory parameter, it is a default value (D4) that cannot be removed.\u003c/p>\n\u003ch3>Comment on the decision\u003c/h3>\n\u003cp>I agree: an enabled button + blocked submission is the right combination. It is standard form behavior (&quot;validate on submit, don&#39;t disable submit&quot;). What matters is that clicking Apply produces a \u003cstrong>visible\u003c/strong> reaction; otherwise the user will think the button is broken. Hence moving focus to the field with the error and expanding the accordion in the drawer.\u003c/p>\n"},{"md":"## D3. Clearing\n\n⚠️ Partial.\n\n| Element | Where | What it does |\n|---|---|---|\n| × on a chip | page | Clears this filter and **applies immediately**. The dropdown does not open. A quick filter stays with no value; an applied-filter chip disappears (B1). |\n| Clear all | page | Clears all filters and applies immediately. Shown only if at least one filter is applied. Quick filters stay with no values; applied-filter chips disappear. |\n| Clear in a section | drawer | Shown only when the filter has a value; Switch never has it. Clears this section's draft. Applied on Apply. |\n| Clear all / Reset to default | drawer | Returns all filters to their default state, **applies immediately** and closes the drawer. The label depends on whether default values exist (C5). |\n| Erase the value in a field + Apply | chip and drawer | Same as ×: the filter is removed. |","html":"\u003ch2>D3. Clearing\u003c/h2>\n\u003cp>⚠️ Partial.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Element\u003c/th>\n\u003cth>Where\u003c/th>\n\u003cth>What it does\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>× on a chip\u003c/td>\n\u003ctd>page\u003c/td>\n\u003ctd>Clears this filter and \u003cstrong>applies immediately\u003c/strong>. The dropdown does not open. A quick filter stays with no value; an applied-filter chip disappears (B1).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all\u003c/td>\n\u003ctd>page\u003c/td>\n\u003ctd>Clears all filters and applies immediately. Shown only if at least one filter is applied. Quick filters stay with no values; applied-filter chips disappear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear in a section\u003c/td>\n\u003ctd>drawer\u003c/td>\n\u003ctd>Shown only when the filter has a value; Switch never has it. Clears this section&#39;s draft. Applied on Apply.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all / Reset to default\u003c/td>\n\u003ctd>drawer\u003c/td>\n\u003ctd>Returns all filters to their default state, \u003cstrong>applies immediately\u003c/strong> and closes the drawer. The label depends on whether default values exist (C5).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Erase the value in a field + Apply\u003c/td>\n\u003ctd>chip and drawer\u003c/td>\n\u003ctd>Same as ×: the filter is removed.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## D4. Default values and Reset to default\n\n⚠️ Partial.\n\n- A default value is a value the product sets for a filter when the page first opens.\n- A drawer section with a default value counts as a section with a value: it is expanded and has Clear (C3).\n- The drawer's reset button restores exactly the default values; if there are none, it is labeled Clear all (C5).\n- Not yet covered: how default values are shown in the page chips, and what Clear all on the page does when defaults exist.\n\n---\n\n# Block E. Filter types\n\nOnly what makes a type different from the general rules in blocks A–D. Each type is described in three places: a chip on the page without a value, a chip with a value, and the drawer section.","html":"\u003ch2>D4. Default values and Reset to default\u003c/h2>\n\u003cp>⚠️ Partial.\u003c/p>\n\u003cul>\n\u003cli>A default value is a value the product sets for a filter when the page first opens.\u003c/li>\n\u003cli>A drawer section with a default value counts as a section with a value: it is expanded and has Clear (C3).\u003c/li>\n\u003cli>The drawer&#39;s reset button restores exactly the default values; if there are none, it is labeled Clear all (C5).\u003c/li>\n\u003cli>Not yet covered: how default values are shown in the page chips, and what Clear all on the page does when defaults exist.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Block E. Filter types\u003c/h1>\n\u003cp>Only what makes a type different from the general rules in blocks A–D. Each type is described in three places: a chip on the page without a value, a chip with a value, and the drawer section.\u003c/p>\n"},{"md":"## Common to all types\n\n- **Chip without a value:** `Label ⌄`. Switch has no chevron.\n- **Chip with a value:** `Label Value × ⌄`. Clicking × clears the filter and applies immediately (D3).\n- **Open dropdown:** the chip is in the active (filled) state, the chevron points up.\n- **Section title in the drawer** is always **left-aligned**.\n- **Clear in a drawer section** is shown **only when the filter has a value**. No value — no Clear button. Switch never has a Clear button.\n- **Apply in the chip dropdown** exists for types where the value is typed or several options are picked: Text input, Amount range, Multiselect. Select, Date picker and Date range picker have no Apply: the choice is applied immediately.","html":"\u003ch2>Common to all types\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Chip without a value:\u003c/strong> \u003ccode>Label ⌄\u003c/code>. Switch has no chevron.\u003c/li>\n\u003cli>\u003cstrong>Chip with a value:\u003c/strong> \u003ccode>Label Value × ⌄\u003c/code>. Clicking × clears the filter and applies immediately (D3).\u003c/li>\n\u003cli>\u003cstrong>Open dropdown:\u003c/strong> the chip is in the active (filled) state, the chevron points up.\u003c/li>\n\u003cli>\u003cstrong>Section title in the drawer\u003c/strong> is always \u003cstrong>left-aligned\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Clear in a drawer section\u003c/strong> is shown \u003cstrong>only when the filter has a value\u003c/strong>. No value — no Clear button. Switch never has a Clear button.\u003c/li>\n\u003cli>\u003cstrong>Apply in the chip dropdown\u003c/strong> exists for types where the value is typed or several options are picked: Text input, Amount range, Multiselect. Select, Date picker and Date range picker have no Apply: the choice is applied immediately.\u003c/li>\n\u003c/ul>\n"},{"md":"## Summary table\n\n| Type | Chip without a value | Dropdown on the page | Chip with a value | Drawer | Apply in the dropdown |\n|---|---|---|---|---|---|\n| Text input | `Label ⌄` | Field + Apply | `Label Value × ⌄` | One field | Yes |\n| Amount range | `Label ⌄` | Two fields, \"from\" and \"to\" + Apply | `Label from 10 to 100 × ⌄` | Two fields in a row | Yes |\n| Select | `Label ⌄` | Search + list, one option | `Label Option × ⌄` | List with radio buttons, search, Show all | No |\n| Multiselect | `Label ⌄` | Search + list with checkboxes + Apply | `Label Option × ⌄` or `Label (2) × ⌄` | List with checkboxes, search, Show all | Yes |\n| Date picker | `Label ⌄` | One calendar | `Label 08/10/2025 × ⌄` | One field with one date | No |\n| Date range picker | `Label ⌄` | One picker with two calendars | `Label from 08/10/2025 to 02/12/2025 × ⌄` | **One** field with two dates | No |\n| Switch | `Label` (no chevron) | No dropdown | `Label ×` | Switch only, no Clear | — |","html":"\u003ch2>Summary table\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Type\u003c/th>\n\u003cth>Chip without a value\u003c/th>\n\u003cth>Dropdown on the page\u003c/th>\n\u003cth>Chip with a value\u003c/th>\n\u003cth>Drawer\u003c/th>\n\u003cth>Apply in the dropdown\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Text input\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Field + Apply\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code>\u003c/td>\n\u003ctd>One field\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amount range\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Two fields, &quot;from&quot; and &quot;to&quot; + Apply\u003c/td>\n\u003ctd>\u003ccode>Label from 10 to 100 × ⌄\u003c/code>\u003c/td>\n\u003ctd>Two fields in a row\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Select\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Search + list, one option\u003c/td>\n\u003ctd>\u003ccode>Label Option × ⌄\u003c/code>\u003c/td>\n\u003ctd>List with radio buttons, search, Show all\u003c/td>\n\u003ctd>No\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multiselect\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Search + list with checkboxes + Apply\u003c/td>\n\u003ctd>\u003ccode>Label Option × ⌄\u003c/code> or \u003ccode>Label (2) × ⌄\u003c/code>\u003c/td>\n\u003ctd>List with checkboxes, search, Show all\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Date picker\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>One calendar\u003c/td>\n\u003ctd>\u003ccode>Label 08/10/2025 × ⌄\u003c/code>\u003c/td>\n\u003ctd>One field with one date\u003c/td>\n\u003ctd>No\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Date range picker\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>One picker with two calendars\u003c/td>\n\u003ctd>\u003ccode>Label from 08/10/2025 to 02/12/2025 × ⌄\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>One\u003c/strong> field with two dates\u003c/td>\n\u003ctd>No\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Switch\u003c/td>\n\u003ctd>\u003ccode>Label\u003c/code> (no chevron)\u003c/td>\n\u003ctd>No dropdown\u003c/td>\n\u003ctd>\u003ccode>Label ×\u003c/code>\u003c/td>\n\u003ctd>Switch only, no Clear\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## E1. Text input\n\nVariants: **Text** (any text, placeholder \"Input the value\") and **Numeric** (digits only, placeholder \"Input the number\").\n\n**On the page**\n- Clicking the chip opens a dropdown: field title, input and Apply. Focus goes straight to the input.\n- When the field has text, a × appears inside it to clear the input quickly. It clears only the draft: the filter is removed when the user clicks Apply.\n- Enter in the field works as Apply.\n- After Apply, the chip shows the entered value: `Text Caldera UI × ⌄`. A long value is truncated with an ellipsis (B3).\n- Reopening shows the applied value in the field.\n\n**In the drawer**\n- One field under the section title. Clear appears when the field has an applied or entered value.\n- A text field must not have a calendar icon (mockup error, see below).\n\n**Validation** — general rules in D2. For Numeric: non-digit characters can't be typed.","html":"\u003ch2>E1. Text input\u003c/h2>\n\u003cp>Variants: \u003cstrong>Text\u003c/strong> (any text, placeholder &quot;Input the value&quot;) and \u003cstrong>Numeric\u003c/strong> (digits only, placeholder &quot;Input the number&quot;).\u003c/p>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Clicking the chip opens a dropdown: field title, input and Apply. Focus goes straight to the input.\u003c/li>\n\u003cli>When the field has text, a × appears inside it to clear the input quickly. It clears only the draft: the filter is removed when the user clicks Apply.\u003c/li>\n\u003cli>Enter in the field works as Apply.\u003c/li>\n\u003cli>After Apply, the chip shows the entered value: \u003ccode>Text Caldera UI × ⌄\u003c/code>. A long value is truncated with an ellipsis (B3).\u003c/li>\n\u003cli>Reopening shows the applied value in the field.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>One field under the section title. Clear appears when the field has an applied or entered value.\u003c/li>\n\u003cli>A text field must not have a calendar icon (mockup error, see below).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Validation\u003c/strong> — general rules in D2. For Numeric: non-digit characters can&#39;t be typed.\u003c/p>\n"},{"md":"## E2. Amount range\n\n**On the page**\n- Dropdown: two fields, \"from\" and \"to\", in a row + Apply.\n- In the chip: `Label from 10 to 100`, `Label from 10`, `Label to 100`.\n\n**In the drawer**\n- Two fields in a row under the section title, no calendar icons.\n\n**Boundary rules**\n- Both boundaries filled → check `from ≤ to`. The error is shown on the field edited last (or on `to`, if both).\n- One boundary filled → valid; this is an open range.\n- Both empty → the filter is removed. This is **not an error**: in the Validation mockup (IMG_2520, fourth example), empty fields are wrongly shown with an error.\n\n**Not yet covered:** number input format and thousands separators.","html":"\u003ch2>E2. Amount range\u003c/h2>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dropdown: two fields, &quot;from&quot; and &quot;to&quot;, in a row + Apply.\u003c/li>\n\u003cli>In the chip: \u003ccode>Label from 10 to 100\u003c/code>, \u003ccode>Label from 10\u003c/code>, \u003ccode>Label to 100\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Two fields in a row under the section title, no calendar icons.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Boundary rules\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Both boundaries filled → check \u003ccode>from ≤ to\u003c/code>. The error is shown on the field edited last (or on \u003ccode>to\u003c/code>, if both).\u003c/li>\n\u003cli>One boundary filled → valid; this is an open range.\u003c/li>\n\u003cli>Both empty → the filter is removed. This is \u003cstrong>not an error\u003c/strong>: in the Validation mockup (IMG_2520, fourth example), empty fields are wrongly shown with an error.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Not yet covered:\u003c/strong> number input format and thousands separators.\u003c/p>\n"},{"md":"## E3. Select\n\nSingle choice.\n\n**On the page**\n- Dropdown: search and a list of options. No Apply button.\n- Clicking an option **applies it immediately** and closes the dropdown.\n- In the chip: `Label Option × ⌄`.\n- While the list is loading, skeletons are shown instead of options (IMG_2508).\n\n**In the drawer**\n- List with radio buttons, search, Show all for long lists. Clear appears when an option is selected.\n- A choice in the drawer changes the draft and is applied with the drawer's Apply.\n\n> Pixso also has a Select variant with an Apply button and option subtitles (IMG_2512, top). We need to decide whether it stays as a separate variant or is removed — see open questions.","html":"\u003ch2>E3. Select\u003c/h2>\n\u003cp>Single choice.\u003c/p>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dropdown: search and a list of options. No Apply button.\u003c/li>\n\u003cli>Clicking an option \u003cstrong>applies it immediately\u003c/strong> and closes the dropdown.\u003c/li>\n\u003cli>In the chip: \u003ccode>Label Option × ⌄\u003c/code>.\u003c/li>\n\u003cli>While the list is loading, skeletons are shown instead of options (IMG_2508).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>List with radio buttons, search, Show all for long lists. Clear appears when an option is selected.\u003c/li>\n\u003cli>A choice in the drawer changes the draft and is applied with the drawer&#39;s Apply.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>Pixso also has a Select variant with an Apply button and option subtitles (IMG_2512, top). We need to decide whether it stays as a separate variant or is removed — see open questions.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## E4. Multiselect\n\n**On the page**\n- Dropdown: search, list with checkboxes, and Apply.\n- In the chip: one selected option — `Label Option × ⌄`; two or more — a counter, `Label (2) × ⌄`.\n\n**In the drawer**\n- List with checkboxes, search, Show all. Clear appears when at least one option is selected.","html":"\u003ch2>E4. Multiselect\u003c/h2>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dropdown: search, list with checkboxes, and Apply.\u003c/li>\n\u003cli>In the chip: one selected option — \u003ccode>Label Option × ⌄\u003c/code>; two or more — a counter, \u003ccode>Label (2) × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>List with checkboxes, search, Show all. Clear appears when at least one option is selected.\u003c/li>\n\u003c/ul>\n"},{"md":"## E5. Date picker\n\nOne field — **one date**.\n\n**On the page**\n- Dropdown: one calendar with month and year switching. No Apply button.\n- Clicking a date **applies it immediately** and closes the dropdown.\n- In the chip: `Label 08/10/2025 × ⌄`.\n\n**In the drawer**\n- One field with the placeholder `DD/MM/YYYY` and a calendar icon. Clicking the field or the icon opens the same calendar.","html":"\u003ch2>E5. Date picker\u003c/h2>\n\u003cp>One field — \u003cstrong>one date\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dropdown: one calendar with month and year switching. No Apply button.\u003c/li>\n\u003cli>Clicking a date \u003cstrong>applies it immediately\u003c/strong> and closes the dropdown.\u003c/li>\n\u003cli>In the chip: \u003ccode>Label 08/10/2025 × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>One field with the placeholder \u003ccode>DD/MM/YYYY\u003c/code> and a calendar icon. Clicking the field or the icon opens the same calendar.\u003c/li>\n\u003c/ul>\n"},{"md":"## E6. Date range picker\n\n**Rule: a Date range picker is one field and one picker.** Not two Date pickers.\n\nPreviously, the Date range picker was wrongly built from two separate Date pickers (\"from\" and \"to\"), and the link between picking the start and end dates was awkward. We are moving away from that: a range is always picked in one field.\n\n**On the page**\n- Dropdown: one picker with two calendars (current and next month). No Apply button.\n- First click — start date, second click — end date. The days in between are highlighted.\n- If the second click is earlier than the first date, the dates swap: the range always runs from the earlier date to the later one.\n- Start and end can be the same: clicking one date twice gives a one-day range.\n- After the second date is picked, the range **is applied immediately** and the dropdown closes.\n- If the user picked only the start date and closed the dropdown, the draft is discarded (A1).\n- In the chip: `Label from 08/10/2025 to 02/12/2025 × ⌄`.\n\n**In the drawer**\n- **One** field with a placeholder of two dates separated by a dash: `DD/MM/YYYY – DD/MM/YYYY`.\n- Clicking the field opens the same picker with two calendars.\n- After picking, both dates are filled in the field at once: `08/10/2025 – 02/12/2025`.\n- Clear clears both dates at once.\n\n**One boundary:** unlike Amount range, dates have no open range: only a range with both dates is applied.","html":"\u003ch2>E6. Date range picker\u003c/h2>\n\u003cp>\u003cstrong>Rule: a Date range picker is one field and one picker.\u003c/strong> Not two Date pickers.\u003c/p>\n\u003cp>Previously, the Date range picker was wrongly built from two separate Date pickers (&quot;from&quot; and &quot;to&quot;), and the link between picking the start and end dates was awkward. We are moving away from that: a range is always picked in one field.\u003c/p>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dropdown: one picker with two calendars (current and next month). No Apply button.\u003c/li>\n\u003cli>First click — start date, second click — end date. The days in between are highlighted.\u003c/li>\n\u003cli>If the second click is earlier than the first date, the dates swap: the range always runs from the earlier date to the later one.\u003c/li>\n\u003cli>Start and end can be the same: clicking one date twice gives a one-day range.\u003c/li>\n\u003cli>After the second date is picked, the range \u003cstrong>is applied immediately\u003c/strong> and the dropdown closes.\u003c/li>\n\u003cli>If the user picked only the start date and closed the dropdown, the draft is discarded (A1).\u003c/li>\n\u003cli>In the chip: \u003ccode>Label from 08/10/2025 to 02/12/2025 × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>One\u003c/strong> field with a placeholder of two dates separated by a dash: \u003ccode>DD/MM/YYYY – DD/MM/YYYY\u003c/code>.\u003c/li>\n\u003cli>Clicking the field opens the same picker with two calendars.\u003c/li>\n\u003cli>After picking, both dates are filled in the field at once: \u003ccode>08/10/2025 – 02/12/2025\u003c/code>.\u003c/li>\n\u003cli>Clear clears both dates at once.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>One boundary:\u003c/strong> unlike Amount range, dates have no open range: only a range with both dates is applied.\u003c/p>\n"},{"md":"## E7. Switch\n\n**Name.** I suggest calling this type **Switch**, not Boolean. Boolean is a data type, not a UI element. In the drawer it is literally a switch, and in Pixso the section is already labeled \"Switch\" (IMG_2522). On the page it can be called a \"switch chip\".\n\n**On the page**\n- Chip without a chevron: `Label`. No dropdown.\n- Click — the filter turns on and **is applied immediately**; a × appears on the chip: `Label ×`.\n- Clicking the chip again or clicking × — the filter is removed and applied immediately; the × disappears.\n- Hover: the chip is in the active (filled) state (IMG_2509).\n\n**In the drawer**\n- Switch only, **no Clear button**.\n- Toggling changes the draft and is applied with the drawer's Apply.\n\n**States:** on / not set. There is no `false` value: a switched-off Switch does not filter the table. If a \"no only\" filter is needed, use a Select with Yes / No options.\n\nSwitch is almost always used as a quick filter (B1).","html":"\u003ch2>E7. Switch\u003c/h2>\n\u003cp>\u003cstrong>Name.\u003c/strong> I suggest calling this type \u003cstrong>Switch\u003c/strong>, not Boolean. Boolean is a data type, not a UI element. In the drawer it is literally a switch, and in Pixso the section is already labeled &quot;Switch&quot; (IMG_2522). On the page it can be called a &quot;switch chip&quot;.\u003c/p>\n\u003cp>\u003cstrong>On the page\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Chip without a chevron: \u003ccode>Label\u003c/code>. No dropdown.\u003c/li>\n\u003cli>Click — the filter turns on and \u003cstrong>is applied immediately\u003c/strong>; a × appears on the chip: \u003ccode>Label ×\u003c/code>.\u003c/li>\n\u003cli>Clicking the chip again or clicking × — the filter is removed and applied immediately; the × disappears.\u003c/li>\n\u003cli>Hover: the chip is in the active (filled) state (IMG_2509).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>In the drawer\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Switch only, \u003cstrong>no Clear button\u003c/strong>.\u003c/li>\n\u003cli>Toggling changes the draft and is applied with the drawer&#39;s Apply.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>States:\u003c/strong> on / not set. There is no \u003ccode>false\u003c/code> value: a switched-off Switch does not filter the table. If a &quot;no only&quot; filter is needed, use a Select with Yes / No options.\u003c/p>\n\u003cp>Switch is almost always used as a quick filter (B1).\u003c/p>\n"},{"md":"## Errors in the current mockups\n\nThey don't change behavior but should be fixed when we get to the visuals:\n\n- **Drawer (IMG_2522):** the section titles Amount range, Text input and Date range are centered. All titles must be left-aligned.\n- **Drawer:** the Amount range and Text input fields have a calendar icon — they shouldn't.\n- **Drawer:** the footer button is labeled \"Save\"; it should be \"Apply\".\n- **Drawer:** fields have red \"required\" dots — filters have no required fields (D2).\n- **Date picker on the page (IMG_2519):** the chip with a value has no ×.\n- **Validation (IMG_2520):** two empty Amount range boundaries are shown with an error, but this is a removed filter.\n\n---\n\n# Block F. Filters and the page","html":"\u003ch2>Errors in the current mockups\u003c/h2>\n\u003cp>They don&#39;t change behavior but should be fixed when we get to the visuals:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Drawer (IMG_2522):\u003c/strong> the section titles Amount range, Text input and Date range are centered. All titles must be left-aligned.\u003c/li>\n\u003cli>\u003cstrong>Drawer:\u003c/strong> the Amount range and Text input fields have a calendar icon — they shouldn&#39;t.\u003c/li>\n\u003cli>\u003cstrong>Drawer:\u003c/strong> the footer button is labeled &quot;Save&quot;; it should be &quot;Apply&quot;.\u003c/li>\n\u003cli>\u003cstrong>Drawer:\u003c/strong> fields have red &quot;required&quot; dots — filters have no required fields (D2).\u003c/li>\n\u003cli>\u003cstrong>Date picker on the page (IMG_2519):\u003c/strong> the chip with a value has no ×.\u003c/li>\n\u003cli>\u003cstrong>Validation (IMG_2520):\u003c/strong> two empty Amount range boundaries are shown with an error, but this is a removed filter.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Block F. Filters and the page\u003c/h1>\n"},{"md":"## F1. Persisting filters\n\n⏳ Not started.","html":"\u003ch2>F1. Persisting filters\u003c/h2>\n\u003cp>⏳ Not started.\u003c/p>\n"},{"md":"## F2. Filtering result\n\n⏳ Not started.\n\n---\n\n# Block G. Keyboard and accessibility","html":"\u003ch2>F2. Filtering result\u003c/h2>\n\u003cp>⏳ Not started.\u003c/p>\n\u003chr>\n\u003ch1>Block G. Keyboard and accessibility\u003c/h1>\n"},{"md":"## G1. Focus order, keys, screen readers\n\n⚠️ The rules are currently spread across B5, D1, D2. To be collected here.","html":"\u003ch2>G1. Focus order, keys, screen readers\u003c/h2>\n\u003cp>⚠️ The rules are currently spread across B5, D1, D2. To be collected here.\u003c/p>\n"},{"md":"## Open questions\n\n1. **C5 · Reset button in the drawer** — confirm: one button; labeled Clear all if there are no default values and Reset to default if there are; the reset is applied immediately and closes the drawer.\n2. **D4 · Clear all on the page with default values** — does it clear everything or return to the defaults, like the drawer button? I suggest the latter, and then renaming it the same way, to Reset to default.\n3. **E7 · Switch** — are there filters in the products that actually use the `false` value today? They need to be found and moved to a select before the chip behavior changes.\n4. **F1 · Persisting across tabs** (question from mockup IMG_2352) — are filters shared across all tabs, or does each tab have its own?\n5. **C4 · Long lists** — confirm: a default limit of 6, configurable by the product; Show all only if 2 or more options are hidden; labels Show all (N) / Show less; selected options move to the top when the drawer opens.\n6. **A3, B4, C3 · Quick filters** — confirm the proposals: a quick filter is duplicated in the drawer; applied-filter chips follow the order of the drawer sections; rules of thumb \"up to 5 filters — quick filters only\" and \"no more than 4 quick filters together with All Filters\".\n7. **B2 · Counter on All Filters** — is a badge with the number of applied filters needed (especially in configuration B, where chips may wrap to a second line)? If so, should it count quick filters?\n8. **B3 · Date format in the chip** — Storybook uses `MM/DD/YYYY`, the mockups use `DD/MM/YY`. Pick one (visual, not blocking).\n9. **E3 · Select with an Apply button** (IMG_2512) — keep it as a separate variant (e.g. for options with subtitles) or remove it so Select always applies on click?\n10. **E6 · Date range picker** — confirm: if the second date is earlier than the first, the dates swap; clicking one date twice gives a one-day range.","html":"\u003ch2>Open questions\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>C5 · Reset button in the drawer\u003c/strong> — confirm: one button; labeled Clear all if there are no default values and Reset to default if there are; the reset is applied immediately and closes the drawer.\u003c/li>\n\u003cli>\u003cstrong>D4 · Clear all on the page with default values\u003c/strong> — does it clear everything or return to the defaults, like the drawer button? I suggest the latter, and then renaming it the same way, to Reset to default.\u003c/li>\n\u003cli>\u003cstrong>E7 · Switch\u003c/strong> — are there filters in the products that actually use the \u003ccode>false\u003c/code> value today? They need to be found and moved to a select before the chip behavior changes.\u003c/li>\n\u003cli>\u003cstrong>F1 · Persisting across tabs\u003c/strong> (question from mockup IMG_2352) — are filters shared across all tabs, or does each tab have its own?\u003c/li>\n\u003cli>\u003cstrong>C4 · Long lists\u003c/strong> — confirm: a default limit of 6, configurable by the product; Show all only if 2 or more options are hidden; labels Show all (N) / Show less; selected options move to the top when the drawer opens.\u003c/li>\n\u003cli>\u003cstrong>A3, B4, C3 · Quick filters\u003c/strong> — confirm the proposals: a quick filter is duplicated in the drawer; applied-filter chips follow the order of the drawer sections; rules of thumb &quot;up to 5 filters — quick filters only&quot; and &quot;no more than 4 quick filters together with All Filters&quot;.\u003c/li>\n\u003cli>\u003cstrong>B2 · Counter on All Filters\u003c/strong> — is a badge with the number of applied filters needed (especially in configuration B, where chips may wrap to a second line)? If so, should it count quick filters?\u003c/li>\n\u003cli>\u003cstrong>B3 · Date format in the chip\u003c/strong> — Storybook uses \u003ccode>MM/DD/YYYY\u003c/code>, the mockups use \u003ccode>DD/MM/YY\u003c/code>. Pick one (visual, not blocking).\u003c/li>\n\u003cli>\u003cstrong>E3 · Select with an Apply button\u003c/strong> (IMG_2512) — keep it as a separate variant (e.g. for options with subtitles) or remove it so Select always applies on click?\u003c/li>\n\u003cli>\u003cstrong>E6 · Date range picker\u003c/strong> — confirm: if the second date is earlier than the first, the dates swap; clicking one date twice gives a one-day range.\u003c/li>\n\u003c/ol>\n"}]}}}]</script>

  const UI = {
    ru: { guides: 'Гайдлайны', toc: 'На странице', rich: 'Копировать текст', md: 'Копировать Markdown', sec: 'Копировать раздел',
          copied: 'Скопировано', copiedMd: 'Markdown скопирован', fail: 'Не удалось скопировать — текст выделен, нажмите ⌘C', note: 'Текст копируется с форматированием и вставляется в Confluence или Word как есть.' },
    en: { guides: 'Guidelines', toc: 'On this page', rich: 'Copy text', md: 'Copy Markdown', sec: 'Copy section',
          copied: 'Copied', copiedMd: 'Markdown copied', fail: 'Copy failed — text is selected, press ⌘C', note: 'Text is copied with formatting and pastes into Confluence or Word as is.' }
  };
  let state = { guide: GUIDES[0].id, lang: 'ru' };
  try { const s = JSON.parse(localStorage.getItem('caldera-guides') || '{}'); if (s.lang) state.lang = s.lang; if (s.guide) state.guide = s.guide; } catch (e) {}
  const fromHash = () => {
    const m = location.hash.replace('#', '').match(/^([a-z0-9-]+)-(ru|en)$/);
    if (m && GUIDES.some(g => g.id === m[1])) { state.guide = m[1]; state.lang = m[2]; }
  };
  fromHash();
  if (!GUIDES.some(g => g.id === state.guide)) state.guide = GUIDES[0].id;

  const $ = id => document.getElementById(id);
  const docEl = $('doc');
  let sections = []; // {md, el}
  let fullMd = '';

  function slug(t, i) { return 's' + i + '-' + t.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 40); }

  function render() {
    const g = GUIDES.find(x => x.id === state.guide);
    const t = UI[state.lang];
    const doc = g.docs[state.lang] || g.docs.ru || g.docs.en;
    fullMd = doc.md;
    document.documentElement.lang = state.lang;
    $('rail-title').textContent = t.guides; $('toc-title').textContent = t.toc;
    $('copy-rich').textContent = t.rich; $('copy-md').textContent = t.md;
    ['ru', 'en'].forEach(l => $('lang-' + l).setAttribute('aria-pressed', String(l === state.lang)));

    $('guide-list').innerHTML = ''; $('guide-select').innerHTML = '';
    GUIDES.forEach(x => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'guide-link';
      b.textContent = x.title[state.lang]; b.setAttribute('aria-current', String(x.id === state.guide));
      b.onclick = () => go(x.id, state.lang); $('guide-list').appendChild(b);
      const o = document.createElement('option'); o.value = x.id; o.textContent = x.title[state.lang]; o.selected = x.id === state.guide;
      $('guide-select').appendChild(o);
    });
    const note = document.createElement('p'); note.className = 'rail-note'; note.textContent = t.note; $('guide-list').appendChild(note);

    docEl.innerHTML = ''; sections = [];
    const toc = $('toc-list'); toc.innerHTML = '';
    doc.sections.forEach(({ md, html }, i) => {
      if (i === 0 && !/^## /.test(md)) { const d = document.createElement('div'); d.innerHTML = html; docEl.appendChild(d); sections.push({ md, el: d }); return; }
      const sec = document.createElement('section'); sec.innerHTML = html;
      const h2 = sec.querySelector('h2');
      const id = slug(h2.textContent, i); h2.id = id;
      const head = document.createElement('div'); head.className = 'sec-head';
      h2.replaceWith(head); head.appendChild(h2);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t.sec;
      btn.onclick = () => copyRich(sec, md, btn, true); head.appendChild(btn);
      docEl.appendChild(sec); sections.push({ md, el: sec });
      const li = document.createElement('li'); const a = document.createElement('a'); a.href = '#' + state.guide + '-' + state.lang; a.textContent = h2.textContent; a.dataset.target = id;
      a.onclick = e => { e.preventDefault(); h2.scrollIntoView(); }; li.appendChild(a); toc.appendChild(li);
    });
    docEl.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'table-wrap'; tb.replaceWith(w); w.appendChild(tb); });
    if (location.hash !== '#' + state.guide + '-' + state.lang) history.replaceState(null, '', '#' + state.guide + '-' + state.lang);
    try { localStorage.setItem('caldera-guides', JSON.stringify(state)); } catch (e) {}
    spy();
  }

  function go(guide, lang) { state.guide = guide; state.lang = lang; render(); window.scrollTo(0, 0); }

  function cleanHtml(el, dropFirstButton) {
    const c = el.cloneNode(true);
    c.querySelectorAll('button').forEach(b => b.remove());
    c.querySelectorAll('.sec-head').forEach(h => h.replaceWith(...h.childNodes));
    c.querySelectorAll('.table-wrap').forEach(w => w.replaceWith(...w.childNodes));
    c.querySelectorAll('table').forEach(t => { t.setAttribute('border', '1'); t.style.borderCollapse = 'collapse'; });
    return c;
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
  function mark(btn) { if (!btn) return; const old = btn.textContent; btn.classList.add('done'); btn.textContent = '✓ ' + UI[state.lang].copied; setTimeout(() => { btn.classList.remove('done'); btn.textContent = old; }, 1500); }
  function selectEl(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function copyRich(el, md, btn) {
    const c = cleanHtml(el);
    const html = c.innerHTML; const text = c.innerText || el.innerText;
    const fallback = () => { selectEl(el); toast(UI[state.lang].fail); };
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })])
          .then(() => { mark(btn); toast(UI[state.lang].copied); })
          .catch(() => navigator.clipboard.writeText(text).then(() => { mark(btn); toast(UI[state.lang].copied); }, fallback));
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => { mark(btn); toast(UI[state.lang].copied); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function copyMd(md, btn) {
    try { navigator.clipboard.writeText(md).then(() => { mark(btn); toast(UI[state.lang].copiedMd); }, () => { selectEl(docEl); toast(UI[state.lang].fail); }); }
    catch (e) { selectEl(docEl); toast(UI[state.lang].fail); }
  }

  $('copy-rich').onclick = e => copyRich(docEl, fullMd, e.currentTarget);
  $('copy-md').onclick = e => copyMd(fullMd, e.currentTarget);
  $('lang-ru').onclick = () => go(state.guide, 'ru');
  $('lang-en').onclick = () => go(state.guide, 'en');
  $('guide-select').onchange = e => go(e.target.value, state.lang);
  window.addEventListener('hashchange', () => { fromHash(); render(); });

  function spy() {
    const links = [...document.querySelectorAll('.toc a')];
    let cur = null;
    links.forEach(a => { const h = document.getElementById(a.dataset.target); if (h && h.getBoundingClientRect().top < 120) cur = a; });
    links.forEach(a => a.classList.toggle('active', a === (cur || links[0])));
  }
  window.addEventListener('scroll', spy, { passive: true });

  render();
})();
</script>
