input** | After the label text | |\n| **File upload / Dropzone** | After the upload area label | Format and size requirements go to the Hint, not the tooltip |\n| **Slider / Range** | After the label text | |\n| **Stepper (numeric +/−)** | After the label text | |\n| **Checkbox group** | After the group title (legend) | |\n| **Radio button group** | After the group title (legend) | |\n| **Single Checkbox** | After the checkbox text | Clicking the trigger doesn't toggle the checkbox |\n| **Single Radio option** | After the option text | Clicking the trigger doesn't select the option |\n| **Switch / Toggle** | After the switch label text | If the label is left of the switch — trigger sits between the text and the switch |\n| **Segmented control** | After the control title | Not inside segments |\n| **Form section / Fieldset** | After the section title | |\n\n### 3.2 Data display\n\n| Component | Trigger position | Notes |\n|---|---|---|\n| **Table column header** | After the header text | Clicking the trigger doesn't sort |\n| **Key-value / Description list** | After the key (parameter name) | Not after the value |\n| **Card, section title, page block title** | After the title text | |\n| **Accordion / expandable section** | After the title text | Clicking the trigger doesn't expand or collapse the section |\n| **KPI / Stat tile** | After the metric caption | Typical case: how the metric is calculated |\n| **Chart** | After the chart title or legend item | |\n| **Filter sections in the All Filters drawer** | After the filter name | Clicking the trigger doesn't collapse the section |\n| **Stepper / Wizard steps** | After the step name | Only when the step needs explanation |\n\n### 3.3 Where the trigger is not placed\n- **Inside a button, link, chip, tag, menu item, tab** — a nested interactive element breaks clicking and accessibility. Use a tooltip on the element itself.\n- **Inside an input** (suffix area) — reserved for field icons: clear, show password, calendar, chevron.\n- **In modal and drawer titles** — if the window needs an explanation, put it in the window body.\n- **In table value cells** — a repeating icon in every row clutters the table. Explain in the column header or with a tooltip on the value itself.","html":"\u003ch2>3. Components that get the trigger\u003c/h2>\n\u003ch3>3.1 Inputs and forms\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Component\u003c/th>\n\u003cth>Trigger position\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Input\u003c/strong> (text, number, password, email)\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>Never inside the field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Textarea\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>The character counter stays where it is; the trigger doesn&#39;t move next to it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Select / Dropdown\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Multiselect / Combobox\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Date picker / Date range\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>For a range — one trigger on the shared label, not on each &quot;from / to&quot; field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Amount / Currency input\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>Typical &quot;?&quot; case: rounding rule, limits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Phone input\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>File upload / Dropzone\u003c/strong>\u003c/td>\n\u003ctd>After the upload area label\u003c/td>\n\u003ctd>Format and size requirements go to the Hint, not the tooltip\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Slider / Range\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stepper (numeric +/−)\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Checkbox group\u003c/strong>\u003c/td>\n\u003ctd>After the group title (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Radio button group\u003c/strong>\u003c/td>\n\u003ctd>After the group title (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Single Checkbox\u003c/strong>\u003c/td>\n\u003ctd>After the checkbox text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t toggle the checkbox\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Single Radio option\u003c/strong>\u003c/td>\n\u003ctd>After the option text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t select the option\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Switch / Toggle\u003c/strong>\u003c/td>\n\u003ctd>After the switch label text\u003c/td>\n\u003ctd>If the label is left of the switch — trigger sits between the text and the switch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Segmented control\u003c/strong>\u003c/td>\n\u003ctd>After the control title\u003c/td>\n\u003ctd>Not inside segments\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Form section / Fieldset\u003c/strong>\u003c/td>\n\u003ctd>After the section title\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.2 Data display\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Component\u003c/th>\n\u003cth>Trigger position\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Table column header\u003c/strong>\u003c/td>\n\u003ctd>After the header text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t sort\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Key-value / Description list\u003c/strong>\u003c/td>\n\u003ctd>After the key (parameter name)\u003c/td>\n\u003ctd>Not after the value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Card, section title, page block title\u003c/strong>\u003c/td>\n\u003ctd>After the title text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Accordion / expandable section\u003c/strong>\u003c/td>\n\u003ctd>After the title text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t expand or collapse the section\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>KPI / Stat tile\u003c/strong>\u003c/td>\n\u003ctd>After the metric caption\u003c/td>\n\u003ctd>Typical case: how the metric is calculated\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Chart\u003c/strong>\u003c/td>\n\u003ctd>After the chart title or legend item\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Filter sections in the All Filters drawer\u003c/strong>\u003c/td>\n\u003ctd>After the filter name\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t collapse the section\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stepper / Wizard steps\u003c/strong>\u003c/td>\n\u003ctd>After the step name\u003c/td>\n\u003ctd>Only when the step needs explanation\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.3 Where the trigger is not placed\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Inside a button, link, chip, tag, menu item, tab\u003c/strong> — a nested interactive element breaks clicking and accessibility. Use a tooltip on the element itself.\u003c/li>\n\u003cli>\u003cstrong>Inside an input\u003c/strong> (suffix area) — reserved for field icons: clear, show password, calendar, chevron.\u003c/li>\n\u003cli>\u003cstrong>In modal and drawer titles\u003c/strong> — if the window needs an explanation, put it in the window body.\u003c/li>\n\u003cli>\u003cstrong>In table value cells\u003c/strong> — a repeating icon in every row clutters the table. Explain in the column header or with a tooltip on the value itself.\u003c/li>\n\u003c/ul>\n"},{"md":"## 4. Anatomy of a label with a trigger\n\n```\n[ Label text ][ * ][ 4px ][ (i) ]\n```\n\n- **Order:** label text → required marker `*` (or \"(optional)\") → trigger. The trigger is always the last element of the label.\n- **Gap** between the last label element and the trigger: **4 px** *(proposal)*.\n- **Don't push the trigger to the right edge** of the field (justify-between): the link between icon and text is lost, and on wide fields it drifts away.\n\n### Icon size *(proposal)*\n\n| Label text size | Icon | Hit area |\n|---|---|---|\n| 12 px (S) | 14 px | at least 24 × 24 px |\n| 14 px (M) | 16 px | at least 24 × 24 px |\n| 16 px and up (titles) | 16–20 px | at least 24 × 24 px |\n\nThe hit area is extended with invisible padding and **doesn't affect layout**: the label row height doesn't change because of the trigger.\n\n### Vertical alignment\nThe icon is centered on the **line height of the text line** it sits on, not on the height of the whole label block.\n\n### Icon states\n\n| State | Look |\n|---|---|\n| Default | Secondary icon color (neutral / secondary) |\n| Hover | Darker / primary color, `pointer` cursor (`help` is acceptable in hover mode) |\n| Active (tooltip open in click mode) | Same color as hover, kept while the tooltip is open |\n| Focus | Standard library focus ring |\n| Disabled field | **The trigger stays active**, see 6.4 |\n\nThe icon color doesn't change when the field has an error — it doesn't turn red.","html":"\u003ch2>4. Anatomy of a label with a trigger\u003c/h2>\n\u003cpre>\u003ccode>[ Label text ][ * ][ 4px ][ (i) ]\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Order:\u003c/strong> label text → required marker \u003ccode>*\u003c/code> (or &quot;(optional)&quot;) → trigger. The trigger is always the last element of the label.\u003c/li>\n\u003cli>\u003cstrong>Gap\u003c/strong> between the last label element and the trigger: \u003cstrong>4 px\u003c/strong> \u003cem>(proposal)\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Don&#39;t push the trigger to the right edge\u003c/strong> of the field (justify-between): the link between icon and text is lost, and on wide fields it drifts away.\u003c/li>\n\u003c/ul>\n\u003ch3>Icon size \u003cem>(proposal)\u003c/em>\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Label text size\u003c/th>\n\u003cth>Icon\u003c/th>\n\u003cth>Hit area\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>12 px (S)\u003c/td>\n\u003ctd>14 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14 px (M)\u003c/td>\n\u003ctd>16 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16 px and up (titles)\u003c/td>\n\u003ctd>16–20 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The hit area is extended with invisible padding and \u003cstrong>doesn&#39;t affect layout\u003c/strong>: the label row height doesn&#39;t change because of the trigger.\u003c/p>\n\u003ch3>Vertical alignment\u003c/h3>\n\u003cp>The icon is centered on the \u003cstrong>line height of the text line\u003c/strong> it sits on, not on the height of the whole label block.\u003c/p>\n\u003ch3>Icon states\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>State\u003c/th>\n\u003cth>Look\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Default\u003c/td>\n\u003ctd>Secondary icon color (neutral / secondary)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hover\u003c/td>\n\u003ctd>Darker / primary color, \u003ccode>pointer\u003c/code> cursor (\u003ccode>help\u003c/code> is acceptable in hover mode)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Active (tooltip open in click mode)\u003c/td>\n\u003ctd>Same color as hover, kept while the tooltip is open\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Focus\u003c/td>\n\u003ctd>Standard library focus ring\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disabled field\u003c/td>\n\u003ctd>\u003cstrong>The trigger stays active\u003c/strong>, see 6.4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The icon color doesn&#39;t change when the field has an error — it doesn&#39;t turn red.\u003c/p>\n"},{"md":"## 5. Tooltip position relative to the trigger\n\nBase rules (width, arrow opposite the first line of text, 4 directions) are on the Tooltip page. For the built-in trigger we add:\n\n- **Default direction:** to the right of the trigger (arrow on the left, opposite the first line of text), as in the \"Phone number\" field example.\n- **If there's no room**, the tooltip flips in this order: **right → top → bottom → left**. It never goes off-screen and is never clipped by its container.\n- **In tables and narrow columns** the default is **top** or **bottom**, so neighboring columns aren't covered.\n- The tooltip is rendered **above everything** (portal), so table, card, modal or drawer overflow doesn't clip it.\n- The tooltip may cover the field itself: it's temporary and closes as soon as the user starts typing.\n- **On scroll** the tooltip moves with the trigger. If the trigger leaves the viewport, the tooltip closes.","html":"\u003ch2>5. Tooltip position relative to the trigger\u003c/h2>\n\u003cp>Base rules (width, arrow opposite the first line of text, 4 directions) are on the Tooltip page. For the built-in trigger we add:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Default direction:\u003c/strong> to the right of the trigger (arrow on the left, opposite the first line of text), as in the &quot;Phone number&quot; field example.\u003c/li>\n\u003cli>\u003cstrong>If there&#39;s no room\u003c/strong>, the tooltip flips in this order: \u003cstrong>right → top → bottom → left\u003c/strong>. It never goes off-screen and is never clipped by its container.\u003c/li>\n\u003cli>\u003cstrong>In tables and narrow columns\u003c/strong> the default is \u003cstrong>top\u003c/strong> or \u003cstrong>bottom\u003c/strong>, so neighboring columns aren&#39;t covered.\u003c/li>\n\u003cli>The tooltip is rendered \u003cstrong>above everything\u003c/strong> (portal), so table, card, modal or drawer overflow doesn&#39;t clip it.\u003c/li>\n\u003cli>The tooltip may cover the field itself: it&#39;s temporary and closes as soon as the user starts typing.\u003c/li>\n\u003cli>\u003cstrong>On scroll\u003c/strong> the tooltip moves with the trigger. If the trigger leaves the viewport, the tooltip closes.\u003c/li>\n\u003c/ul>\n"},{"md":"## 6. Edge cases\n\n### 6.1 Long label wraps onto several lines\n- The trigger sits **at the end of the last line**, right after the last word (and the `*` marker).\n- The trigger is **glued to the last word**: the last word, `*` and icon never break apart. The icon never ends up alone on a new line.\n- The icon is centered on the line it sits on.\n\n```\nTax authority division code\nat the place of registration * (i)\n```\n\n✗ Wrong:\n```\nTax authority division code at the place of registration *\n(i)\n```\n\n### 6.2 Label truncated to one line (tables, compact forms)\n- The text is truncated with an ellipsis; **the `*` marker and the trigger are always visible**: `Tax authority divis… * (i)`.\n- The full label text is shown in the trigger tooltip's **header** (Header from the Tooltip anatomy), with the explanation below. This way the user never gets two tooltips (overflow + info) on one label.\n- Constant truncation is a signal to shorten the label.\n\n### 6.3 Label to the left of the field (horizontal form)\n- The trigger follows the label text inside the label column. Wrapping follows rule 6.1.\n- If labels are right-aligned in their column, the trigger still follows the text, and the whole \"text + `*` + trigger\" group is right-aligned.\n\n### 6.4 Disabled or read-only field\n- The trigger **stays active**: it opens and receives focus. Users especially need to understand why a field is unavailable or where its value comes from.\n- If a field is disabled and the reason needs explaining, this trigger is the right place for it.\n\n### 6.5 Field in error state\n- The trigger stays in place, its color doesn't change.\n- The error text goes below the field, not into the tooltip. The tooltip doesn't open automatically on error.\n\n### 6.6 Field without a visible label\n- Don't add a trigger. Explain in a Hint or in the section / column title.\n\n### 6.7 Checkbox or radio with a trigger on an option\n- The trigger is **outside the clickable area** of the option label: clicking it opens the tooltip and **doesn't toggle** the value.\n- Same for a column header (sorting), accordion (expanding), filter section.\n\n### 6.8 Long tooltip text\n- **Hover** mode: up to ~200 characters / 3–4 lines at the recommended width *(proposal)*.\n- Longer text, a header, a link or an action — **click** mode.\n- More than one or two paragraphs — not a tooltip: a \"Learn more\" link or a drawer.\n\n### 6.9 Several tooltips nearby\n- **Only one** tooltip is open at a time. Opening a new one closes the previous one (in both modes).\n\n### 6.10 Loading\n- While the label is a skeleton, the trigger is hidden — it appears together with the text.\n\n### 6.11 Touch devices\n- There's no hover, so a hover-mode tooltip opens on **tap** on the trigger and closes on tap outside.","html":"\u003ch2>6. Edge cases\u003c/h2>\n\u003ch3>6.1 Long label wraps onto several lines\u003c/h3>\n\u003cul>\n\u003cli>The trigger sits \u003cstrong>at the end of the last line\u003c/strong>, right after the last word (and the \u003ccode>*\u003c/code> marker).\u003c/li>\n\u003cli>The trigger is \u003cstrong>glued to the last word\u003c/strong>: the last word, \u003ccode>*\u003c/code> and icon never break apart. The icon never ends up alone on a new line.\u003c/li>\n\u003cli>The icon is centered on the line it sits on.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Tax authority division code\nat the place of registration * (i)\n\u003c/code>\u003c/pre>\n\u003cp>✗ Wrong:\u003c/p>\n\u003cpre>\u003ccode>Tax authority division code at the place of registration *\n(i)\n\u003c/code>\u003c/pre>\n\u003ch3>6.2 Label truncated to one line (tables, compact forms)\u003c/h3>\n\u003cul>\n\u003cli>The text is truncated with an ellipsis; \u003cstrong>the \u003ccode>*\u003c/code> marker and the trigger are always visible\u003c/strong>: \u003ccode>Tax authority divis… * (i)\u003c/code>.\u003c/li>\n\u003cli>The full label text is shown in the trigger tooltip&#39;s \u003cstrong>header\u003c/strong> (Header from the Tooltip anatomy), with the explanation below. This way the user never gets two tooltips (overflow + info) on one label.\u003c/li>\n\u003cli>Constant truncation is a signal to shorten the label.\u003c/li>\n\u003c/ul>\n\u003ch3>6.3 Label to the left of the field (horizontal form)\u003c/h3>\n\u003cul>\n\u003cli>The trigger follows the label text inside the label column. Wrapping follows rule 6.1.\u003c/li>\n\u003cli>If labels are right-aligned in their column, the trigger still follows the text, and the whole &quot;text + \u003ccode>*\u003c/code> + trigger&quot; group is right-aligned.\u003c/li>\n\u003c/ul>\n\u003ch3>6.4 Disabled or read-only field\u003c/h3>\n\u003cul>\n\u003cli>The trigger \u003cstrong>stays active\u003c/strong>: it opens and receives focus. Users especially need to understand why a field is unavailable or where its value comes from.\u003c/li>\n\u003cli>If a field is disabled and the reason needs explaining, this trigger is the right place for it.\u003c/li>\n\u003c/ul>\n\u003ch3>6.5 Field in error state\u003c/h3>\n\u003cul>\n\u003cli>The trigger stays in place, its color doesn&#39;t change.\u003c/li>\n\u003cli>The error text goes below the field, not into the tooltip. The tooltip doesn&#39;t open automatically on error.\u003c/li>\n\u003c/ul>\n\u003ch3>6.6 Field without a visible label\u003c/h3>\n\u003cul>\n\u003cli>Don&#39;t add a trigger. Explain in a Hint or in the section / column title.\u003c/li>\n\u003c/ul>\n\u003ch3>6.7 Checkbox or radio with a trigger on an option\u003c/h3>\n\u003cul>\n\u003cli>The trigger is \u003cstrong>outside the clickable area\u003c/strong> of the option label: clicking it opens the tooltip and \u003cstrong>doesn&#39;t toggle\u003c/strong> the value.\u003c/li>\n\u003cli>Same for a column header (sorting), accordion (expanding), filter section.\u003c/li>\n\u003c/ul>\n\u003ch3>6.8 Long tooltip text\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Hover\u003c/strong> mode: up to ~200 characters / 3–4 lines at the recommended width \u003cem>(proposal)\u003c/em>.\u003c/li>\n\u003cli>Longer text, a header, a link or an action — \u003cstrong>click\u003c/strong> mode.\u003c/li>\n\u003cli>More than one or two paragraphs — not a tooltip: a &quot;Learn more&quot; link or a drawer.\u003c/li>\n\u003c/ul>\n\u003ch3>6.9 Several tooltips nearby\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Only one\u003c/strong> tooltip is open at a time. Opening a new one closes the previous one (in both modes).\u003c/li>\n\u003c/ul>\n\u003ch3>6.10 Loading\u003c/h3>\n\u003cul>\n\u003cli>While the label is a skeleton, the trigger is hidden — it appears together with the text.\u003c/li>\n\u003c/ul>\n\u003ch3>6.11 Touch devices\u003c/h3>\n\u003cul>\n\u003cli>There&#39;s no hover, so a hover-mode tooltip opens on \u003cstrong>tap\u003c/strong> on the trigger and closes on tap outside.\u003c/li>\n\u003c/ul>\n"},{"md":"## 7. Behavior: hover and click\n\nThe mode is set per trigger instance. **Use one mode within a form or table** — users shouldn't have to guess where to hover and where to click.\n\n| | **Hover** (default) | **Click** |\n|---|---|---|\n| When to choose | Short text, no links or actions | Long text, header, link, instruction (\"?\"), text needs to be read while filling in |\n| Opening with a mouse | Hover over the trigger, ~300 ms delay *(proposal)* | Click on the trigger |\n| Opening with a keyboard | Focus on the trigger (Tab) | Enter / Space on the trigger |\n| Closing | Pointer leaves trigger and tooltip, ~150 ms delay *(proposal)*; focus lost; Esc | Close button; click outside; Esc; clicking the trigger again |\n| Close button | No | Yes |\n| Pointer on the tooltip | The tooltip stays open while the pointer is on it (text can be selected and copied) | — |\n| Links and buttons inside | Not allowed | Allowed |\n| Blocks the page | No | No (non-modal) |\n\n### General rules\n- Clicking the trigger **doesn't move focus into the field** and doesn't submit the form (`type=\"button\"`, trigger outside the field's `\u003clabel>` or with default action prevented).\n- After closing with Esc, focus stays on (or returns to) the trigger.\n- In click mode, if there's a link inside, Tab moves focus into the tooltip; after the last element — to the next element on the page.","html":"\u003ch2>7. Behavior: hover and click\u003c/h2>\n\u003cp>The mode is set per trigger instance. \u003cstrong>Use one mode within a form or table\u003c/strong> — users shouldn&#39;t have to guess where to hover and where to click.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>Hover\u003c/strong> (default)\u003c/th>\n\u003cth>\u003cstrong>Click\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>When to choose\u003c/td>\n\u003ctd>Short text, no links or actions\u003c/td>\n\u003ctd>Long text, header, link, instruction (&quot;?&quot;), text needs to be read while filling in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Opening with a mouse\u003c/td>\n\u003ctd>Hover over the trigger, ~300 ms delay \u003cem>(proposal)\u003c/em>\u003c/td>\n\u003ctd>Click on the trigger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Opening with a keyboard\u003c/td>\n\u003ctd>Focus on the trigger (Tab)\u003c/td>\n\u003ctd>Enter / Space on the trigger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Closing\u003c/td>\n\u003ctd>Pointer leaves trigger and tooltip, ~150 ms delay \u003cem>(proposal)\u003c/em>; focus lost; Esc\u003c/td>\n\u003ctd>Close button; click outside; Esc; clicking the trigger again\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Close button\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pointer on the tooltip\u003c/td>\n\u003ctd>The tooltip stays open while the pointer is on it (text can be selected and copied)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Links and buttons inside\u003c/td>\n\u003ctd>Not allowed\u003c/td>\n\u003ctd>Allowed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blocks the page\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>No (non-modal)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>General rules\u003c/h3>\n\u003cul>\n\u003cli>Clicking the trigger \u003cstrong>doesn&#39;t move focus into the field\u003c/strong> and doesn&#39;t submit the form (\u003ccode>type=&quot;button&quot;\u003c/code>, trigger outside the field&#39;s \u003ccode>&lt;label&gt;\u003c/code> or with default action prevented).\u003c/li>\n\u003cli>After closing with Esc, focus stays on (or returns to) the trigger.\u003c/li>\n\u003cli>In click mode, if there&#39;s a link inside, Tab moves focus into the tooltip; after the last element — to the next element on the page.\u003c/li>\n\u003c/ul>\n"},{"md":"## 8. Accessibility\n\n- The trigger is a `\u003cbutton type=\"button\">`, not an icon with a click handler.\n- The trigger has an accessible name: `aria-label=\"More info: \u003clabel text>\"`, not just \"Info\".\n- Hover mode: the tooltip has `role=\"tooltip\"` and is linked to the trigger via `aria-describedby`.\n- Click mode: the tooltip is linked to the trigger via `aria-expanded` + `aria-controls`.\n- Icon contrast against the background in the default state is at least 3:1.\n- Hit area is at least 24 × 24 px.\n- The tooltip opens and closes with the keyboard, not only with a mouse.","html":"\u003ch2>8. Accessibility\u003c/h2>\n\u003cul>\n\u003cli>The trigger is a \u003ccode>&lt;button type=&quot;button&quot;&gt;\u003c/code>, not an icon with a click handler.\u003c/li>\n\u003cli>The trigger has an accessible name: \u003ccode>aria-label=&quot;More info: &lt;label text&gt;&quot;\u003c/code>, not just &quot;Info&quot;.\u003c/li>\n\u003cli>Hover mode: the tooltip has \u003ccode>role=&quot;tooltip&quot;\u003c/code> and is linked to the trigger via \u003ccode>aria-describedby\u003c/code>.\u003c/li>\n\u003cli>Click mode: the tooltip is linked to the trigger via \u003ccode>aria-expanded\u003c/code> + \u003ccode>aria-controls\u003c/code>.\u003c/li>\n\u003cli>Icon contrast against the background in the default state is at least 3:1.\u003c/li>\n\u003cli>Hit area is at least 24 × 24 px.\u003c/li>\n\u003cli>The tooltip opens and closes with the keyboard, not only with a mouse.\u003c/li>\n\u003c/ul>\n"},{"md":"## 9. Tooltip text\n\n- 1–3 short sentences. Sentence case, ending with a period.\n- Doesn't repeat the label: not \"Tax ID is the company's tax ID\", but what it is and where to find it.\n- No critical information: anything required to fill the field goes to the Hint.\n- \"i\" answers \"what is this / how does it work\", \"?\" answers \"what should I do / where do I get it\".","html":"\u003ch2>9. Tooltip text\u003c/h2>\n\u003cul>\n\u003cli>1–3 short sentences. Sentence case, ending with a period.\u003c/li>\n\u003cli>Doesn&#39;t repeat the label: not &quot;Tax ID is the company&#39;s tax ID&quot;, but what it is and where to find it.\u003c/li>\n\u003cli>No critical information: anything required to fill the field goes to the Hint.\u003c/li>\n\u003cli>&quot;i&quot; answers &quot;what is this / how does it work&quot;, &quot;?&quot; answers &quot;what should I do / where do I get it&quot;.\u003c/li>\n\u003c/ul>\n"},{"md":"## 10. Component properties\n\n### In Pixso (on every base component from section 3)\n\n| Property | Values |\n|---|---|\n| `Tooltip trigger` | boolean, default false |\n| `Trigger icon` | `i` / `?` |\n\nThe tooltip itself isn't baked into the component — on mockups it's shown as a separate Tooltip component instance next to the trigger.\n\n### For development (reference)\n\n| Property | Values | Default |\n|---|---|---|\n| `tooltip.content` | text / node | — |\n| `tooltip.header` | text | — |\n| `tooltip.icon` | `info` / `help` | `info` |\n| `tooltip.trigger` | `hover` / `click` | `hover` |\n| `tooltip.placement` | `right` / `top` / `bottom` / `left` | `right` (`top` in tables) |\n| `tooltip.theme` | `dark` / `light` | see question 3 below |","html":"\u003ch2>10. Component properties\u003c/h2>\n\u003ch3>In Pixso (on every base component from section 3)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Property\u003c/th>\n\u003cth>Values\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Tooltip trigger\u003c/code>\u003c/td>\n\u003ctd>boolean, default false\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Trigger icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>i\u003c/code> / \u003ccode>?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The tooltip itself isn&#39;t baked into the component — on mockups it&#39;s shown as a separate Tooltip component instance next to the trigger.\u003c/p>\n\u003ch3>For development (reference)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Property\u003c/th>\n\u003cth>Values\u003c/th>\n\u003cth>Default\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>tooltip.content\u003c/code>\u003c/td>\n\u003ctd>text / node\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.header\u003c/code>\u003c/td>\n\u003ctd>text\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code> / \u003ccode>help\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.trigger\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code> / \u003ccode>click\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.placement\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> / \u003ccode>top\u003c/code> / \u003ccode>bottom\u003c/code> / \u003ccode>left\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> (\u003ccode>top\u003c/code> in tables)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.theme\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>dark\u003c/code> / \u003ccode>light\u003c/code>\u003c/td>\n\u003ctd>see question 3 below\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## 11. Do / Don't checklist\n\n✅ Trigger right after the label text and the `*` marker\n✅ Trigger glued to the last word when wrapping\n✅ Trigger and `*` always visible when the label is truncated\n✅ Trigger active on a disabled field\n✅ One mode (hover or click) within a form\n✅ Clicking the trigger doesn't toggle or sort anything\n\n❌ Trigger inside a field, button, chip, tab\n❌ Trigger pushed to the right edge of the field\n❌ Validation errors in the tooltip\n❌ Information everyone needs hidden in a tooltip\n❌ Icon alone on a new line\n❌ Two tooltips on one label (overflow + info)","html":"\u003ch2>11. Do / Don&#39;t checklist\u003c/h2>\n\u003cp>✅ Trigger right after the label text and the \u003ccode>*\u003c/code> marker\n✅ Trigger glued to the last word when wrapping\n✅ Trigger and \u003ccode>*\u003c/code> always visible when the label is truncated\n✅ Trigger active on a disabled field\n✅ One mode (hover or click) within a form\n✅ Clicking the trigger doesn&#39;t toggle or sort anything\u003c/p>\n\u003cp>❌ Trigger inside a field, button, chip, tab\n❌ Trigger pushed to the right edge of the field\n❌ Validation errors in the tooltip\n❌ Information everyone needs hidden in a tooltip\n❌ Icon alone on a new line\n❌ Two tooltips on one label (overflow + info)\u003c/p>\n"},{"md":"## 12. Open questions for the team\n\n1. **Max tooltip width:** the English Tooltip page shows `max-width: 320px` in the example but says 500 px in the text; the Russian page says 250 px recommended, 500 px max. We need one value.\n2. **Hover delays:** 300 ms to open, 150 ms to close — agree with developers.\n3. **Default theme** for the built-in trigger: dark or light tooltip?\n4. **Cursor in hover mode:** `pointer` or `help`?\n5. **Text length limit** for hover mode: is ~200 characters OK?","html":"\u003ch2>12. Open questions for the team\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Max tooltip width:\u003c/strong> the English Tooltip page shows \u003ccode>max-width: 320px\u003c/code> in the example but says 500 px in the text; the Russian page says 250 px recommended, 500 px max. We need one value.\u003c/li>\n\u003cli>\u003cstrong>Hover delays:\u003c/strong> 300 ms to open, 150 ms to close — agree with developers.\u003c/li>\n\u003cli>\u003cstrong>Default theme\u003c/strong> for the built-in trigger: dark or light tooltip?\u003c/li>\n\u003cli>\u003cstrong>Cursor in hover mode:\u003c/strong> \u003ccode>pointer\u003c/code> or \u003ccode>help\u003c/code>?\u003c/li>\n\u003cli>\u003cstrong>Text length limit\u003c/strong> for hover mode: is ~200 characters OK?\u003c/li>\n\u003c/ol>\n"}]}}}]</script>
<script>
(function () {
  const GUIDES = JSON.parse(document.getElementById('guides-data').textContent);
  const UI = {
    ru: { guides: 'Гайдлайны', toc: 'На странице', rich: 'Копировать текст', md: 'Копировать Markdown', sec: 'Копировать раздел',
          copied: 'Скопировано', copiedMd: 'Markdown скопирован', fail: 'Не удалось скопировать — текст выделен, нажмите ⌘C', note: 'Текст копируется с форматированием и вставляется в Confluence или Word как есть.' },
    en: { guides: 'Guidelines', toc: 'On this page', rich: 'Copy text', md: 'Copy Markdown', sec: 'Copy section',
          copied: 'Copied', copiedMd: 'Markdown copied', fail: 'Copy failed — text is selected, press ⌘C', note: 'Text is copied with formatting and pastes into Confluence or Word as is.' }
  };
  let state = { guide: GUIDES[0].id, lang: 'ru' };
  try { const s = JSON.parse(localStorage.getItem('caldera-guides') || '{}'); if (s.lang) state.lang = s.lang; if (s.guide) state.guide = s.guide; } catch (e) {}
  const fromHash = () => {
    const m = location.hash.replace('#', '').match(/^([a-z0-9-]+)-(ru|en)$/);
    if (m && GUIDES.some(g => g.id === m[1])) { state.guide = m[1]; state.lang = m[2]; }
  };
  fromHash();
  if (!GUIDES.some(g => g.id === state.guide)) state.guide = GUIDES[0].id;

  const $ = id => document.getElementById(id);
  const docEl = $('doc');
  let sections = []; // {md, el}
  let fullMd = '';

  function slug(t, i) { return 's' + i + '-' + t.toLowerCase().replace(/[^a-zа-яё0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 40); }

  function render() {
    const g = GUIDES.find(x => x.id === state.guide);
    const t = UI[state.lang];
    const doc = g.docs[state.lang] || g.docs.ru || g.docs.en;
    fullMd = doc.md;
    document.documentElement.lang = state.lang;
    $('rail-title').textContent = t.guides; $('toc-title').textContent = t.toc;
    $('copy-rich').textContent = t.rich; $('copy-md').textContent = t.md;
    ['ru', 'en'].forEach(l => $('lang-' + l).setAttribute('aria-pressed', String(l === state.lang)));

    $('guide-list').innerHTML = ''; $('guide-select').innerHTML = '';
    GUIDES.forEach(x => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'guide-link';
      b.textContent = x.title[state.lang]; b.setAttribute('aria-current', String(x.id === state.guide));
      b.onclick = () => go(x.id, state.lang); $('guide-list').appendChild(b);
      const o = document.createElement('option'); o.value = x.id; o.textContent = x.title[state.lang]; o.selected = x.id === state.guide;
      $('guide-select').appendChild(o);
    });
    const note = document.createElement('p'); note.className = 'rail-note'; note.textContent = t.note; $('guide-list').appendChild(note);

    docEl.innerHTML = ''; sections = [];
    const toc = $('toc-list'); toc.innerHTML = '';
    doc.sections.forEach(({ md, html }, i) => {
      if (i === 0 && !/^## /.test(md)) { const d = document.createElement('div'); d.innerHTML = html; docEl.appendChild(d); sections.push({ md, el: d }); return; }
      const sec = document.createElement('section'); sec.innerHTML = html;
      const h2 = sec.querySelector('h2');
      const id = slug(h2.textContent, i); h2.id = id;
      const head = document.createElement('div'); head.className = 'sec-head';
      h2.replaceWith(head); head.appendChild(h2);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = t.sec;
      btn.onclick = () => copyRich(sec, md, btn, true); head.appendChild(btn);
      docEl.appendChild(sec); sections.push({ md, el: sec });
      const li = document.createElement('li'); const a = document.createElement('a'); a.href = '#' + state.guide + '-' + state.lang; a.textContent = h2.textContent; a.dataset.target = id;
      a.onclick = e => { e.preventDefault(); h2.scrollIntoView(); }; li.appendChild(a); toc.appendChild(li);
    });
    docEl.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'table-wrap'; tb.replaceWith(w); w.appendChild(tb); });
    if (location.hash !== '#' + state.guide + '-' + state.lang) history.replaceState(null, '', '#' + state.guide + '-' + state.lang);
    try { localStorage.setItem('caldera-guides', JSON.stringify(state)); } catch (e) {}
    spy();
  }

  function go(guide, lang) { state.guide = guide; state.lang = lang; render(); window.scrollTo(0, 0); }

  function cleanHtml(el, dropFirstButton) {
    const c = el.cloneNode(true);
    c.querySelectorAll('button').forEach(b => b.remove());
    c.querySelectorAll('.sec-head').forEach(h => h.replaceWith(...h.childNodes));
    c.querySelectorAll('.table-wrap').forEach(w => w.replaceWith(...w.childNodes));
    c.querySelectorAll('table').forEach(t => { t.setAttribute('border', '1'); t.style.borderCollapse = 'collapse'; });
    return c;
  }

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 1800); }
  function mark(btn) { if (!btn) return; const old = btn.textContent; btn.classList.add('done'); btn.textContent = '✓ ' + UI[state.lang].copied; setTimeout(() => { btn.classList.remove('done'); btn.textContent = old; }, 1500); }
  function selectEl(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function copyRich(el, md, btn) {
    const c = cleanHtml(el);
    const html = c.innerHTML; const text = c.innerText || el.innerText;
    const fallback = () => { selectEl(el); toast(UI[state.lang].fail); };
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })])
          .then(() => { mark(btn); toast(UI[state.lang].copied); })
          .catch(() => navigator.clipboard.writeText(text).then(() => { mark(btn); toast(UI[state.lang].copied); }, fallback));
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => { mark(btn); toast(UI[state.lang].copied); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function copyMd(md, btn) {
    try { navigator.clipboard.writeText(md).then(() => { mark(btn); toast(UI[state.lang].copiedMd); }, () => { selectEl(docEl); toast(UI[state.lang].fail); }); }
    catch (e) { selectEl(docEl); toast(UI[state.lang].fail); }
  }

  $('copy-rich').onclick = e => copyRich(docEl, fullMd, e.currentTarget);
  $('copy-md').onclick = e => copyMd(fullMd, e.currentTarget);
  $('lang-ru').onclick = () => go(state.guide, 'ru');
  $('lang-en').onclick = () => go(state.guide, 'en');
  $('guide-select').onchange = e => go(e.target.value, state.lang);
  window.addEventListener('hashchange', () => { fromHash(); render(); });

  function spy() {
    const links = [...document.querySelectorAll('.toc a')];
    let cur = null;
    links.forEach(a => { const h = document.getElementById(a.dataset.target); if (h && h.getBoundingClientRect().top < 120) cur = a; });
    links.forEach(a => a.classList.toggle('active', a === (cur || links[0])));
  }
  window.addEventListener('scroll', spy, { passive: true });

  render();
})();
</script>
