<script id="guides-data" type="application/json">[{"id":"tooltip","title":{"ru":"Тултип-триггер «i» / «?»","en":"Tooltip trigger \"i\" / \"?\""},"docs":{"ru":{"md":"# Тултип-триггер («i» / «?») в базовых компонентах — гайдлайны\n\nСтатус: черновик v0.1 · 27.11.2026\nТекущие гайдлайны Tooltip (фото): `screens/tooltip/` (IMG_2619–2622)\nАнглийская версия: `Caldera-tooltip-trigger-guidelines-en.md`\n\n> Документ дополняет существующую страницу **Tooltip** (анатомия, ширина, стрелка, цвет, триггеры hover / click, отличия «i» / «?»). Здесь описано, **куда и как** триггер встраивается в базовые компоненты, как он себя ведёт и что делать в пограничных случаях. Всё, что уже описано на странице Tooltip, здесь не повторяется, только упоминается.\n>\n> Числа с пометкой *«предложение»* нужно сверить с токенами библиотеки.\n\n---\n\n## 1. Термины\n\n| Термин | Что это |\n|---|---|\n| **Триггер** | Иконка-кнопка «i» или «?», по которой открывается тултип. Самостоятельный интерактивный элемент, а не часть текста лейбла. |\n| **Info-триггер «i»** | Уточняющая информация: формат, правило, справка. Не нужна для выполнения действия. |\n| **Help-триггер «?»** | Помощь там, где возможны ошибки и непонимание: объяснение термина, инструкция, ссылка на поддержку. |\n| **Тултип** | Облако с текстом (опционально — заголовок и крестик), которое открывает триггер. См. страницу Tooltip. |\n| **Режим hover** | Тултип открывается наведением / фокусом и закрывается, когда курсор или фокус уходит. Без крестика. |\n| **Режим click** | Тултип открывается кликом и остаётся открытым до явного закрытия. С крестиком. |\n| **Hint** | Постоянный вспомогательный текст под полем. Альтернатива тултипу, см. раздел 2. |\n\n---\n\n## 2. Когда добавлять триггер, а когда нет\n\n### Добавляем, если\n- информация полезна **части** пользователей, а не всем: формат, источник данных, правило расчёта, что значит термин;\n- без неё можно выполнить действие, но с ней — проще и с меньшим числом ошибок;\n- текст короткий: 1–3 предложения.\n\n### Не добавляем — используем другое\n\n| Ситуация | Вместо триггера |\n|---|---|\n| Информация нужна **всем** для заполнения (формат даты, ограничение длины, обязательное условие) | **Hint** под полем — он виден всегда |\n| Сообщение об ошибке, валидация | Текст ошибки под полем (состояние Error) |\n| Пример значения | Placeholder или Hint |\n| Длинная инструкция, несколько абзацев, таблица, список шагов | Ссылка «Подробнее» / дровер / страница помощи |\n| Пояснение к недоступной кнопке | Тултип на самой кнопке (обёртке), без отдельной иконки |\n| Обрезанный текст, который нужно показать целиком | Тултип на самом тексте (overflow-тултип), без иконки |\n\n### Правила количества\n- Не больше **одного** триггера на лейбл.\n- Не ставим «i» и «?» в одном лейбле.\n- Если триггер нужен почти у каждого поля формы — пересматриваем тексты лейблов или переносим пояснения в Hint: стена иконок перестаёт работать.\n- Не дублируем: если у группы есть триггер на заголовке, у каждой опции его ставим только при реальной необходимости.\n\n---\n\n## 3. Компоненты, в которые встраивается триггер\n\n### 3.1 Поля ввода и формы\n\n| Компонент | Куда ставится триггер | Примечания |\n|---|---|---|\n| **Input** (text, number, password, email) | После текста лейбла | Не внутри поля |\n| **Textarea** | После текста лейбла | Счётчик символов остаётся на своём месте, триггер к нему не переносится |\n| **Select / Dropdown** | После текста лейбла | |\n| **Multiselect / Combobox** | После текста лейбла | |\n| **Date picker / Date range** | После текста лейбла | Для range — один триггер на общий лейбл, не на каждое поле «с / по» |\n| **Amount / Currency input** | После текста лейбла | Типичный кейс для «?»: правило округления, лимиты |\n| **Phone input** | После текста лейбла | |\n| **File upload / Dropzone** | После лейбла зоны загрузки | Требования к формату и размеру — в Hint, не в тултипе |\n| **Slider / Range** | После текста лейбла | |\n| **Stepper (числовой +/−)** | После текста лейбла | |\n| **Checkbox group** | После заголовка группы (legend) | |\n| **Radio button group** | После заголовка группы (legend) | |\n| **Отдельный Checkbox** | После текста чекбокса | Клик по триггеру не переключает чекбокс |\n| **Отдельная опция Radio** | После текста опции | Клик по триггеру не выбирает опцию |\n| **Switch / Toggle** | После текста лейбла свитча | Если лейбл слева от свитча — триггер между текстом и свитчем |\n| **Segmented control** | После заголовка контрола | Не внутри сегментов |\n| **Секция формы / Fieldset** | После заголовка секции | |\n\n### 3.2 Отображение данных\n\n| Компонент | Куда ставится триггер | Примечания |\n|---|---|---|\n| **Заголовок колонки таблицы** | После текста заголовка | Клик по триггеру не запускает сортировку |\n| **Key-value / Description list** | После ключа (названия параметра) | Не после значения |\n| **Карточка, заголовок секции, заголовок блока на странице** | После текста заголовка | |\n| **Accordion / раскрываемая секция** | После текста заголовка | Клик по триггеру не раскрывает и не сворачивает секцию |\n| **KPI / Stat tile** | После подписи метрики | Типичный кейс: как считается показатель |\n| **График** | После заголовка графика или пункта легенды | |\n| **Секции фильтров в дровере All Filters** | После названия фильтра | Клик по триггеру не сворачивает секцию |\n| **Шаги Stepper / Wizard** | После названия шага | Только если шаг требует пояснения |\n\n### 3.3 Где триггер не ставим\n- **Внутри кнопки, ссылки, чипа, тега, пункта меню, таба** — вложенный интерактивный элемент ломает клик и доступность. Пояснение даём тултипом на самом элементе.\n- **Внутри поля ввода** (в зоне суффикса) — зона занята иконками поля: очистка, глаз, календарь, шеврон.\n- **В заголовках модалок и дроверов** — если окну нужно пояснение, оно пишется в теле окна.\n- **В ячейках таблицы со значениями** — повторяющаяся иконка в каждой строке перегружает таблицу. Пояснение — в заголовке колонки или тултипом на самом значении.\n\n---\n\n## 4. Анатомия лейбла с триггером\n\n```\n[ Текст лейбла ][ * ][ 4px ][ (i) ]\n```\n\n- **Порядок:** текст лейбла → маркер обязательности `*` (или «(необязательно)») → триггер. Триггер всегда последний элемент лейбла.\n- **Отступ** между последним элементом лейбла и триггером: **4 px** *(предложение)*.\n- **Не прижимаем триггер к правому краю** поля (justify-between): связь иконки с текстом теряется, на широких полях она «уезжает».\n\n### Размер иконки *(предложение)*\n\n| Размер текста лейбла | Иконка | Зона клика |\n|---|---|---|\n| 12 px (S) | 14 px | не меньше 24 × 24 px |\n| 14 px (M) | 16 px | не меньше 24 × 24 px |\n| 16 px и больше (заголовки) | 16–20 px | не меньше 24 × 24 px |\n\nЗона клика расширяется невидимым padding и **не влияет на раскладку**: высота строки лейбла не меняется из-за триггера.\n\n### Вертикальное выравнивание\nИконка центрируется по **высоте строки текста** (line-height), на которой она стоит, а не по высоте всего блока лейбла.\n\n### Состояния иконки\n\n| Состояние | Вид |\n|---|---|\n| Default | Вторичный цвет иконок (neutral / secondary) |\n| Hover | Цвет темнее / primary, курсор `pointer` (в режиме hover можно `help`) |\n| Active (тултип открыт в режиме click) | Цвет как у hover, остаётся, пока тултип открыт |\n| Focus | Стандартный focus ring библиотеки |\n| Disabled поле | **Триггер остаётся активным**, см. 6.4 |\n\nЦвет иконки не меняется при ошибке в поле — она не красится в красный.\n\n---\n\n## 5. Расположение тултипа относительно триггера\n\nБазовые правила (ширина, стрелка напротив первой строки текста, 4 направления) — на странице Tooltip. Для встроенного триггера добавляем:\n\n- **Направление по умолчанию:** справа от триггера (стрелка слева, напротив первой строки текста), как в примере с полем «Номер телефона».\n- **Если места нет**, тултип переворачивается в порядке: **справа → сверху → снизу → слева**. Тултип никогда не выходит за пределы экрана и не обрезается контейнером.\n- **В таблицах и узких колонках** по умолчанию — **сверху** или **снизу**, чтобы не перекрывать соседние колонки.\n- Тултип рендерится **поверх всего слоя** (portal), поэтому его не обрезают overflow таблицы, карточки, модалки или дровера.\n- Тултип может перекрывать само поле: он временный и закрывается, как только пользователь переходит к вводу.\n- **При скролле** тултип движется вместе с триггером. Если триггер ушёл из видимой области — тултип закрывается.\n\n---\n\n## 6. Пограничные случаи\n\n### 6.1 Длинный лейбл переносится на несколько строк\n- Триггер стоит **в конце последней строки**, сразу после последнего слова (и маркера `*`).\n- Триггер **«приклеен» к последнему слову**: последнее слово, `*` и иконка не разрываются переносом. Иконка никогда не оказывается одна на новой строке.\n- Иконка выравнивается по центру той строки, на которой стоит.\n\n```\nКод подразделения налогового\nоргана по месту учёта * (i)\n```\n\n✗ Неправильно:\n```\nКод подразделения налогового органа по месту учёта *\n(i)\n```\n\n### 6.2 Лейбл обрезается в одну строку (таблицы, компактные формы)\n- Текст обрезается многоточием, **маркер `*` и триггер остаются видимыми** всегда: `Код подразделения нал… * (i)`.\n- Полный текст лейбла показывается в **заголовке тултипа** триггера (Header из анатомии Tooltip), а под ним — пояснение. Так пользователь не получает два тултипа (overflow + info) на одном лейбле.\n- Если обрезка постоянная — сигнал сократить лейбл.\n\n### 6.3 Лейбл слева от поля (горизонтальная форма)\n- Триггер после текста лейбла, внутри колонки лейблов. Перенос — по правилу 6.1.\n- Если лейблы выровнены по правому краю колонки, триггер всё равно стоит после текста, и вся группа «текст + `*` + триггер» выравнивается вправо.\n\n### 6.4 Поле disabled или read-only\n- Триггер **остаётся активным**: открывается, получает фокус. Пользователю особенно важно понять, почему поле недоступно или откуда взялось значение.\n- Если поле disabled и нужно объяснить причину — это можно сделать именно через этот триггер.\n\n### 6.5 Поле в состоянии ошибки\n- Триггер остаётся на месте, цвет не меняется.\n- Текст ошибки — под полем, а не в тултипе. Тултип при ошибке автоматически не открывается.\n\n### 6.6 Поле без видимого лейбла\n- Триггер не добавляем. Пояснение — в Hint или в заголовке секции / колонки.\n\n### 6.7 Чекбокс или радио с триггером на опции\n- Триггер находится **вне кликабельной зоны** лейбла опции: клик по нему открывает тултип и **не переключает** значение.\n- То же для заголовка колонки (сортировка), аккордеона (раскрытие), секции фильтра.\n\n### 6.8 Длинный текст тултипа\n- Режим **hover**: до ~200 символов / 3–4 строк при рекомендуемой ширине *(предложение)*.\n- Длиннее, есть заголовок, ссылка или действие — режим **click**.\n- Больше одного-двух абзацев — не тултип: ссылка «Подробнее» или дровер.\n\n### 6.9 Несколько тултипов рядом\n- Одновременно открыт **только один** тултип. Открытие нового закрывает предыдущий (в обоих режимах).\n\n### 6.10 Загрузка\n- Пока лейбл в состоянии skeleton, триггер не показывается — появляется вместе с текстом.\n\n### 6.11 Тач-устройства\n- Hover нет, поэтому тултип в режиме hover открывается **тапом** по триггеру и закрывается тапом вне тултипа.\n\n---\n\n## 7. Поведение: hover и click\n\nРежим задаётся у каждого экземпляра триггера. **Внутри одной формы или таблицы режим один** — пользователь не должен угадывать, где навести, а где кликнуть.\n\n| | **Hover** (по умолчанию) | **Click** |\n|---|---|---|\n| Когда выбирать | Короткий текст, без ссылок и действий | Длинный текст, заголовок, ссылка, инструкция («?»), текст нужно читать во время заполнения |\n| Открытие мышью | Наведение на триггер, задержка ~300 мс *(предложение)* | Клик по триггеру |\n| Открытие с клавиатуры | Фокус на триггере (Tab) | Enter / Space на триггере |\n| Закрытие | Курсор ушёл с триггера и тултипа, задержка ~150 мс *(предложение)*; потеря фокуса; Esc | Крестик; клик вне тултипа; Esc; повторный клик по триггеру |\n| Крестик | Нет | Есть |\n| Курсор на тултипе | Тултип не закрывается, пока курсор на нём (текст можно выделить и скопировать) | — |\n| Ссылки и кнопки внутри | Нельзя | Можно |\n| Блокирует страницу | Нет | Нет (не модальный) |\n\n### Общие правила\n- Клик по триггеру **не передаёт фокус в поле** и не отправляет форму (`type=\"button\"`, триггер вне `\u003clabel>` поля или с отменой действия по умолчанию).\n- После закрытия по Esc фокус остаётся (или возвращается) на триггере.\n- В режиме click, если внутри есть ссылка, Tab переводит фокус внутрь тултипа; после последнего элемента — к следующему элементу страницы.\n\n---\n\n## 8. Доступность\n\n- Триггер — это `\u003cbutton type=\"button\">`, а не иконка с обработчиком клика.\n- У триггера есть доступное имя: `aria-label=\"Подробнее: \u003cтекст лейбла>\"`, а не просто «Информация».\n- Режим hover: тултип `role=\"tooltip\"`, связан с триггером через `aria-describedby`.\n- Режим click: тултип связан с триггером через `aria-expanded` + `aria-controls`.\n- Иконка в default-состоянии — контраст с фоном не ниже 3:1.\n- Зона клика — не меньше 24 × 24 px.\n- Тултип открывается и закрывается с клавиатуры, не только мышью.\n\n---\n\n## 9. Текст тултипа\n\n- 1–3 коротких предложения. С заглавной буквы, с точкой в конце.\n- Не повторяет лейбл: не «ИНН — это ИНН компании», а что это и где его найти.\n- Не содержит критичной информации: всё, без чего нельзя заполнить поле, — в Hint.\n- «i» отвечает на вопрос «что это / как это устроено», «?» — «что делать / где взять».\n\n---\n\n## 10. Свойства компонента\n\n### В Pixso (у каждого базового компонента из раздела 3)\n\n| Свойство | Значения |\n|---|---|\n| `Tooltip trigger` | boolean, по умолчанию false |\n| `Trigger icon` | `i` / `?` |\n\nСам тултип в компонент не вшивается — на макетах он показывается отдельным экземпляром компонента Tooltip рядом с триггером.\n\n### Для разработки (ориентир)\n\n| Свойство | Значения | По умолчанию |\n|---|---|---|\n| `tooltip.content` | текст / узел | — |\n| `tooltip.header` | текст | — |\n| `tooltip.icon` | `info` / `help` | `info` |\n| `tooltip.trigger` | `hover` / `click` | `hover` |\n| `tooltip.placement` | `right` / `top` / `bottom` / `left` | `right` (в таблице `top`) |\n| `tooltip.theme` | `dark` / `light` | см. вопрос 3 ниже |\n\n---\n\n## 11. Чек-лист Do / Don't\n\n✅ Триггер сразу после текста лейбла и маркера `*`\n✅ Триггер приклеен к последнему слову при переносе\n✅ При обрезке лейбла триггер и `*` видны всегда\n✅ Триггер активен у disabled-поля\n✅ Один режим (hover или click) внутри формы\n✅ Клик по триггеру ничего не переключает и не сортирует\n\n❌ Триггер внутри поля, кнопки, чипа, таба\n❌ Триггер прижат к правому краю поля\n❌ Ошибки валидации в тултипе\n❌ Информация, нужная всем, спрятана в тултип\n❌ Иконка одна на новой строке\n❌ Два тултипа на одном лейбле (overflow + info)\n\n---\n\n## 12. Открытые вопросы к команде\n\n1. **Максимальная ширина тултипа:** в английской версии страницы Tooltip на примере `max-width: 320px`, в тексте — 500 px; в русской — рекомендуемая 250 px, максимальная 500 px. Нужно одно значение.\n2. **Задержки hover:** 300 мс на открытие, 150 мс на закрытие — согласовать с разработкой.\n3. **Тема по умолчанию** для встроенного триггера: тёмный или светлый тултип?\n4. **Курсор в режиме hover:** `pointer` или `help`?\n5. **Лимит длины текста** для режима hover: ~200 символов — ок?\n","sections":[{"md":"# Тултип-триггер («i» / «?») в базовых компонентах — гайдлайны\n\nСтатус: черновик v0.1 · 27.11.2026\nТекущие гайдлайны Tooltip (фото): `screens/tooltip/` (IMG_2619–2622)\nАнглийская версия: `Caldera-tooltip-trigger-guidelines-en.md`\n\n> Документ дополняет существующую страницу **Tooltip** (анатомия, ширина, стрелка, цвет, триггеры hover / click, отличия «i» / «?»). Здесь описано, **куда и как** триггер встраивается в базовые компоненты, как он себя ведёт и что делать в пограничных случаях. Всё, что уже описано на странице Tooltip, здесь не повторяется, только упоминается.\n>\n> Числа с пометкой *«предложение»* нужно сверить с токенами библиотеки.","html":"\u003ch1>Тултип-триггер («i» / «?») в базовых компонентах — гайдлайны\u003c/h1>\n\u003cp>Статус: черновик v0.1 · 27.11.2026\nТекущие гайдлайны Tooltip (фото): \u003ccode>screens/tooltip/\u003c/code> (IMG_2619–2622)\nАнглийская версия: \u003ccode>Caldera-tooltip-trigger-guidelines-en.md\u003c/code>\u003c/p>\n\u003cblockquote>\n\u003cp>Документ дополняет существующую страницу \u003cstrong>Tooltip\u003c/strong> (анатомия, ширина, стрелка, цвет, триггеры hover / click, отличия «i» / «?»). Здесь описано, \u003cstrong>куда и как\u003c/strong> триггер встраивается в базовые компоненты, как он себя ведёт и что делать в пограничных случаях. Всё, что уже описано на странице Tooltip, здесь не повторяется, только упоминается.\u003c/p>\n\u003cp>Числа с пометкой \u003cem>«предложение»\u003c/em> нужно сверить с токенами библиотеки.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## 1. Термины\n\n| Термин | Что это |\n|---|---|\n| **Триггер** | Иконка-кнопка «i» или «?», по которой открывается тултип. Самостоятельный интерактивный элемент, а не часть текста лейбла. |\n| **Info-триггер «i»** | Уточняющая информация: формат, правило, справка. Не нужна для выполнения действия. |\n| **Help-триггер «?»** | Помощь там, где возможны ошибки и непонимание: объяснение термина, инструкция, ссылка на поддержку. |\n| **Тултип** | Облако с текстом (опционально — заголовок и крестик), которое открывает триггер. См. страницу Tooltip. |\n| **Режим hover** | Тултип открывается наведением / фокусом и закрывается, когда курсор или фокус уходит. Без крестика. |\n| **Режим click** | Тултип открывается кликом и остаётся открытым до явного закрытия. С крестиком. |\n| **Hint** | Постоянный вспомогательный текст под полем. Альтернатива тултипу, см. раздел 2. |","html":"\u003ch2>1. Термины\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Что это\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Триггер\u003c/strong>\u003c/td>\n\u003ctd>Иконка-кнопка «i» или «?», по которой открывается тултип. Самостоятельный интерактивный элемент, а не часть текста лейбла.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Info-триггер «i»\u003c/strong>\u003c/td>\n\u003ctd>Уточняющая информация: формат, правило, справка. Не нужна для выполнения действия.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Help-триггер «?»\u003c/strong>\u003c/td>\n\u003ctd>Помощь там, где возможны ошибки и непонимание: объяснение термина, инструкция, ссылка на поддержку.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Тултип\u003c/strong>\u003c/td>\n\u003ctd>Облако с текстом (опционально — заголовок и крестик), которое открывает триггер. См. страницу Tooltip.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Режим hover\u003c/strong>\u003c/td>\n\u003ctd>Тултип открывается наведением / фокусом и закрывается, когда курсор или фокус уходит. Без крестика.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Режим click\u003c/strong>\u003c/td>\n\u003ctd>Тултип открывается кликом и остаётся открытым до явного закрытия. С крестиком.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hint\u003c/strong>\u003c/td>\n\u003ctd>Постоянный вспомогательный текст под полем. Альтернатива тултипу, см. раздел 2.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## 2. Когда добавлять триггер, а когда нет\n\n### Добавляем, если\n- информация полезна **части** пользователей, а не всем: формат, источник данных, правило расчёта, что значит термин;\n- без неё можно выполнить действие, но с ней — проще и с меньшим числом ошибок;\n- текст короткий: 1–3 предложения.\n\n### Не добавляем — используем другое\n\n| Ситуация | Вместо триггера |\n|---|---|\n| Информация нужна **всем** для заполнения (формат даты, ограничение длины, обязательное условие) | **Hint** под полем — он виден всегда |\n| Сообщение об ошибке, валидация | Текст ошибки под полем (состояние Error) |\n| Пример значения | Placeholder или Hint |\n| Длинная инструкция, несколько абзацев, таблица, список шагов | Ссылка «Подробнее» / дровер / страница помощи |\n| Пояснение к недоступной кнопке | Тултип на самой кнопке (обёртке), без отдельной иконки |\n| Обрезанный текст, который нужно показать целиком | Тултип на самом тексте (overflow-тултип), без иконки |\n\n### Правила количества\n- Не больше **одного** триггера на лейбл.\n- Не ставим «i» и «?» в одном лейбле.\n- Если триггер нужен почти у каждого поля формы — пересматриваем тексты лейблов или переносим пояснения в Hint: стена иконок перестаёт работать.\n- Не дублируем: если у группы есть триггер на заголовке, у каждой опции его ставим только при реальной необходимости.","html":"\u003ch2>2. Когда добавлять триггер, а когда нет\u003c/h2>\n\u003ch3>Добавляем, если\u003c/h3>\n\u003cul>\n\u003cli>информация полезна \u003cstrong>части\u003c/strong> пользователей, а не всем: формат, источник данных, правило расчёта, что значит термин;\u003c/li>\n\u003cli>без неё можно выполнить действие, но с ней — проще и с меньшим числом ошибок;\u003c/li>\n\u003cli>текст короткий: 1–3 предложения.\u003c/li>\n\u003c/ul>\n\u003ch3>Не добавляем — используем другое\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Ситуация\u003c/th>\n\u003cth>Вместо триггера\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Информация нужна \u003cstrong>всем\u003c/strong> для заполнения (формат даты, ограничение длины, обязательное условие)\u003c/td>\n\u003ctd>\u003cstrong>Hint\u003c/strong> под полем — он виден всегда\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Сообщение об ошибке, валидация\u003c/td>\n\u003ctd>Текст ошибки под полем (состояние Error)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Пример значения\u003c/td>\n\u003ctd>Placeholder или Hint\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Длинная инструкция, несколько абзацев, таблица, список шагов\u003c/td>\n\u003ctd>Ссылка «Подробнее» / дровер / страница помощи\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Пояснение к недоступной кнопке\u003c/td>\n\u003ctd>Тултип на самой кнопке (обёртке), без отдельной иконки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Обрезанный текст, который нужно показать целиком\u003c/td>\n\u003ctd>Тултип на самом тексте (overflow-тултип), без иконки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Правила количества\u003c/h3>\n\u003cul>\n\u003cli>Не больше \u003cstrong>одного\u003c/strong> триггера на лейбл.\u003c/li>\n\u003cli>Не ставим «i» и «?» в одном лейбле.\u003c/li>\n\u003cli>Если триггер нужен почти у каждого поля формы — пересматриваем тексты лейблов или переносим пояснения в Hint: стена иконок перестаёт работать.\u003c/li>\n\u003cli>Не дублируем: если у группы есть триггер на заголовке, у каждой опции его ставим только при реальной необходимости.\u003c/li>\n\u003c/ul>\n"},{"md":"## 3. Компоненты, в которые встраивается триггер\n\n### 3.1 Поля ввода и формы\n\n| Компонент | Куда ставится триггер | Примечания |\n|---|---|---|\n| **Input** (text, number, password, email) | После текста лейбла | Не внутри поля |\n| **Textarea** | После текста лейбла | Счётчик символов остаётся на своём месте, триггер к нему не переносится |\n| **Select / Dropdown** | После текста лейбла | |\n| **Multiselect / Combobox** | После текста лейбла | |\n| **Date picker / Date range** | После текста лейбла | Для range — один триггер на общий лейбл, не на каждое поле «с / по» |\n| **Amount / Currency input** | После текста лейбла | Типичный кейс для «?»: правило округления, лимиты |\n| **Phone input** | После текста лейбла | |\n| **File upload / Dropzone** | После лейбла зоны загрузки | Требования к формату и размеру — в Hint, не в тултипе |\n| **Slider / Range** | После текста лейбла | |\n| **Stepper (числовой +/−)** | После текста лейбла | |\n| **Checkbox group** | После заголовка группы (legend) | |\n| **Radio button group** | После заголовка группы (legend) | |\n| **Отдельный Checkbox** | После текста чекбокса | Клик по триггеру не переключает чекбокс |\n| **Отдельная опция Radio** | После текста опции | Клик по триггеру не выбирает опцию |\n| **Switch / Toggle** | После текста лейбла свитча | Если лейбл слева от свитча — триггер между текстом и свитчем |\n| **Segmented control** | После заголовка контрола | Не внутри сегментов |\n| **Секция формы / Fieldset** | После заголовка секции | |\n\n### 3.2 Отображение данных\n\n| Компонент | Куда ставится триггер | Примечания |\n|---|---|---|\n| **Заголовок колонки таблицы** | После текста заголовка | Клик по триггеру не запускает сортировку |\n| **Key-value / Description list** | После ключа (названия параметра) | Не после значения |\n| **Карточка, заголовок секции, заголовок блока на странице** | После текста заголовка | |\n| **Accordion / раскрываемая секция** | После текста заголовка | Клик по триггеру не раскрывает и не сворачивает секцию |\n| **KPI / Stat tile** | После подписи метрики | Типичный кейс: как считается показатель |\n| **График** | После заголовка графика или пункта легенды | |\n| **Секции фильтров в дровере All Filters** | После названия фильтра | Клик по триггеру не сворачивает секцию |\n| **Шаги Stepper / Wizard** | После названия шага | Только если шаг требует пояснения |\n\n### 3.3 Где триггер не ставим\n- **Внутри кнопки, ссылки, чипа, тега, пункта меню, таба** — вложенный интерактивный элемент ломает клик и доступность. Пояснение даём тултипом на самом элементе.\n- **Внутри поля ввода** (в зоне суффикса) — зона занята иконками поля: очистка, глаз, календарь, шеврон.\n- **В заголовках модалок и дроверов** — если окну нужно пояснение, оно пишется в теле окна.\n- **В ячейках таблицы со значениями** — повторяющаяся иконка в каждой строке перегружает таблицу. Пояснение — в заголовке колонки или тултипом на самом значении.","html":"\u003ch2>3. Компоненты, в которые встраивается триггер\u003c/h2>\n\u003ch3>3.1 Поля ввода и формы\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Компонент\u003c/th>\n\u003cth>Куда ставится триггер\u003c/th>\n\u003cth>Примечания\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Input\u003c/strong> (text, number, password, email)\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>Не внутри поля\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Textarea\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>Счётчик символов остаётся на своём месте, триггер к нему не переносится\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Select / Dropdown\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Multiselect / Combobox\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Date picker / Date range\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>Для range — один триггер на общий лейбл, не на каждое поле «с / по»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Amount / Currency input\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>Типичный кейс для «?»: правило округления, лимиты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Phone input\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>File upload / Dropzone\u003c/strong>\u003c/td>\n\u003ctd>После лейбла зоны загрузки\u003c/td>\n\u003ctd>Требования к формату и размеру — в Hint, не в тултипе\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Slider / Range\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stepper (числовой +/−)\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Checkbox group\u003c/strong>\u003c/td>\n\u003ctd>После заголовка группы (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Radio button group\u003c/strong>\u003c/td>\n\u003ctd>После заголовка группы (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Отдельный Checkbox\u003c/strong>\u003c/td>\n\u003ctd>После текста чекбокса\u003c/td>\n\u003ctd>Клик по триггеру не переключает чекбокс\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Отдельная опция Radio\u003c/strong>\u003c/td>\n\u003ctd>После текста опции\u003c/td>\n\u003ctd>Клик по триггеру не выбирает опцию\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Switch / Toggle\u003c/strong>\u003c/td>\n\u003ctd>После текста лейбла свитча\u003c/td>\n\u003ctd>Если лейбл слева от свитча — триггер между текстом и свитчем\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Segmented control\u003c/strong>\u003c/td>\n\u003ctd>После заголовка контрола\u003c/td>\n\u003ctd>Не внутри сегментов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Секция формы / Fieldset\u003c/strong>\u003c/td>\n\u003ctd>После заголовка секции\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.2 Отображение данных\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Компонент\u003c/th>\n\u003cth>Куда ставится триггер\u003c/th>\n\u003cth>Примечания\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Заголовок колонки таблицы\u003c/strong>\u003c/td>\n\u003ctd>После текста заголовка\u003c/td>\n\u003ctd>Клик по триггеру не запускает сортировку\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Key-value / Description list\u003c/strong>\u003c/td>\n\u003ctd>После ключа (названия параметра)\u003c/td>\n\u003ctd>Не после значения\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Карточка, заголовок секции, заголовок блока на странице\u003c/strong>\u003c/td>\n\u003ctd>После текста заголовка\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Accordion / раскрываемая секция\u003c/strong>\u003c/td>\n\u003ctd>После текста заголовка\u003c/td>\n\u003ctd>Клик по триггеру не раскрывает и не сворачивает секцию\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>KPI / Stat tile\u003c/strong>\u003c/td>\n\u003ctd>После подписи метрики\u003c/td>\n\u003ctd>Типичный кейс: как считается показатель\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>График\u003c/strong>\u003c/td>\n\u003ctd>После заголовка графика или пункта легенды\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Секции фильтров в дровере All Filters\u003c/strong>\u003c/td>\n\u003ctd>После названия фильтра\u003c/td>\n\u003ctd>Клик по триггеру не сворачивает секцию\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Шаги Stepper / Wizard\u003c/strong>\u003c/td>\n\u003ctd>После названия шага\u003c/td>\n\u003ctd>Только если шаг требует пояснения\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.3 Где триггер не ставим\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Внутри кнопки, ссылки, чипа, тега, пункта меню, таба\u003c/strong> — вложенный интерактивный элемент ломает клик и доступность. Пояснение даём тултипом на самом элементе.\u003c/li>\n\u003cli>\u003cstrong>Внутри поля ввода\u003c/strong> (в зоне суффикса) — зона занята иконками поля: очистка, глаз, календарь, шеврон.\u003c/li>\n\u003cli>\u003cstrong>В заголовках модалок и дроверов\u003c/strong> — если окну нужно пояснение, оно пишется в теле окна.\u003c/li>\n\u003cli>\u003cstrong>В ячейках таблицы со значениями\u003c/strong> — повторяющаяся иконка в каждой строке перегружает таблицу. Пояснение — в заголовке колонки или тултипом на самом значении.\u003c/li>\n\u003c/ul>\n"},{"md":"## 4. Анатомия лейбла с триггером\n\n```\n[ Текст лейбла ][ * ][ 4px ][ (i) ]\n```\n\n- **Порядок:** текст лейбла → маркер обязательности `*` (или «(необязательно)») → триггер. Триггер всегда последний элемент лейбла.\n- **Отступ** между последним элементом лейбла и триггером: **4 px** *(предложение)*.\n- **Не прижимаем триггер к правому краю** поля (justify-between): связь иконки с текстом теряется, на широких полях она «уезжает».\n\n### Размер иконки *(предложение)*\n\n| Размер текста лейбла | Иконка | Зона клика |\n|---|---|---|\n| 12 px (S) | 14 px | не меньше 24 × 24 px |\n| 14 px (M) | 16 px | не меньше 24 × 24 px |\n| 16 px и больше (заголовки) | 16–20 px | не меньше 24 × 24 px |\n\nЗона клика расширяется невидимым padding и **не влияет на раскладку**: высота строки лейбла не меняется из-за триггера.\n\n### Вертикальное выравнивание\nИконка центрируется по **высоте строки текста** (line-height), на которой она стоит, а не по высоте всего блока лейбла.\n\n### Состояния иконки\n\n| Состояние | Вид |\n|---|---|\n| Default | Вторичный цвет иконок (neutral / secondary) |\n| Hover | Цвет темнее / primary, курсор `pointer` (в режиме hover можно `help`) |\n| Active (тултип открыт в режиме click) | Цвет как у hover, остаётся, пока тултип открыт |\n| Focus | Стандартный focus ring библиотеки |\n| Disabled поле | **Триггер остаётся активным**, см. 6.4 |\n\nЦвет иконки не меняется при ошибке в поле — она не красится в красный.","html":"\u003ch2>4. Анатомия лейбла с триггером\u003c/h2>\n\u003cpre>\u003ccode>[ Текст лейбла ][ * ][ 4px ][ (i) ]\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Порядок:\u003c/strong> текст лейбла → маркер обязательности \u003ccode>*\u003c/code> (или «(необязательно)») → триггер. Триггер всегда последний элемент лейбла.\u003c/li>\n\u003cli>\u003cstrong>Отступ\u003c/strong> между последним элементом лейбла и триггером: \u003cstrong>4 px\u003c/strong> \u003cem>(предложение)\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Не прижимаем триггер к правому краю\u003c/strong> поля (justify-between): связь иконки с текстом теряется, на широких полях она «уезжает».\u003c/li>\n\u003c/ul>\n\u003ch3>Размер иконки \u003cem>(предложение)\u003c/em>\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Размер текста лейбла\u003c/th>\n\u003cth>Иконка\u003c/th>\n\u003cth>Зона клика\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>12 px (S)\u003c/td>\n\u003ctd>14 px\u003c/td>\n\u003ctd>не меньше 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14 px (M)\u003c/td>\n\u003ctd>16 px\u003c/td>\n\u003ctd>не меньше 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16 px и больше (заголовки)\u003c/td>\n\u003ctd>16–20 px\u003c/td>\n\u003ctd>не меньше 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Зона клика расширяется невидимым padding и \u003cstrong>не влияет на раскладку\u003c/strong>: высота строки лейбла не меняется из-за триггера.\u003c/p>\n\u003ch3>Вертикальное выравнивание\u003c/h3>\n\u003cp>Иконка центрируется по \u003cstrong>высоте строки текста\u003c/strong> (line-height), на которой она стоит, а не по высоте всего блока лейбла.\u003c/p>\n\u003ch3>Состояния иконки\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Состояние\u003c/th>\n\u003cth>Вид\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Default\u003c/td>\n\u003ctd>Вторичный цвет иконок (neutral / secondary)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hover\u003c/td>\n\u003ctd>Цвет темнее / primary, курсор \u003ccode>pointer\u003c/code> (в режиме hover можно \u003ccode>help\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Active (тултип открыт в режиме click)\u003c/td>\n\u003ctd>Цвет как у hover, остаётся, пока тултип открыт\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Focus\u003c/td>\n\u003ctd>Стандартный focus ring библиотеки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disabled поле\u003c/td>\n\u003ctd>\u003cstrong>Триггер остаётся активным\u003c/strong>, см. 6.4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Цвет иконки не меняется при ошибке в поле — она не красится в красный.\u003c/p>\n"},{"md":"## 5. Расположение тултипа относительно триггера\n\nБазовые правила (ширина, стрелка напротив первой строки текста, 4 направления) — на странице Tooltip. Для встроенного триггера добавляем:\n\n- **Направление по умолчанию:** справа от триггера (стрелка слева, напротив первой строки текста), как в примере с полем «Номер телефона».\n- **Если места нет**, тултип переворачивается в порядке: **справа → сверху → снизу → слева**. Тултип никогда не выходит за пределы экрана и не обрезается контейнером.\n- **В таблицах и узких колонках** по умолчанию — **сверху** или **снизу**, чтобы не перекрывать соседние колонки.\n- Тултип рендерится **поверх всего слоя** (portal), поэтому его не обрезают overflow таблицы, карточки, модалки или дровера.\n- Тултип может перекрывать само поле: он временный и закрывается, как только пользователь переходит к вводу.\n- **При скролле** тултип движется вместе с триггером. Если триггер ушёл из видимой области — тултип закрывается.","html":"\u003ch2>5. Расположение тултипа относительно триггера\u003c/h2>\n\u003cp>Базовые правила (ширина, стрелка напротив первой строки текста, 4 направления) — на странице Tooltip. Для встроенного триггера добавляем:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Направление по умолчанию:\u003c/strong> справа от триггера (стрелка слева, напротив первой строки текста), как в примере с полем «Номер телефона».\u003c/li>\n\u003cli>\u003cstrong>Если места нет\u003c/strong>, тултип переворачивается в порядке: \u003cstrong>справа → сверху → снизу → слева\u003c/strong>. Тултип никогда не выходит за пределы экрана и не обрезается контейнером.\u003c/li>\n\u003cli>\u003cstrong>В таблицах и узких колонках\u003c/strong> по умолчанию — \u003cstrong>сверху\u003c/strong> или \u003cstrong>снизу\u003c/strong>, чтобы не перекрывать соседние колонки.\u003c/li>\n\u003cli>Тултип рендерится \u003cstrong>поверх всего слоя\u003c/strong> (portal), поэтому его не обрезают overflow таблицы, карточки, модалки или дровера.\u003c/li>\n\u003cli>Тултип может перекрывать само поле: он временный и закрывается, как только пользователь переходит к вводу.\u003c/li>\n\u003cli>\u003cstrong>При скролле\u003c/strong> тултип движется вместе с триггером. Если триггер ушёл из видимой области — тултип закрывается.\u003c/li>\n\u003c/ul>\n"},{"md":"## 6. Пограничные случаи\n\n### 6.1 Длинный лейбл переносится на несколько строк\n- Триггер стоит **в конце последней строки**, сразу после последнего слова (и маркера `*`).\n- Триггер **«приклеен» к последнему слову**: последнее слово, `*` и иконка не разрываются переносом. Иконка никогда не оказывается одна на новой строке.\n- Иконка выравнивается по центру той строки, на которой стоит.\n\n```\nКод подразделения налогового\nоргана по месту учёта * (i)\n```\n\n✗ Неправильно:\n```\nКод подразделения налогового органа по месту учёта *\n(i)\n```\n\n### 6.2 Лейбл обрезается в одну строку (таблицы, компактные формы)\n- Текст обрезается многоточием, **маркер `*` и триггер остаются видимыми** всегда: `Код подразделения нал… * (i)`.\n- Полный текст лейбла показывается в **заголовке тултипа** триггера (Header из анатомии Tooltip), а под ним — пояснение. Так пользователь не получает два тултипа (overflow + info) на одном лейбле.\n- Если обрезка постоянная — сигнал сократить лейбл.\n\n### 6.3 Лейбл слева от поля (горизонтальная форма)\n- Триггер после текста лейбла, внутри колонки лейблов. Перенос — по правилу 6.1.\n- Если лейблы выровнены по правому краю колонки, триггер всё равно стоит после текста, и вся группа «текст + `*` + триггер» выравнивается вправо.\n\n### 6.4 Поле disabled или read-only\n- Триггер **остаётся активным**: открывается, получает фокус. Пользователю особенно важно понять, почему поле недоступно или откуда взялось значение.\n- Если поле disabled и нужно объяснить причину — это можно сделать именно через этот триггер.\n\n### 6.5 Поле в состоянии ошибки\n- Триггер остаётся на месте, цвет не меняется.\n- Текст ошибки — под полем, а не в тултипе. Тултип при ошибке автоматически не открывается.\n\n### 6.6 Поле без видимого лейбла\n- Триггер не добавляем. Пояснение — в Hint или в заголовке секции / колонки.\n\n### 6.7 Чекбокс или радио с триггером на опции\n- Триггер находится **вне кликабельной зоны** лейбла опции: клик по нему открывает тултип и **не переключает** значение.\n- То же для заголовка колонки (сортировка), аккордеона (раскрытие), секции фильтра.\n\n### 6.8 Длинный текст тултипа\n- Режим **hover**: до ~200 символов / 3–4 строк при рекомендуемой ширине *(предложение)*.\n- Длиннее, есть заголовок, ссылка или действие — режим **click**.\n- Больше одного-двух абзацев — не тултип: ссылка «Подробнее» или дровер.\n\n### 6.9 Несколько тултипов рядом\n- Одновременно открыт **только один** тултип. Открытие нового закрывает предыдущий (в обоих режимах).\n\n### 6.10 Загрузка\n- Пока лейбл в состоянии skeleton, триггер не показывается — появляется вместе с текстом.\n\n### 6.11 Тач-устройства\n- Hover нет, поэтому тултип в режиме hover открывается **тапом** по триггеру и закрывается тапом вне тултипа.","html":"\u003ch2>6. Пограничные случаи\u003c/h2>\n\u003ch3>6.1 Длинный лейбл переносится на несколько строк\u003c/h3>\n\u003cul>\n\u003cli>Триггер стоит \u003cstrong>в конце последней строки\u003c/strong>, сразу после последнего слова (и маркера \u003ccode>*\u003c/code>).\u003c/li>\n\u003cli>Триггер \u003cstrong>«приклеен» к последнему слову\u003c/strong>: последнее слово, \u003ccode>*\u003c/code> и иконка не разрываются переносом. Иконка никогда не оказывается одна на новой строке.\u003c/li>\n\u003cli>Иконка выравнивается по центру той строки, на которой стоит.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Код подразделения налогового\nоргана по месту учёта * (i)\n\u003c/code>\u003c/pre>\n\u003cp>✗ Неправильно:\u003c/p>\n\u003cpre>\u003ccode>Код подразделения налогового органа по месту учёта *\n(i)\n\u003c/code>\u003c/pre>\n\u003ch3>6.2 Лейбл обрезается в одну строку (таблицы, компактные формы)\u003c/h3>\n\u003cul>\n\u003cli>Текст обрезается многоточием, \u003cstrong>маркер \u003ccode>*\u003c/code> и триггер остаются видимыми\u003c/strong> всегда: \u003ccode>Код подразделения нал… * (i)\u003c/code>.\u003c/li>\n\u003cli>Полный текст лейбла показывается в \u003cstrong>заголовке тултипа\u003c/strong> триггера (Header из анатомии Tooltip), а под ним — пояснение. Так пользователь не получает два тултипа (overflow + info) на одном лейбле.\u003c/li>\n\u003cli>Если обрезка постоянная — сигнал сократить лейбл.\u003c/li>\n\u003c/ul>\n\u003ch3>6.3 Лейбл слева от поля (горизонтальная форма)\u003c/h3>\n\u003cul>\n\u003cli>Триггер после текста лейбла, внутри колонки лейблов. Перенос — по правилу 6.1.\u003c/li>\n\u003cli>Если лейблы выровнены по правому краю колонки, триггер всё равно стоит после текста, и вся группа «текст + \u003ccode>*\u003c/code> + триггер» выравнивается вправо.\u003c/li>\n\u003c/ul>\n\u003ch3>6.4 Поле disabled или read-only\u003c/h3>\n\u003cul>\n\u003cli>Триггер \u003cstrong>остаётся активным\u003c/strong>: открывается, получает фокус. Пользователю особенно важно понять, почему поле недоступно или откуда взялось значение.\u003c/li>\n\u003cli>Если поле disabled и нужно объяснить причину — это можно сделать именно через этот триггер.\u003c/li>\n\u003c/ul>\n\u003ch3>6.5 Поле в состоянии ошибки\u003c/h3>\n\u003cul>\n\u003cli>Триггер остаётся на месте, цвет не меняется.\u003c/li>\n\u003cli>Текст ошибки — под полем, а не в тултипе. Тултип при ошибке автоматически не открывается.\u003c/li>\n\u003c/ul>\n\u003ch3>6.6 Поле без видимого лейбла\u003c/h3>\n\u003cul>\n\u003cli>Триггер не добавляем. Пояснение — в Hint или в заголовке секции / колонки.\u003c/li>\n\u003c/ul>\n\u003ch3>6.7 Чекбокс или радио с триггером на опции\u003c/h3>\n\u003cul>\n\u003cli>Триггер находится \u003cstrong>вне кликабельной зоны\u003c/strong> лейбла опции: клик по нему открывает тултип и \u003cstrong>не переключает\u003c/strong> значение.\u003c/li>\n\u003cli>То же для заголовка колонки (сортировка), аккордеона (раскрытие), секции фильтра.\u003c/li>\n\u003c/ul>\n\u003ch3>6.8 Длинный текст тултипа\u003c/h3>\n\u003cul>\n\u003cli>Режим \u003cstrong>hover\u003c/strong>: до ~200 символов / 3–4 строк при рекомендуемой ширине \u003cem>(предложение)\u003c/em>.\u003c/li>\n\u003cli>Длиннее, есть заголовок, ссылка или действие — режим \u003cstrong>click\u003c/strong>.\u003c/li>\n\u003cli>Больше одного-двух абзацев — не тултип: ссылка «Подробнее» или дровер.\u003c/li>\n\u003c/ul>\n\u003ch3>6.9 Несколько тултипов рядом\u003c/h3>\n\u003cul>\n\u003cli>Одновременно открыт \u003cstrong>только один\u003c/strong> тултип. Открытие нового закрывает предыдущий (в обоих режимах).\u003c/li>\n\u003c/ul>\n\u003ch3>6.10 Загрузка\u003c/h3>\n\u003cul>\n\u003cli>Пока лейбл в состоянии skeleton, триггер не показывается — появляется вместе с текстом.\u003c/li>\n\u003c/ul>\n\u003ch3>6.11 Тач-устройства\u003c/h3>\n\u003cul>\n\u003cli>Hover нет, поэтому тултип в режиме hover открывается \u003cstrong>тапом\u003c/strong> по триггеру и закрывается тапом вне тултипа.\u003c/li>\n\u003c/ul>\n"},{"md":"## 7. Поведение: hover и click\n\nРежим задаётся у каждого экземпляра триггера. **Внутри одной формы или таблицы режим один** — пользователь не должен угадывать, где навести, а где кликнуть.\n\n| | **Hover** (по умолчанию) | **Click** |\n|---|---|---|\n| Когда выбирать | Короткий текст, без ссылок и действий | Длинный текст, заголовок, ссылка, инструкция («?»), текст нужно читать во время заполнения |\n| Открытие мышью | Наведение на триггер, задержка ~300 мс *(предложение)* | Клик по триггеру |\n| Открытие с клавиатуры | Фокус на триггере (Tab) | Enter / Space на триггере |\n| Закрытие | Курсор ушёл с триггера и тултипа, задержка ~150 мс *(предложение)*; потеря фокуса; Esc | Крестик; клик вне тултипа; Esc; повторный клик по триггеру |\n| Крестик | Нет | Есть |\n| Курсор на тултипе | Тултип не закрывается, пока курсор на нём (текст можно выделить и скопировать) | — |\n| Ссылки и кнопки внутри | Нельзя | Можно |\n| Блокирует страницу | Нет | Нет (не модальный) |\n\n### Общие правила\n- Клик по триггеру **не передаёт фокус в поле** и не отправляет форму (`type=\"button\"`, триггер вне `\u003clabel>` поля или с отменой действия по умолчанию).\n- После закрытия по Esc фокус остаётся (или возвращается) на триггере.\n- В режиме click, если внутри есть ссылка, Tab переводит фокус внутрь тултипа; после последнего элемента — к следующему элементу страницы.","html":"\u003ch2>7. Поведение: hover и click\u003c/h2>\n\u003cp>Режим задаётся у каждого экземпляра триггера. \u003cstrong>Внутри одной формы или таблицы режим один\u003c/strong> — пользователь не должен угадывать, где навести, а где кликнуть.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>Hover\u003c/strong> (по умолчанию)\u003c/th>\n\u003cth>\u003cstrong>Click\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Когда выбирать\u003c/td>\n\u003ctd>Короткий текст, без ссылок и действий\u003c/td>\n\u003ctd>Длинный текст, заголовок, ссылка, инструкция («?»), текст нужно читать во время заполнения\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Открытие мышью\u003c/td>\n\u003ctd>Наведение на триггер, задержка ~300 мс \u003cem>(предложение)\u003c/em>\u003c/td>\n\u003ctd>Клик по триггеру\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Открытие с клавиатуры\u003c/td>\n\u003ctd>Фокус на триггере (Tab)\u003c/td>\n\u003ctd>Enter / Space на триггере\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Закрытие\u003c/td>\n\u003ctd>Курсор ушёл с триггера и тултипа, задержка ~150 мс \u003cem>(предложение)\u003c/em>; потеря фокуса; Esc\u003c/td>\n\u003ctd>Крестик; клик вне тултипа; Esc; повторный клик по триггеру\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Крестик\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003ctd>Есть\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Курсор на тултипе\u003c/td>\n\u003ctd>Тултип не закрывается, пока курсор на нём (текст можно выделить и скопировать)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ссылки и кнопки внутри\u003c/td>\n\u003ctd>Нельзя\u003c/td>\n\u003ctd>Можно\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Блокирует страницу\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003ctd>Нет (не модальный)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Общие правила\u003c/h3>\n\u003cul>\n\u003cli>Клик по триггеру \u003cstrong>не передаёт фокус в поле\u003c/strong> и не отправляет форму (\u003ccode>type=&quot;button&quot;\u003c/code>, триггер вне \u003ccode>&lt;label&gt;\u003c/code> поля или с отменой действия по умолчанию).\u003c/li>\n\u003cli>После закрытия по Esc фокус остаётся (или возвращается) на триггере.\u003c/li>\n\u003cli>В режиме click, если внутри есть ссылка, Tab переводит фокус внутрь тултипа; после последнего элемента — к следующему элементу страницы.\u003c/li>\n\u003c/ul>\n"},{"md":"## 8. Доступность\n\n- Триггер — это `\u003cbutton type=\"button\">`, а не иконка с обработчиком клика.\n- У триггера есть доступное имя: `aria-label=\"Подробнее: \u003cтекст лейбла>\"`, а не просто «Информация».\n- Режим hover: тултип `role=\"tooltip\"`, связан с триггером через `aria-describedby`.\n- Режим click: тултип связан с триггером через `aria-expanded` + `aria-controls`.\n- Иконка в default-состоянии — контраст с фоном не ниже 3:1.\n- Зона клика — не меньше 24 × 24 px.\n- Тултип открывается и закрывается с клавиатуры, не только мышью.","html":"\u003ch2>8. Доступность\u003c/h2>\n\u003cul>\n\u003cli>Триггер — это \u003ccode>&lt;button type=&quot;button&quot;&gt;\u003c/code>, а не иконка с обработчиком клика.\u003c/li>\n\u003cli>У триггера есть доступное имя: \u003ccode>aria-label=&quot;Подробнее: &lt;текст лейбла&gt;&quot;\u003c/code>, а не просто «Информация».\u003c/li>\n\u003cli>Режим hover: тултип \u003ccode>role=&quot;tooltip&quot;\u003c/code>, связан с триггером через \u003ccode>aria-describedby\u003c/code>.\u003c/li>\n\u003cli>Режим click: тултип связан с триггером через \u003ccode>aria-expanded\u003c/code> + \u003ccode>aria-controls\u003c/code>.\u003c/li>\n\u003cli>Иконка в default-состоянии — контраст с фоном не ниже 3:1.\u003c/li>\n\u003cli>Зона клика — не меньше 24 × 24 px.\u003c/li>\n\u003cli>Тултип открывается и закрывается с клавиатуры, не только мышью.\u003c/li>\n\u003c/ul>\n"},{"md":"## 9. Текст тултипа\n\n- 1–3 коротких предложения. С заглавной буквы, с точкой в конце.\n- Не повторяет лейбл: не «ИНН — это ИНН компании», а что это и где его найти.\n- Не содержит критичной информации: всё, без чего нельзя заполнить поле, — в Hint.\n- «i» отвечает на вопрос «что это / как это устроено», «?» — «что делать / где взять».","html":"\u003ch2>9. Текст тултипа\u003c/h2>\n\u003cul>\n\u003cli>1–3 коротких предложения. С заглавной буквы, с точкой в конце.\u003c/li>\n\u003cli>Не повторяет лейбл: не «ИНН — это ИНН компании», а что это и где его найти.\u003c/li>\n\u003cli>Не содержит критичной информации: всё, без чего нельзя заполнить поле, — в Hint.\u003c/li>\n\u003cli>«i» отвечает на вопрос «что это / как это устроено», «?» — «что делать / где взять».\u003c/li>\n\u003c/ul>\n"},{"md":"## 10. Свойства компонента\n\n### В Pixso (у каждого базового компонента из раздела 3)\n\n| Свойство | Значения |\n|---|---|\n| `Tooltip trigger` | boolean, по умолчанию false |\n| `Trigger icon` | `i` / `?` |\n\nСам тултип в компонент не вшивается — на макетах он показывается отдельным экземпляром компонента Tooltip рядом с триггером.\n\n### Для разработки (ориентир)\n\n| Свойство | Значения | По умолчанию |\n|---|---|---|\n| `tooltip.content` | текст / узел | — |\n| `tooltip.header` | текст | — |\n| `tooltip.icon` | `info` / `help` | `info` |\n| `tooltip.trigger` | `hover` / `click` | `hover` |\n| `tooltip.placement` | `right` / `top` / `bottom` / `left` | `right` (в таблице `top`) |\n| `tooltip.theme` | `dark` / `light` | см. вопрос 3 ниже |","html":"\u003ch2>10. Свойства компонента\u003c/h2>\n\u003ch3>В Pixso (у каждого базового компонента из раздела 3)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Свойство\u003c/th>\n\u003cth>Значения\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Tooltip trigger\u003c/code>\u003c/td>\n\u003ctd>boolean, по умолчанию false\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Trigger icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>i\u003c/code> / \u003ccode>?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Сам тултип в компонент не вшивается — на макетах он показывается отдельным экземпляром компонента Tooltip рядом с триггером.\u003c/p>\n\u003ch3>Для разработки (ориентир)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Свойство\u003c/th>\n\u003cth>Значения\u003c/th>\n\u003cth>По умолчанию\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>tooltip.content\u003c/code>\u003c/td>\n\u003ctd>текст / узел\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.header\u003c/code>\u003c/td>\n\u003ctd>текст\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code> / \u003ccode>help\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.trigger\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code> / \u003ccode>click\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.placement\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> / \u003ccode>top\u003c/code> / \u003ccode>bottom\u003c/code> / \u003ccode>left\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> (в таблице \u003ccode>top\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.theme\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>dark\u003c/code> / \u003ccode>light\u003c/code>\u003c/td>\n\u003ctd>см. вопрос 3 ниже\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## 11. Чек-лист Do / Don't\n\n✅ Триггер сразу после текста лейбла и маркера `*`\n✅ Триггер приклеен к последнему слову при переносе\n✅ При обрезке лейбла триггер и `*` видны всегда\n✅ Триггер активен у disabled-поля\n✅ Один режим (hover или click) внутри формы\n✅ Клик по триггеру ничего не переключает и не сортирует\n\n❌ Триггер внутри поля, кнопки, чипа, таба\n❌ Триггер прижат к правому краю поля\n❌ Ошибки валидации в тултипе\n❌ Информация, нужная всем, спрятана в тултип\n❌ Иконка одна на новой строке\n❌ Два тултипа на одном лейбле (overflow + info)","html":"\u003ch2>11. Чек-лист Do / Don&#39;t\u003c/h2>\n\u003cp>✅ Триггер сразу после текста лейбла и маркера \u003ccode>*\u003c/code>\n✅ Триггер приклеен к последнему слову при переносе\n✅ При обрезке лейбла триггер и \u003ccode>*\u003c/code> видны всегда\n✅ Триггер активен у disabled-поля\n✅ Один режим (hover или click) внутри формы\n✅ Клик по триггеру ничего не переключает и не сортирует\u003c/p>\n\u003cp>❌ Триггер внутри поля, кнопки, чипа, таба\n❌ Триггер прижат к правому краю поля\n❌ Ошибки валидации в тултипе\n❌ Информация, нужная всем, спрятана в тултип\n❌ Иконка одна на новой строке\n❌ Два тултипа на одном лейбле (overflow + info)\u003c/p>\n"},{"md":"## 12. Открытые вопросы к команде\n\n1. **Максимальная ширина тултипа:** в английской версии страницы Tooltip на примере `max-width: 320px`, в тексте — 500 px; в русской — рекомендуемая 250 px, максимальная 500 px. Нужно одно значение.\n2. **Задержки hover:** 300 мс на открытие, 150 мс на закрытие — согласовать с разработкой.\n3. **Тема по умолчанию** для встроенного триггера: тёмный или светлый тултип?\n4. **Курсор в режиме hover:** `pointer` или `help`?\n5. **Лимит длины текста** для режима hover: ~200 символов — ок?","html":"\u003ch2>12. Открытые вопросы к команде\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Максимальная ширина тултипа:\u003c/strong> в английской версии страницы Tooltip на примере \u003ccode>max-width: 320px\u003c/code>, в тексте — 500 px; в русской — рекомендуемая 250 px, максимальная 500 px. Нужно одно значение.\u003c/li>\n\u003cli>\u003cstrong>Задержки hover:\u003c/strong> 300 мс на открытие, 150 мс на закрытие — согласовать с разработкой.\u003c/li>\n\u003cli>\u003cstrong>Тема по умолчанию\u003c/strong> для встроенного триггера: тёмный или светлый тултип?\u003c/li>\n\u003cli>\u003cstrong>Курсор в режиме hover:\u003c/strong> \u003ccode>pointer\u003c/code> или \u003ccode>help\u003c/code>?\u003c/li>\n\u003cli>\u003cstrong>Лимит длины текста\u003c/strong> для режима hover: ~200 символов — ок?\u003c/li>\n\u003c/ol>\n"}]},"en":{"md":"# Tooltip trigger (\"i\" / \"?\") in base components — guidelines\n\nStatus: draft v0.1 · 27.11.2026\nCurrent Tooltip guidelines (photos): `screens/tooltip/` (IMG_2619–2622)\nRussian version: `Caldera-tooltip-trigger-guidelines.md`\n\n> This document extends the existing **Tooltip** page (anatomy, width, arrow, color, hover / click triggers, \"i\" vs \"?\"). It describes **where and how** the trigger is built into base components, how it behaves, and what to do in edge cases. Anything already covered on the Tooltip page is referenced, not repeated.\n>\n> Numbers marked *\"proposal\"* must be checked against library tokens.\n\n---\n\n## 1. Terms\n\n| Term | Meaning |\n|---|---|\n| **Trigger** | The \"i\" or \"?\" icon button that opens the tooltip. A standalone interactive element, not part of the label text. |\n| **Info trigger \"i\"** | Clarifying information: format, rule, reference. Not required to complete the action. |\n| **Help trigger \"?\"** | Help where errors or confusion are likely: explaining a term, an instruction, a link to support. |\n| **Tooltip** | The cloud with text (optionally a header and a close button) opened by the trigger. See the Tooltip page. |\n| **Hover mode** | The tooltip opens on hover / focus and closes when the pointer or focus leaves. No close button. |\n| **Click mode** | The tooltip opens on click and stays open until explicitly closed. Has a close button. |\n| **Hint** | Persistent helper text below a field. An alternative to the tooltip, see section 2. |\n\n---\n\n## 2. When to add a trigger and when not to\n\n### Add it when\n- the information helps **some** users, not all: format, data source, calculation rule, meaning of a term;\n- the action can be completed without it, but it makes things easier and reduces errors;\n- the text is short: 1–3 sentences.\n\n### Don't add it — use something else\n\n| Situation | Instead of a trigger |\n|---|---|\n| **Everyone** needs the information to fill the field (date format, length limit, mandatory condition) | **Hint** below the field — always visible |\n| Error message, validation | Error text below the field (Error state) |\n| Example value | Placeholder or Hint |\n| Long instruction, several paragraphs, a table, a list of steps | \"Learn more\" link / drawer / help page |\n| Explaining why a button is disabled | Tooltip on the button itself (its wrapper), no separate icon |\n| Truncated text that should be shown in full | Tooltip on the text itself (overflow tooltip), no icon |\n\n### Quantity rules\n- No more than **one** trigger per label.\n- Never put \"i\" and \"?\" in the same label.\n- If almost every field in a form needs a trigger, rework the labels or move the explanations into Hints: a wall of icons stops working.\n- Don't duplicate: if a group has a trigger on its title, add triggers to individual options only when truly needed.\n\n---\n\n## 3. Components that get the trigger\n\n### 3.1 Inputs and forms\n\n| Component | Trigger position | Notes |\n|---|---|---|\n| **Input** (text, number, password, email) | After the label text | Never inside the field |\n| **Textarea** | After the label text | The character counter stays where it is; the trigger doesn't move next to it |\n| **Select / Dropdown** | After the label text | |\n| **Multiselect / Combobox** | After the label text | |\n| **Date picker / Date range** | After the label text | For a range — one trigger on the shared label, not on each \"from / to\" field |\n| **Amount / Currency input** | After the label text | Typical \"?\" case: rounding rule, limits |\n| **Phone input** | After the label text | |\n| **File upload / Dropzone** | After the upload area label | Format and size requirements go to the Hint, not the tooltip |\n| **Slider / Range** | After the label text | |\n| **Stepper (numeric +/−)** | After the label text | |\n| **Checkbox group** | After the group title (legend) | |\n| **Radio button group** | After the group title (legend) | |\n| **Single Checkbox** | After the checkbox text | Clicking the trigger doesn't toggle the checkbox |\n| **Single Radio option** | After the option text | Clicking the trigger doesn't select the option |\n| **Switch / Toggle** | After the switch label text | If the label is left of the switch — trigger sits between the text and the switch |\n| **Segmented control** | After the control title | Not inside segments |\n| **Form section / Fieldset** | After the section title | |\n\n### 3.2 Data display\n\n| Component | Trigger position | Notes |\n|---|---|---|\n| **Table column header** | After the header text | Clicking the trigger doesn't sort |\n| **Key-value / Description list** | After the key (parameter name) | Not after the value |\n| **Card, section title, page block title** | After the title text | |\n| **Accordion / expandable section** | After the title text | Clicking the trigger doesn't expand or collapse the section |\n| **KPI / Stat tile** | After the metric caption | Typical case: how the metric is calculated |\n| **Chart** | After the chart title or legend item | |\n| **Filter sections in the All Filters drawer** | After the filter name | Clicking the trigger doesn't collapse the section |\n| **Stepper / Wizard steps** | After the step name | Only when the step needs explanation |\n\n### 3.3 Where the trigger is not placed\n- **Inside a button, link, chip, tag, menu item, tab** — a nested interactive element breaks clicking and accessibility. Use a tooltip on the element itself.\n- **Inside an input** (suffix area) — reserved for field icons: clear, show password, calendar, chevron.\n- **In modal and drawer titles** — if the window needs an explanation, put it in the window body.\n- **In table value cells** — a repeating icon in every row clutters the table. Explain in the column header or with a tooltip on the value itself.\n\n---\n\n## 4. Anatomy of a label with a trigger\n\n```\n[ Label text ][ * ][ 4px ][ (i) ]\n```\n\n- **Order:** label text → required marker `*` (or \"(optional)\") → trigger. The trigger is always the last element of the label.\n- **Gap** between the last label element and the trigger: **4 px** *(proposal)*.\n- **Don't push the trigger to the right edge** of the field (justify-between): the link between icon and text is lost, and on wide fields it drifts away.\n\n### Icon size *(proposal)*\n\n| Label text size | Icon | Hit area |\n|---|---|---|\n| 12 px (S) | 14 px | at least 24 × 24 px |\n| 14 px (M) | 16 px | at least 24 × 24 px |\n| 16 px and up (titles) | 16–20 px | at least 24 × 24 px |\n\nThe hit area is extended with invisible padding and **doesn't affect layout**: the label row height doesn't change because of the trigger.\n\n### Vertical alignment\nThe icon is centered on the **line height of the text line** it sits on, not on the height of the whole label block.\n\n### Icon states\n\n| State | Look |\n|---|---|\n| Default | Secondary icon color (neutral / secondary) |\n| Hover | Darker / primary color, `pointer` cursor (`help` is acceptable in hover mode) |\n| Active (tooltip open in click mode) | Same color as hover, kept while the tooltip is open |\n| Focus | Standard library focus ring |\n| Disabled field | **The trigger stays active**, see 6.4 |\n\nThe icon color doesn't change when the field has an error — it doesn't turn red.\n\n---\n\n## 5. Tooltip position relative to the trigger\n\nBase rules (width, arrow opposite the first line of text, 4 directions) are on the Tooltip page. For the built-in trigger we add:\n\n- **Default direction:** to the right of the trigger (arrow on the left, opposite the first line of text), as in the \"Phone number\" field example.\n- **If there's no room**, the tooltip flips in this order: **right → top → bottom → left**. It never goes off-screen and is never clipped by its container.\n- **In tables and narrow columns** the default is **top** or **bottom**, so neighboring columns aren't covered.\n- The tooltip is rendered **above everything** (portal), so table, card, modal or drawer overflow doesn't clip it.\n- The tooltip may cover the field itself: it's temporary and closes as soon as the user starts typing.\n- **On scroll** the tooltip moves with the trigger. If the trigger leaves the viewport, the tooltip closes.\n\n---\n\n## 6. Edge cases\n\n### 6.1 Long label wraps onto several lines\n- The trigger sits **at the end of the last line**, right after the last word (and the `*` marker).\n- The trigger is **glued to the last word**: the last word, `*` and icon never break apart. The icon never ends up alone on a new line.\n- The icon is centered on the line it sits on.\n\n```\nTax authority division code\nat the place of registration * (i)\n```\n\n✗ Wrong:\n```\nTax authority division code at the place of registration *\n(i)\n```\n\n### 6.2 Label truncated to one line (tables, compact forms)\n- The text is truncated with an ellipsis; **the `*` marker and the trigger are always visible**: `Tax authority divis… * (i)`.\n- The full label text is shown in the trigger tooltip's **header** (Header from the Tooltip anatomy), with the explanation below. This way the user never gets two tooltips (overflow + info) on one label.\n- Constant truncation is a signal to shorten the label.\n\n### 6.3 Label to the left of the field (horizontal form)\n- The trigger follows the label text inside the label column. Wrapping follows rule 6.1.\n- If labels are right-aligned in their column, the trigger still follows the text, and the whole \"text + `*` + trigger\" group is right-aligned.\n\n### 6.4 Disabled or read-only field\n- The trigger **stays active**: it opens and receives focus. Users especially need to understand why a field is unavailable or where its value comes from.\n- If a field is disabled and the reason needs explaining, this trigger is the right place for it.\n\n### 6.5 Field in error state\n- The trigger stays in place, its color doesn't change.\n- The error text goes below the field, not into the tooltip. The tooltip doesn't open automatically on error.\n\n### 6.6 Field without a visible label\n- Don't add a trigger. Explain in a Hint or in the section / column title.\n\n### 6.7 Checkbox or radio with a trigger on an option\n- The trigger is **outside the clickable area** of the option label: clicking it opens the tooltip and **doesn't toggle** the value.\n- Same for a column header (sorting), accordion (expanding), filter section.\n\n### 6.8 Long tooltip text\n- **Hover** mode: up to ~200 characters / 3–4 lines at the recommended width *(proposal)*.\n- Longer text, a header, a link or an action — **click** mode.\n- More than one or two paragraphs — not a tooltip: a \"Learn more\" link or a drawer.\n\n### 6.9 Several tooltips nearby\n- **Only one** tooltip is open at a time. Opening a new one closes the previous one (in both modes).\n\n### 6.10 Loading\n- While the label is a skeleton, the trigger is hidden — it appears together with the text.\n\n### 6.11 Touch devices\n- There's no hover, so a hover-mode tooltip opens on **tap** on the trigger and closes on tap outside.\n\n---\n\n## 7. Behavior: hover and click\n\nThe mode is set per trigger instance. **Use one mode within a form or table** — users shouldn't have to guess where to hover and where to click.\n\n| | **Hover** (default) | **Click** |\n|---|---|---|\n| When to choose | Short text, no links or actions | Long text, header, link, instruction (\"?\"), text needs to be read while filling in |\n| Opening with a mouse | Hover over the trigger, ~300 ms delay *(proposal)* | Click on the trigger |\n| Opening with a keyboard | Focus on the trigger (Tab) | Enter / Space on the trigger |\n| Closing | Pointer leaves trigger and tooltip, ~150 ms delay *(proposal)*; focus lost; Esc | Close button; click outside; Esc; clicking the trigger again |\n| Close button | No | Yes |\n| Pointer on the tooltip | The tooltip stays open while the pointer is on it (text can be selected and copied) | — |\n| Links and buttons inside | Not allowed | Allowed |\n| Blocks the page | No | No (non-modal) |\n\n### General rules\n- Clicking the trigger **doesn't move focus into the field** and doesn't submit the form (`type=\"button\"`, trigger outside the field's `\u003clabel>` or with default action prevented).\n- After closing with Esc, focus stays on (or returns to) the trigger.\n- In click mode, if there's a link inside, Tab moves focus into the tooltip; after the last element — to the next element on the page.\n\n---\n\n## 8. Accessibility\n\n- The trigger is a `\u003cbutton type=\"button\">`, not an icon with a click handler.\n- The trigger has an accessible name: `aria-label=\"More info: \u003clabel text>\"`, not just \"Info\".\n- Hover mode: the tooltip has `role=\"tooltip\"` and is linked to the trigger via `aria-describedby`.\n- Click mode: the tooltip is linked to the trigger via `aria-expanded` + `aria-controls`.\n- Icon contrast against the background in the default state is at least 3:1.\n- Hit area is at least 24 × 24 px.\n- The tooltip opens and closes with the keyboard, not only with a mouse.\n\n---\n\n## 9. Tooltip text\n\n- 1–3 short sentences. Sentence case, ending with a period.\n- Doesn't repeat the label: not \"Tax ID is the company's tax ID\", but what it is and where to find it.\n- No critical information: anything required to fill the field goes to the Hint.\n- \"i\" answers \"what is this / how does it work\", \"?\" answers \"what should I do / where do I get it\".\n\n---\n\n## 10. Component properties\n\n### In Pixso (on every base component from section 3)\n\n| Property | Values |\n|---|---|\n| `Tooltip trigger` | boolean, default false |\n| `Trigger icon` | `i` / `?` |\n\nThe tooltip itself isn't baked into the component — on mockups it's shown as a separate Tooltip component instance next to the trigger.\n\n### For development (reference)\n\n| Property | Values | Default |\n|---|---|---|\n| `tooltip.content` | text / node | — |\n| `tooltip.header` | text | — |\n| `tooltip.icon` | `info` / `help` | `info` |\n| `tooltip.trigger` | `hover` / `click` | `hover` |\n| `tooltip.placement` | `right` / `top` / `bottom` / `left` | `right` (`top` in tables) |\n| `tooltip.theme` | `dark` / `light` | see question 3 below |\n\n---\n\n## 11. Do / Don't checklist\n\n✅ Trigger right after the label text and the `*` marker\n✅ Trigger glued to the last word when wrapping\n✅ Trigger and `*` always visible when the label is truncated\n✅ Trigger active on a disabled field\n✅ One mode (hover or click) within a form\n✅ Clicking the trigger doesn't toggle or sort anything\n\n❌ Trigger inside a field, button, chip, tab\n❌ Trigger pushed to the right edge of the field\n❌ Validation errors in the tooltip\n❌ Information everyone needs hidden in a tooltip\n❌ Icon alone on a new line\n❌ Two tooltips on one label (overflow + info)\n\n---\n\n## 12. Open questions for the team\n\n1. **Max tooltip width:** the English Tooltip page shows `max-width: 320px` in the example but says 500 px in the text; the Russian page says 250 px recommended, 500 px max. We need one value.\n2. **Hover delays:** 300 ms to open, 150 ms to close — agree with developers.\n3. **Default theme** for the built-in trigger: dark or light tooltip?\n4. **Cursor in hover mode:** `pointer` or `help`?\n5. **Text length limit** for hover mode: is ~200 characters OK?\n","sections":[{"md":"# Tooltip trigger (\"i\" / \"?\") in base components — guidelines\n\nStatus: draft v0.1 · 27.11.2026\nCurrent Tooltip guidelines (photos): `screens/tooltip/` (IMG_2619–2622)\nRussian version: `Caldera-tooltip-trigger-guidelines.md`\n\n> This document extends the existing **Tooltip** page (anatomy, width, arrow, color, hover / click triggers, \"i\" vs \"?\"). It describes **where and how** the trigger is built into base components, how it behaves, and what to do in edge cases. Anything already covered on the Tooltip page is referenced, not repeated.\n>\n> Numbers marked *\"proposal\"* must be checked against library tokens.","html":"\u003ch1>Tooltip trigger (&quot;i&quot; / &quot;?&quot;) in base components — guidelines\u003c/h1>\n\u003cp>Status: draft v0.1 · 27.11.2026\nCurrent Tooltip guidelines (photos): \u003ccode>screens/tooltip/\u003c/code> (IMG_2619–2622)\nRussian version: \u003ccode>Caldera-tooltip-trigger-guidelines.md\u003c/code>\u003c/p>\n\u003cblockquote>\n\u003cp>This document extends the existing \u003cstrong>Tooltip\u003c/strong> page (anatomy, width, arrow, color, hover / click triggers, &quot;i&quot; vs &quot;?&quot;). It describes \u003cstrong>where and how\u003c/strong> the trigger is built into base components, how it behaves, and what to do in edge cases. Anything already covered on the Tooltip page is referenced, not repeated.\u003c/p>\n\u003cp>Numbers marked \u003cem>&quot;proposal&quot;\u003c/em> must be checked against library tokens.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## 1. Terms\n\n| Term | Meaning |\n|---|---|\n| **Trigger** | The \"i\" or \"?\" icon button that opens the tooltip. A standalone interactive element, not part of the label text. |\n| **Info trigger \"i\"** | Clarifying information: format, rule, reference. Not required to complete the action. |\n| **Help trigger \"?\"** | Help where errors or confusion are likely: explaining a term, an instruction, a link to support. |\n| **Tooltip** | The cloud with text (optionally a header and a close button) opened by the trigger. See the Tooltip page. |\n| **Hover mode** | The tooltip opens on hover / focus and closes when the pointer or focus leaves. No close button. |\n| **Click mode** | The tooltip opens on click and stays open until explicitly closed. Has a close button. |\n| **Hint** | Persistent helper text below a field. An alternative to the tooltip, see section 2. |","html":"\u003ch2>1. Terms\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Term\u003c/th>\n\u003cth>Meaning\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Trigger\u003c/strong>\u003c/td>\n\u003ctd>The &quot;i&quot; or &quot;?&quot; icon button that opens the tooltip. A standalone interactive element, not part of the label text.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Info trigger &quot;i&quot;\u003c/strong>\u003c/td>\n\u003ctd>Clarifying information: format, rule, reference. Not required to complete the action.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Help trigger &quot;?&quot;\u003c/strong>\u003c/td>\n\u003ctd>Help where errors or confusion are likely: explaining a term, an instruction, a link to support.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Tooltip\u003c/strong>\u003c/td>\n\u003ctd>The cloud with text (optionally a header and a close button) opened by the trigger. See the Tooltip page.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hover mode\u003c/strong>\u003c/td>\n\u003ctd>The tooltip opens on hover / focus and closes when the pointer or focus leaves. No close button.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Click mode\u003c/strong>\u003c/td>\n\u003ctd>The tooltip opens on click and stays open until explicitly closed. Has a close button.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Hint\u003c/strong>\u003c/td>\n\u003ctd>Persistent helper text below a field. An alternative to the tooltip, see section 2.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## 2. When to add a trigger and when not to\n\n### Add it when\n- the information helps **some** users, not all: format, data source, calculation rule, meaning of a term;\n- the action can be completed without it, bu input** | After the label text | |\n| **File upload / Dropzone** | After the upload area label | Format and size requirements go to the Hint, not the tooltip |\n| **Slider / Range** | After the label text | |\n| **Stepper (numeric +/−)** | After the label text | |\n| **Checkbox group** | After the group title (legend) | |\n| **Radio button group** | After the group title (legend) | |\n| **Single Checkbox** | After the checkbox text | Clicking the trigger doesn't toggle the checkbox |\n| **Single Radio option** | After the option text | Clicking the trigger doesn't select the option |\n| **Switch / Toggle** | After the switch label text | If the label is left of the switch — trigger sits between the text and the switch |\n| **Segmented control** | After the control title | Not inside segments |\n| **Form section / Fieldset** | After the section title | |\n\n### 3.2 Data display\n\n| Component | Trigger position | Notes |\n|---|---|---|\n| **Table column header** | After the header text | Clicking the trigger doesn't sort |\n| **Key-value / Description list** | After the key (parameter name) | Not after the value |\n| **Card, section title, page block title** | After the title text | |\n| **Accordion / expandable section** | After the title text | Clicking the trigger doesn't expand or collapse the section |\n| **KPI / Stat tile** | After the metric caption | Typical case: how the metric is calculated |\n| **Chart** | After the chart title or legend item | |\n| **Filter sections in the All Filters drawer** | After the filter name | Clicking the trigger doesn't collapse the section |\n| **Stepper / Wizard steps** | After the step name | Only when the step needs explanation |\n\n### 3.3 Where the trigger is not placed\n- **Inside a button, link, chip, tag, menu item, tab** — a nested interactive element breaks clicking and accessibility. Use a tooltip on the element itself.\n- **Inside an input** (suffix area) — reserved for field icons: clear, show password, calendar, chevron.\n- **In modal and drawer titles** — if the window needs an explanation, put it in the window body.\n- **In table value cells** — a repeating icon in every row clutters the table. Explain in the column header or with a tooltip on the value itself.","html":"\u003ch2>3. Components that get the trigger\u003c/h2>\n\u003ch3>3.1 Inputs and forms\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Component\u003c/th>\n\u003cth>Trigger position\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Input\u003c/strong> (text, number, password, email)\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>Never inside the field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Textarea\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>The character counter stays where it is; the trigger doesn&#39;t move next to it\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Select / Dropdown\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Multiselect / Combobox\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Date picker / Date range\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>For a range — one trigger on the shared label, not on each &quot;from / to&quot; field\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Amount / Currency input\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>Typical &quot;?&quot; case: rounding rule, limits\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Phone input\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>File upload / Dropzone\u003c/strong>\u003c/td>\n\u003ctd>After the upload area label\u003c/td>\n\u003ctd>Format and size requ
