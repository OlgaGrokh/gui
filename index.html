ng>применённые\u003c/strong> значения.\u003c/li>\n\u003cli>Apply превращает черновик в применённое значение (если он валиден).\u003c/li>\n\u003cli>Закрытие без Apply (клик вне, Esc, крестик дровера) \u003cstrong>отбрасывает черновик\u003c/strong>. При следующем открытии пользователь видит применённое значение.\u003c/li>\n\u003cli>Чип и дровер — два входа в \u003cstrong>одно и то же состояние фильтров\u003c/strong>. Значение, применённое в чипе, сразу видно в дровере, и наоборот. Правила Apply, валидации и очистки одинаковы в обоих местах.\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>Сейчас в макетах (IMG_2345) чип показывает черновое значение «Label from 10 to» при невалидном вводе. По правилу выше чип должен показывать последнее применённое значение.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## A2. Анатомия\n\n⏳ Не описано.","html":"\u003ch2>A2. Анатомия\u003c/h2>\n\u003cp>⏳ Не описано.\u003c/p>\n"},{"md":"## A3. Конфигурации панели фильтров\n\n| Конфигурация | Когда использовать | Что на странице |\n|---|---|---|\n| **A. Только быстрые фильтры** | В продукте мало фильтров (3–5), прятать их в дровер нет смысла | Быстрые фильтры + Clear all. Кнопки All Filters и дровера нет. |\n| **B. Только All Filters** | Фильтров много, и ни один не используется заметно чаще других | All Filters + чипы применённых фильтров + Clear all |\n| **C. All Filters + быстрые фильтры** | Фильтров много, но 2–4 основных нужны пользователю под рукой | All Filters + быстрые фильтры + чипы применённых фильтров + Clear all |\n\nПредлагаю ориентир для выбора: до 5 фильтров — A; больше 5 — B или C. В C быстрых фильтров не больше 4, иначе панель превращается в дровер, разложенный на странице.\n\n---\n\n# Блок B. Чипы на странице","html":"\u003ch2>A3. Конфигурации панели фильтров\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Конфигурация\u003c/th>\n\u003cth>Когда использовать\u003c/th>\n\u003cth>Что на странице\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>A. Только быстрые фильтры\u003c/strong>\u003c/td>\n\u003ctd>В продукте мало фильтров (3–5), прятать их в дровер нет смысла\u003c/td>\n\u003ctd>Быстрые фильтры + Clear all. Кнопки All Filters и дровера нет.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>B. Только All Filters\u003c/strong>\u003c/td>\n\u003ctd>Фильтров много, и ни один не используется заметно чаще других\u003c/td>\n\u003ctd>All Filters + чипы применённых фильтров + Clear all\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>C. All Filters + быстрые фильтры\u003c/strong>\u003c/td>\n\u003ctd>Фильтров много, но 2–4 основных нужны пользователю под рукой\u003c/td>\n\u003ctd>All Filters + быстрые фильтры + чипы применённых фильтров + Clear all\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Предлагаю ориентир для выбора: до 5 фильтров — A; больше 5 — B или C. В C быстрых фильтров не больше 4, иначе панель превращается в дровер, разложенный на странице.\u003c/p>\n\u003chr>\n\u003ch1>Блок B. Чипы на странице\u003c/h1>\n"},{"md":"## B1. Виды чипов\n\n| | Быстрый фильтр | Чип применённого фильтра |\n|---|---|---|\n| Виден на странице | Всегда | Только пока фильтр применён |\n| Без значения | Outline-чип с названием и стрелкой: `Label ⌄` | Не существует |\n| Со значением | `Label Value × ⌄` | `Label Value × ⌄` — выглядит так же |\n| Клик по чипу | Дропдаун с контролом и Apply | Дропдаун с контролом и Apply — ведёт себя так же |\n| × на чипе | Очищает значение и применяет. **Чип остаётся** в состоянии без значения | Очищает значение и применяет. **Чип исчезает** |\n| Apply с пустым значением | Фильтр снят, чип остаётся без значения | Фильтр снят, чип исчезает (дропдаун закрывается вместе с ним) |\n| Clear all на странице | Все быстрые фильтры остаются, без значений | Все чипы применённых фильтров исчезают |\n| Есть ли в дровере | Да (в конфигурации C) | Да — это его источник |\n\nВнешне и по поведению внутри дропдауна оба вида одинаковые. Разница только в том, остаётся ли чип на странице после очистки. Правила B5, D1 и D2 действуют для обоих без исключений.","html":"\u003ch2>B1. Виды чипов\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Быстрый фильтр\u003c/th>\n\u003cth>Чип применённого фильтра\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Виден на странице\u003c/td>\n\u003ctd>Всегда\u003c/td>\n\u003ctd>Только пока фильтр применён\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Без значения\u003c/td>\n\u003ctd>Outline-чип с названием и стрелкой: \u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Не существует\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Со значением\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code> — выглядит так же\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик по чипу\u003c/td>\n\u003ctd>Дропдаун с контролом и Apply\u003c/td>\n\u003ctd>Дропдаун с контролом и Apply — ведёт себя так же\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>× на чипе\u003c/td>\n\u003ctd>Очищает значение и применяет. \u003cstrong>Чип остаётся\u003c/strong> в состоянии без значения\u003c/td>\n\u003ctd>Очищает значение и применяет. \u003cstrong>Чип исчезает\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apply с пустым значением\u003c/td>\n\u003ctd>Фильтр снят, чип остаётся без значения\u003c/td>\n\u003ctd>Фильтр снят, чип исчезает (дропдаун закрывается вместе с ним)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all на странице\u003c/td>\n\u003ctd>Все быстрые фильтры остаются, без значений\u003c/td>\n\u003ctd>Все чипы применённых фильтров исчезают\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Есть ли в дровере\u003c/td>\n\u003ctd>Да (в конфигурации C)\u003c/td>\n\u003ctd>Да — это его источник\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Внешне и по поведению внутри дропдауна оба вида одинаковые. Разница только в том, остаётся ли чип на странице после очистки. Правила B5, D1 и D2 действуют для обоих без исключений.\u003c/p>\n"},{"md":"## B2. Состояния чипа\n\n⏳ Не описано.","html":"\u003ch2>B2. Состояния чипа\u003c/h2>\n\u003cp>⏳ Не описано.\u003c/p>\n"},{"md":"## B3. Значение в чипе\n\n⏳ Не описано. Уже известно: для диапазона с одной границей — `Label to 10` / `Label from 10` (см. E2).","html":"\u003ch2>B3. Значение в чипе\u003c/h2>\n\u003cp>⏳ Не описано. Уже известно: для диапазона с одной границей — \u003ccode>Label to 10\u003c/code> / \u003ccode>Label from 10\u003c/code> (см. E2).\u003c/p>\n"},{"md":"## B4. Порядок чипов\n\n`All Filters` → быстрые фильтры → чипы применённых фильтров → `Clear all`\n\n- Быстрые фильтры стоят в порядке, который задал продукт, и не двигаются при применении значений. Пользователь запоминает их положение.\n- Чипы применённых фильтров стоят в порядке секций дровера (а не в порядке применения), чтобы панель не «прыгала» при каждом Apply.\n- При переносе на вторую строку порядок сохраняется (IMG_2336).","html":"\u003ch2>B4. Порядок чипов\u003c/h2>\n\u003cp>\u003ccode>All Filters\u003c/code> → быстрые фильтры → чипы применённых фильтров → \u003ccode>Clear all\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>Быстрые фильтры стоят в порядке, который задал продукт, и не двигаются при применении значений. Пользователь запоминает их положение.\u003c/li>\n\u003cli>Чипы применённых фильтров стоят в порядке секций дровера (а не в порядке применения), чтобы панель не «прыгала» при каждом Apply.\u003c/li>\n\u003cli>При переносе на вторую строку порядок сохраняется (IMG_2336).\u003c/li>\n\u003c/ul>\n"},{"md":"## B5. Открытие и закрытие дропдауна чипа\n\n**Исправление:** дропдаун открывается **по клику**, а не по ховеру.\n\n| Действие | Результат |\n|---|---|\n| Ховер на чип | Только визуальный hover-state. Дропдаун не открывается. |\n| Клик по чипу | Открывает дропдаун. Фокус переходит в первый контрол (поле ввода / поиск). |\n| Повторный клик по открытому чипу | Закрывает дропдаун, черновик отбрасывается. |\n| Клик по другому чипу | Текущий дропдаун закрывается (черновик отбрасывается), открывается новый. Одновременно открыт максимум один. |\n| Клик вне дропдауна | Закрывает, черновик отбрасывается. |\n| Esc | Закрывает, черновик отбрасывается, фокус возвращается на чип. |\n| Клик по × на чипе | Очищает фильтр и сразу применяет. Дропдаун **не** открывается. |\n| Enter / Space на чипе в фокусе | Открывает дропдаун (как клик). |\n\nПочему не ховер: дропдаун с полем ввода и кнопкой — это форма; по ховеру он открывается случайно при движении мыши к таблице и закрывается, когда курсор «соскальзывает» с пути к кнопке. Плюс ховер недоступен с клавиатуры и тачпада без курсора.\n\n---\n\n# Блок C. Дровер All Filters\n\nДровер — это боковая панель со всеми фильтрами страницы. Внутри дровера пользователь редактирует черновик (A1): таблица не меняется, пока он не нажмёт Apply.","html":"\u003ch2>B5. Открытие и закрытие дропдауна чипа\u003c/h2>\n\u003cp>\u003cstrong>Исправление:\u003c/strong> дропдаун открывается \u003cstrong>по клику\u003c/strong>, а не по ховеру.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Действие\u003c/th>\n\u003cth>Результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ховер на чип\u003c/td>\n\u003ctd>Только визуальный hover-state. Дропдаун не открывается.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик по чипу\u003c/td>\n\u003ctd>Открывает дропдаун. Фокус переходит в первый контрол (поле ввода / поиск).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Повторный клик по открытому чипу\u003c/td>\n\u003ctd>Закрывает дропдаун, черновик отбрасывается.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик по другому чипу\u003c/td>\n\u003ctd>Текущий дропдаун закрывается (черновик отбрасывается), открывается новый. Одновременно открыт максимум один.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик вне дропдауна\u003c/td>\n\u003ctd>Закрывает, черновик отбрасывается.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Esc\u003c/td>\n\u003ctd>Закрывает, черновик отбрасывается, фокус возвращается на чип.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик по × на чипе\u003c/td>\n\u003ctd>Очищает фильтр и сразу применяет. Дропдаун \u003cstrong>не\u003c/strong> открывается.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Enter / Space на чипе в фокусе\u003c/td>\n\u003ctd>Открывает дропдаун (как клик).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Почему не ховер: дропдаун с полем ввода и кнопкой — это форма; по ховеру он открывается случайно при движении мыши к таблице и закрывается, когда курсор «соскальзывает» с пути к кнопке. Плюс ховер недоступен с клавиатуры и тачпада без курсора.\u003c/p>\n\u003chr>\n\u003ch1>Блок C. Дровер All Filters\u003c/h1>\n\u003cp>Дровер — это боковая панель со всеми фильтрами страницы. Внутри дровера пользователь редактирует черновик (A1): таблица не меняется, пока он не нажмёт Apply.\u003c/p>\n"},{"md":"## C1. Открытие и закрытие\n\n### Открытие\n\n- Дровер открывается **только по клику** на кнопку All Filters.\n- Выезжает справа поверх страницы, страница под ним затемняется. Скролл страницы заблокирован, пока дровер открыт.\n- Если на странице был открыт дропдаун чипа, он закрывается, а его черновик отбрасывается.\n- В дровере сразу показаны **применённые** значения всех фильтров.\n- Фокус переходит в дровер (на заголовок или первый контрол). Tab не выходит за пределы дровера, пока он открыт.\n- Каждый раз дровер открывается со скроллом в самом начале.\n\n### Закрытие\n\n| Действие | Что происходит с изменениями | Дровер |\n|---|---|---|\n| Apply, ошибок нет | Применяются все фильтры разом | Закрывается |\n| Apply, есть ошибки | Ничего не применяется (C5) | Остаётся открытым |\n| Clear all / Reset to default | Сброс применяется сразу (C5) | Закрывается |\n| × в шапке | Черновик отбрасывается | Закрывается |\n| Клик по затемнённой странице | Черновик отбрасывается | Закрывается |\n| Esc | Черновик отбрасывается | Закрывается |\n\n- Подтверждения «У вас есть несохранённые изменения» при закрытии **нет**. Настроить фильтры заново дёшево, а лишний диалог раздражает чаще, чем спасает.\n- После закрытия фокус возвращается на кнопку All Filters.","html":"\u003ch2>C1. Открытие и закрытие\u003c/h2>\n\u003ch3>Открытие\u003c/h3>\n\u003cul>\n\u003cli>Дровер открывается \u003cstrong>только по клику\u003c/strong> на кнопку All Filters.\u003c/li>\n\u003cli>Выезжает справа поверх страницы, страница под ним затемняется. Скролл страницы заблокирован, пока дровер открыт.\u003c/li>\n\u003cli>Если на странице был открыт дропдаун чипа, он закрывается, а его черновик отбрасывается.\u003c/li>\n\u003cli>В дровере сразу показаны \u003cstrong>применённые\u003c/strong> значения всех фильтров.\u003c/li>\n\u003cli>Фокус переходит в дровер (на заголовок или первый контрол). Tab не выходит за пределы дровера, пока он открыт.\u003c/li>\n\u003cli>Каждый раз дровер открывается со скроллом в самом начале.\u003c/li>\n\u003c/ul>\n\u003ch3>Закрытие\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Действие\u003c/th>\n\u003cth>Что происходит с изменениями\u003c/th>\n\u003cth>Дровер\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Apply, ошибок нет\u003c/td>\n\u003ctd>Применяются все фильтры разом\u003c/td>\n\u003ctd>Закрывается\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apply, есть ошибки\u003c/td>\n\u003ctd>Ничего не применяется (C5)\u003c/td>\n\u003ctd>Остаётся открытым\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all / Reset to default\u003c/td>\n\u003ctd>Сброс применяется сразу (C5)\u003c/td>\n\u003ctd>Закрывается\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>× в шапке\u003c/td>\n\u003ctd>Черновик отбрасывается\u003c/td>\n\u003ctd>Закрывается\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик по затемнённой странице\u003c/td>\n\u003ctd>Черновик отбрасывается\u003c/td>\n\u003ctd>Закрывается\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Esc\u003c/td>\n\u003ctd>Черновик отбрасывается\u003c/td>\n\u003ctd>Закрывается\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>Подтверждения «У вас есть несохранённые изменения» при закрытии \u003cstrong>нет\u003c/strong>. Настроить фильтры заново дёшево, а лишний диалог раздражает чаще, чем спасает.\u003c/li>\n\u003cli>После закрытия фокус возвращается на кнопку All Filters.\u003c/li>\n\u003c/ul>\n"},{"md":"## C2. Структура дровера\n\n```\n┌──────────────────────────────┐\n│ All Filters               ×  │  ← шапка, закреплена\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← секции, скроллятся\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← футер, закреплён\n└──────────────────────────────┘\n```\n\n- **Шапка** закреплена: название «All Filters», кнопка × и ссылка Expand all / Collapse all (C3).\n- **Тело** скроллится. В нём секции фильтров в фиксированном порядке: сначала быстрые фильтры в порядке страницы, потом остальные (C6).\n- **Футер** закреплён и всегда виден: кнопка сброса и Apply (C5).\n- **Заголовки секций** выровнены по левому краю. Длинный заголовок переносится на вторую строку, а не обрезается.","html":"\u003ch2>C2. Структура дровера\u003c/h2>\n\u003cpre>\u003ccode>┌──────────────────────────────┐\n│ All Filters               ×  │  ← шапка, закреплена\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← секции, скроллятся\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← футер, закреплён\n└──────────────────────────────┘\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Шапка\u003c/strong> закреплена: название «All Filters», кнопка × и ссылка Expand all / Collapse all (C3).\u003c/li>\n\u003cli>\u003cstrong>Тело\u003c/strong> скроллится. В нём секции фильтров в фиксированном порядке: сначала быстрые фильтры в порядке страницы, потом остальные (C6).\u003c/li>\n\u003cli>\u003cstrong>Футер\u003c/strong> закреплён и всегда виден: кнопка сброса и Apply (C5).\u003c/li>\n\u003cli>\u003cstrong>Заголовки секций\u003c/strong> выровнены по левому краю. Длинный заголовок переносится на вторую строку, а не обрезается.\u003c/li>\n\u003c/ul>\n"},{"md":"## C3. Секции: развёрнутое и свёрнутое состояние\n\n### Состояние по умолчанию\n\nПродукт выбирает, в каком состоянии секции открываются по умолчанию:\n\n- **все развёрнуты** — когда фильтров немного и важно видеть всё сразу;\n- **все свёрнуты** — когда фильтров много и дровер иначе становится слишком длинным.\n\n### Секция со значением всегда развёрнута\n\nПри открытии дровера секция, **в которой есть значение**, разворачивается, даже если по умолчанию секции свёрнуты. Значение — это применённое значение или значение по умолчанию (D4). Так пользователь сразу видит, что именно сейчас фильтрует таблицу.\n\n### Управление секцией\n\n- У каждой секции (кроме Switch) в заголовке шеврон: `⌄` — развернуть, `^` — свернуть. Клик по заголовку тоже сворачивает и разворачивает секцию.\n- Пользователь может свернуть секцию даже со значением. Тогда в заголовке остаются кнопка Clear и короткая подсказка о значении: `Status · 2`, `Created on · 08/10/2025`. Без неё свёрнутая секция со значением выглядела бы пустой.\n- **Switch** — не аккордеон: одна строка с названием слева и переключателем справа, без шеврона и без Clear.\n- **Clear** стоит в заголовке секции и показывается, только когда у фильтра есть значение (D3).\n\n### Expand all / Collapse all\n\n- Ссылка под заголовком дровера.\n- Если свёрнута хотя бы одна секция, ссылка называется **Expand all** и разворачивает все.\n- Если развёрнуты все секции, ссылка называется **Collapse all** и сворачивает все.\n- Ссылка нужна, когда секций больше 5. Если их меньше, её можно не показывать.\n\n### Что запоминается\n\nРазвёрнутость секций живёт, пока открыт дровер. При следующем открытии состояние снова считается по правилам выше: состояние по умолчанию плюс развёрнутые секции со значениями.","html":"\u003ch2>C3. Секции: развёрнутое и свёрнутое состояние\u003c/h2>\n\u003ch3>Состояние по умолчанию\u003c/h3>\n\u003cp>Продукт выбирает, в каком состоянии секции открываются по умолчанию:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>все развёрнуты\u003c/strong> — когда фильтров немного и важно видеть всё сразу;\u003c/li>\n\u003cli>\u003cstrong>все свёрнуты\u003c/strong> — когда фильтров много и дровер иначе становится слишком длинным.\u003c/li>\n\u003c/ul>\n\u003ch3>Секция со значением всегда развёрнута\u003c/h3>\n\u003cp>При открытии дровера секция, \u003cstrong>в которой есть значение\u003c/strong>, разворачивается, даже если по умолчанию секции свёрнуты. Значение — это применённое значение или значение по умолчанию (D4). Так пользователь сразу видит, что именно сейчас фильтрует таблицу.\u003c/p>\n\u003ch3>Управление секцией\u003c/h3>\n\u003cul>\n\u003cli>У каждой секции (кроме Switch) в заголовке шеврон: \u003ccode>⌄\u003c/code> — развернуть, \u003ccode>^\u003c/code> — свернуть. Клик по заголовку тоже сворачивает и разворачивает секцию.\u003c/li>\n\u003cli>Пользователь может свернуть секцию даже со значением. Тогда в заголовке остаются кнопка Clear и короткая подсказка о значении: \u003ccode>Status · 2\u003c/code>, \u003ccode>Created on · 08/10/2025\u003c/code>. Без неё свёрнутая секция со значением выглядела бы пустой.\u003c/li>\n\u003cli>\u003cstrong>Switch\u003c/strong> — не аккордеон: одна строка с названием слева и переключателем справа, без шеврона и без Clear.\u003c/li>\n\u003cli>\u003cstrong>Clear\u003c/strong> стоит в заголовке секции и показывается, только когда у фильтра есть значение (D3).\u003c/li>\n\u003c/ul>\n\u003ch3>Expand all / Collapse all\u003c/h3>\n\u003cul>\n\u003cli>Ссылка под заголовком дровера.\u003c/li>\n\u003cli>Если свёрнута хотя бы одна секция, ссылка называется \u003cstrong>Expand all\u003c/strong> и разворачивает все.\u003c/li>\n\u003cli>Если развёрнуты все секции, ссылка называется \u003cstrong>Collapse all\u003c/strong> и сворачивает все.\u003c/li>\n\u003cli>Ссылка нужна, когда секций больше 5. Если их меньше, её можно не показывать.\u003c/li>\n\u003c/ul>\n\u003ch3>Что запоминается\u003c/h3>\n\u003cp>Развёрнутость секций живёт, пока открыт дровер. При следующем открытии состояние снова считается по правилам выше: состояние по умолчанию плюс развёрнутые секции со значениями.\u003c/p>\n"},{"md":"## C4. Длинные списки: Show all и Show less\n\nКасается Select и Multiselect в дровере.\n\n### Сколько вариантов видно сразу\n\n- По умолчанию в развёрнутой секции видно **6 вариантов**. Продукт может задать другое число для конкретного фильтра.\n- **Правило минимального остатка:** кнопку Show all показываем, только если под ней скрыто **2 варианта или больше**. Если скрыт был бы всего один, показываем весь список сразу: кнопка заняла бы столько же места, сколько этот вариант, и ничего не сэкономила бы.\n  - Пример: лимит 6, вариантов 7 → показываем все 7, кнопки нет.\n  - Пример: лимит 6, вариантов 8 → показываем 6 и кнопку `Show all (8)`.\n- Это одно сравнение («вариантов больше, чем лимит + 1?»), сложной логики тут нет. Поэтому правило встроено в компонент, а продукту остаётся только задать лимит.\n\n### Выбранные варианты всегда видны\n\nЕсли выбранный вариант стоит в списке ниже лимита, в свёрнутом списке его не было бы видно. Поэтому при открытии дровера выбранные варианты поднимаются наверх списка, остальные идут за ними в исходном порядке.\n\nПорядок пересчитывается **только при открытии дровера**, а не в момент клика. Иначе вариант «прыгал» бы из-под курсора.\n\n### Названия кнопок\n\n| Свёрнутый список | Развёрнутый список | Комментарий |\n|---|---|---|\n| **Show all (24)** | **Show less** | Рекомендую. Число сразу показывает, сколько всего вариантов. «Show less» честно описывает действие: список сокращается обратно до лимита, а не исчезает. |\n| Show more | Show less | Стандартная пара, но «more» не говорит, раскроется весь список или только часть. |\n| Show 18 more | Show less | Точно, но число меняется в зависимости от лимита, его сложнее локализовать. |\n| ~~Show all~~ | ~~Hide all~~ | Не использовать: «Hide all» читается как «скрыть всё», хотя первые варианты остаются на месте. |\n\n### Что происходит по Show all\n\n- Список раскрывается **прямо в секции**, без вложенного скролла: дровер и так скроллится, а скролл внутри скролла легко «зажевать» колесом мыши.\n- Если вариантов больше **20**, раскрытый список получает максимальную высоту примерно в 10 строк и собственный скролл. Поиск над списком в этом случае остаётся на месте.\n- Кнопка меняется на **Show less** и стоит под последним вариантом.\n\n### Что происходит по Show less\n\n- Список сворачивается обратно до лимита.\n- Если заголовок секции к этому моменту ушёл за верхний край, дровер подскролливается так, чтобы заголовок секции снова был виден. Пользователь не должен терять место, где он был.\n\n### Поиск в списке\n\n- Поле поиска показывается над списком, если вариантов больше 10.\n- Пока в поиске есть текст, показываются **все** совпадения, без лимита и без Show all.\n- Нет совпадений — текст «No results».\n- Очистка поиска (× в поле) возвращает список в прежнее состояние.\n\n### Загрузка и ошибки\n\n- Пока варианты загружаются, вместо них скелетоны (как в дропдауне чипа, IMG_2508).\n- Ошибка загрузки — текст ошибки и ссылка Retry внутри секции. Остальные секции работают как обычно.","html":"\u003ch2>C4. Длинные списки: Show all и Show less\u003c/h2>\n\u003cp>Касается Select и Multiselect в дровере.\u003c/p>\n\u003ch3>Сколько вариантов видно сразу\u003c/h3>\n\u003cul>\n\u003cli>По умолчанию в развёрнутой секции видно \u003cstrong>6 вариантов\u003c/strong>. Продукт может задать другое число для конкретного фильтра.\u003c/li>\n\u003cli>\u003cstrong>Правило минимального остатка:\u003c/strong> кнопку Show all показываем, только если под ней скрыто \u003cstrong>2 варианта или больше\u003c/strong>. Если скрыт был бы всего один, показываем весь список сразу: кнопка заняла бы столько же места, сколько этот вариант, и ничего не сэкономила бы.\u003cul>\n\u003cli>Пример: лимит 6, вариантов 7 → показываем все 7, кнопки нет.\u003c/li>\n\u003cli>Пример: лимит 6, вариантов 8 → показываем 6 и кнопку \u003ccode>Show all (8)\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Это одно сравнение («вариантов больше, чем лимит + 1?»), сложной логики тут нет. Поэтому правило встроено в компонент, а продукту остаётся только задать лимит.\u003c/li>\n\u003c/ul>\n\u003ch3>Выбранные варианты всегда видны\u003c/h3>\n\u003cp>Если выбранный вариант стоит в списке ниже лимита, в свёрнутом списке его не было бы видно. Поэтому при открытии дровера выбранные варианты поднимаются наверх списка, остальные идут за ними в исходном порядке.\u003c/p>\n\u003cp>Порядок пересчитывается \u003cstrong>только при открытии дровера\u003c/strong>, а не в момент клика. Иначе вариант «прыгал» бы из-под курсора.\u003c/p>\n\u003ch3>Названия кнопок\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Свёрнутый список\u003c/th>\n\u003cth>Развёрнутый список\u003c/th>\n\u003cth>Комментарий\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Show all (24)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Show less\u003c/strong>\u003c/td>\n\u003ctd>Рекомендую. Число сразу показывает, сколько всего вариантов. «Show less» честно описывает действие: список сокращается обратно до лимита, а не исчезает.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show more\u003c/td>\n\u003ctd>Show less\u003c/td>\n\u003ctd>Стандартная пара, но «more» не говорит, раскроется весь список или только часть.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show 18 more\u003c/td>\n\u003ctd>Show less\u003c/td>\n\u003ctd>Точно, но число меняется в зависимости от лимита, его сложнее локализовать.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cdel>Show all\u003c/del>\u003c/td>\n\u003ctd>\u003cdel>Hide all\u003c/del>\u003c/td>\n\u003ctd>Не использовать: «Hide all» читается как «скрыть всё», хотя первые варианты остаются на месте.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Что происходит по Show all\u003c/h3>\n\u003cul>\n\u003cli>Список раскрывается \u003cstrong>прямо в секции\u003c/strong>, без вложенного скролла: дровер и так скроллится, а скролл внутри скролла легко «зажевать» колесом мыши.\u003c/li>\n\u003cli>Если вариантов больше \u003cstrong>20\u003c/strong>, раскрытый список получает максимальную высоту примерно в 10 строк и собственный скролл. Поиск над списком в этом случае остаётся на месте.\u003c/li>\n\u003cli>Кнопка меняется на \u003cstrong>Show less\u003c/strong> и стоит под последним вариантом.\u003c/li>\n\u003c/ul>\n\u003ch3>Что происходит по Show less\u003c/h3>\n\u003cul>\n\u003cli>Список сворачивается обратно до лимита.\u003c/li>\n\u003cli>Если заголовок секции к этому моменту ушёл за верхний край, дровер подскролливается так, чтобы заголовок секции снова был виден. Пользователь не должен терять место, где он был.\u003c/li>\n\u003c/ul>\n\u003ch3>Поиск в списке\u003c/h3>\n\u003cul>\n\u003cli>Поле поиска показывается над списком, если вариантов больше 10.\u003c/li>\n\u003cli>Пока в поиске есть текст, показываются \u003cstrong>все\u003c/strong> совпадения, без лимита и без Show all.\u003c/li>\n\u003cli>Нет совпадений — текст «No results».\u003c/li>\n\u003cli>Очистка поиска (× в поле) возвращает список в прежнее состояние.\u003c/li>\n\u003c/ul>\n\u003ch3>Загрузка и ошибки\u003c/h3>\n\u003cul>\n\u003cli>Пока варианты загружаются, вместо них скелетоны (как в дропдауне чипа, IMG_2508).\u003c/li>\n\u003cli>Ошибка загрузки — текст ошибки и ссылка Retry внутри секции. Остальные секции работают как обычно.\u003c/li>\n\u003c/ul>\n"},{"md":"## C5. Кнопки футера\n\n### Apply\n\n**Apply всегда активна** (D1) — независимо от того, менял ли пользователь что-то.\n\nПо клику:\n\n1. Проверяются **все** поля дровера, в том числе в свёрнутых секциях.\n2. Ошибок нет → все фильтры применяются разом, дровер закрывается, таблица обновляется.\n3. Есть ошибки:\n   - ничего не применяется, дровер не закрывается;\n   - свёрнутые секции с ошибками разворачиваются;\n   - дровер **подскролливается к первому полю с ошибкой**, фокус переходит в это поле;\n   - у всех невалидных полей — красный бордер и текст ошибки.\n\nЧастичного применения нет: если невалидно хотя бы одно поле, не применяется ничего.\n\n### Сброс: Clear all или Reset to default\n\n**Рекомендация: одна кнопка сброса, а не две.** Две кнопки сброса рядом заставляют пользователя гадать, чем они отличаются. Кнопка Cancel тоже не нужна: её роль выполняет × в шапке.\n\nКнопка сброса **всегда возвращает фильтры к состоянию по умолчанию** (D4). Её название зависит от того, есть ли у страницы значения по умолчанию:\n\n| У страницы | Название | Что делает |\n|---|---|---|\n| Нет значений по умолчанию | **Clear all** | Очищает все фильтры. «По умолчанию» здесь значит «пусто», поэтому «Clear» точно описывает результат. |\n| Есть значения по умолчанию | **Reset to default** | Возвращает значения по умолчанию, остальное очищает. |\n\nПочему не оставить «Clear all» для обоих случаев: «Clear» обещает пустые поля. Если после клика в фильтре снова появится значение по умолчанию, пользователь решит, что кнопка не сработала. Почему не «Reset to default» для обоих: на странице без значений по умолчанию слово «default» непонятно — к какому умолчанию?\n\nПродукту не нужно выбирать название вручную: оно определяется тем, заданы ли значения по умолчанию. Это убирает разнобой между продуктами.\n\nПоведение кнопки:\n\n- сброс **применяется сразу** и дровер закрывается — так же, как Clear all на странице;\n- кнопка видна всегда, чтобы футер не менялся. Если сбрасывать нечего, клик просто закрывает дровер.\n\n### Clear в секции\n\n- Показывается только когда у фильтра есть значение.\n- Очищает **только черновик этой секции**: значение исчезает, но применяется оно вместе со всем остальным по Apply.\n- Если у фильтра есть значение по умолчанию, Clear в секции всё равно очищает поле полностью. Вернуть значение по умолчанию можно кнопкой Reset to default.","html":"\u003ch2>C5. Кнопки футера\u003c/h2>\n\u003ch3>Apply\u003c/h3>\n\u003cp>\u003cstrong>Apply всегда активна\u003c/strong> (D1) — независимо от того, менял ли пользователь что-то.\u003c/p>\n\u003cp>По клику:\u003c/p>\n\u003col>\n\u003cli>Проверяются \u003cstrong>все\u003c/strong> поля дровера, в том числе в свёрнутых секциях.\u003c/li>\n\u003cli>Ошибок нет → все фильтры применяются разом, дровер закрывается, таблица обновляется.\u003c/li>\n\u003cli>Есть ошибки:\u003cul>\n\u003cli>ничего не применяется, дровер не закрывается;\u003c/li>\n\u003cli>свёрнутые секции с ошибками разворачиваются;\u003c/li>\n\u003cli>дровер \u003cstrong>подскролливается к первому полю с ошибкой\u003c/strong>, фокус переходит в это поле;\u003c/li>\n\u003cli>у всех невалидных полей — красный бордер и текст ошибки.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003cp>Частичного применения нет: если невалидно хотя бы одно поле, не применяется ничего.\u003c/p>\n\u003ch3>Сброс: Clear all или Reset to default\u003c/h3>\n\u003cp>\u003cstrong>Рекомендация: одна кнопка сброса, а не две.\u003c/strong> Две кнопки сброса рядом заставляют пользователя гадать, чем они отличаются. Кнопка Cancel тоже не нужна: её роль выполняет × в шапке.\u003c/p>\n\u003cp>Кнопка сброса \u003cstrong>всегда возвращает фильтры к состоянию по умолчанию\u003c/strong> (D4). Её название зависит от того, есть ли у страницы значения по умолчанию:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>У страницы\u003c/th>\n\u003cth>Название\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Нет значений по умолчанию\u003c/td>\n\u003ctd>\u003cstrong>Clear all\u003c/strong>\u003c/td>\n\u003ctd>Очищает все фильтры. «По умолчанию» здесь значит «пусто», поэтому «Clear» точно описывает результат.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Есть значения по умолчанию\u003c/td>\n\u003ctd>\u003cstrong>Reset to default\u003c/strong>\u003c/td>\n\u003ctd>Возвращает значения по умолчанию, остальное очищает.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Почему не оставить «Clear all» для обоих случаев: «Clear» обещает пустые поля. Если после клика в фильтре снова появится значение по умолчанию, пользователь решит, что кнопка не сработала. Почему не «Reset to default» для обоих: на странице без значений по умолчанию слово «default» непонятно — к какому умолчанию?\u003c/p>\n\u003cp>Продукту не нужно выбирать название вручную: оно определяется тем, заданы ли значения по умолчанию. Это убирает разнобой между продуктами.\u003c/p>\n\u003cp>Поведение кнопки:\u003c/p>\n\u003cul>\n\u003cli>сброс \u003cstrong>применяется сразу\u003c/strong> и дровер закрывается — так же, как Clear all на странице;\u003c/li>\n\u003cli>кнопка видна всегда, чтобы футер не менялся. Если сбрасывать нечего, клик просто закрывает дровер.\u003c/li>\n\u003c/ul>\n\u003ch3>Clear в секции\u003c/h3>\n\u003cul>\n\u003cli>Показывается только когда у фильтра есть значение.\u003c/li>\n\u003cli>Очищает \u003cstrong>только черновик этой секции\u003c/strong>: значение исчезает, но применяется оно вместе со всем остальным по Apply.\u003c/li>\n\u003cli>Если у фильтра есть значение по умолчанию, Clear в секции всё равно очищает поле полностью. Вернуть значение по умолчанию можно кнопкой Reset to default.\u003c/li>\n\u003c/ul>\n"},{"md":"## C6. Синхронизация с чипами на странице\n\n- Быстрый фильтр **дублируется** в дровере. Так дровер остаётся полным списком фильтров страницы: пользователь может настроить всё в одном месте и применить одним Apply.\n- В дровере быстрые фильтры стоят первыми, в том же порядке, что на странице.\n- Значение, применённое в дровере, сразу видно в быстром фильтре на странице, и наоборот.\n- Быстрый фильтр **не превращается** в чип применённого фильтра и не дублируется на странице: одно значение — один чип.","html":"\u003ch2>C6. Синхронизация с чипами на странице\u003c/h2>\n\u003cul>\n\u003cli>Быстрый фильтр \u003cstrong>дублируется\u003c/strong> в дровере. Так дровер остаётся полным списком фильтров страницы: пользователь может настроить всё в одном месте и применить одним Apply.\u003c/li>\n\u003cli>В дровере быстрые фильтры стоят первыми, в том же порядке, что на странице.\u003c/li>\n\u003cli>Значение, применённое в дровере, сразу видно в быстром фильтре на странице, и наоборот.\u003c/li>\n\u003cli>Быстрый фильтр \u003cstrong>не превращается\u003c/strong> в чип применённого фильтра и не дублируется на странице: одно значение — один чип.\u003c/li>\n\u003c/ul>\n"},{"md":"## C7. Что ещё не описано\n\n- **Зависимые фильтры.** Например, варианты Sub-product зависят от выбранного Product. Что происходит с выбранным Sub-product, если Product поменяли в черновике?\n- **Группы секций.** Нужны ли подзаголовки групп, если фильтров больше 15?\n- **Ширина дровера** и поведение на узких экранах.\n- **Ошибка запроса после Apply.** Дровер уже закрыт — где показать ошибку (F2)?\n- **Счётчик на All Filters** — открытый вопрос B2.\n\n---\n\n# Блок D. Применение, валидация, очистка","html":"\u003ch2>C7. Что ещё не описано\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Зависимые фильтры.\u003c/strong> Например, варианты Sub-product зависят от выбранного Product. Что происходит с выбранным Sub-product, если Product поменяли в черновике?\u003c/li>\n\u003cli>\u003cstrong>Группы секций.\u003c/strong> Нужны ли подзаголовки групп, если фильтров больше 15?\u003c/li>\n\u003cli>\u003cstrong>Ширина дровера\u003c/strong> и поведение на узких экранах.\u003c/li>\n\u003cli>\u003cstrong>Ошибка запроса после Apply.\u003c/strong> Дровер уже закрыт — где показать ошибку (F2)?\u003c/li>\n\u003cli>\u003cstrong>Счётчик на All Filters\u003c/strong> — открытый вопрос B2.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Блок D. Применение, валидация, очистка\u003c/h1>\n"},{"md":"## D1. Кнопка Apply\n\n**Правило: Apply всегда активна** — в дропдауне чипа и в дровере. Не зависит от того, пустое ли поле и менялось ли что-то.\n\n### Что происходит по клику\n\n1. Запускается валидация всех полей, которые показываются в этом контейнере (дропдаун или дровер целиком).\n2. Есть ошибки → см. D2. Ничего не применяется, контейнер не закрывается.\n3. Ошибок нет:\n   - черновик становится применённым значением;\n   - пустое поле / пустой выбор = фильтр **снят** (параметр не уходит в запрос);\n   - дропдаун / дровер закрывается;\n   - таблица перезапрашивается, чипы обновляются.\n4. Если черновик совпадает с применённым значением — контейнер закрывается, запрос можно не отправлять (оптимизация, не обязательное требование).\n\n### Дополнительно\n\n- Enter в текстовом поле дропдауна = Apply.\n- В дровере Apply применяет **все** фильтры разом. Частичного применения нет: если хотя бы одно поле невалидно, не применяется ничего.\n\n### Почему так (комментарий к решению)\n\nСогласна с решением. Аргументы «за»:\n\n- соответствует конвенции продукта «кнопки не дизейблим»;\n- закрывает реальный баг: стереть значение и применить пустое было невозможно, кроме как через × или Clear all — а это неочевидно;\n- задизейбленная кнопка не объясняет, *почему* она неактивна; активная кнопка + ошибка у поля объясняет.\n\nНа что обратить внимание, чтобы решение не создало новых проблем:\n\n- «Apply с пустым значением» должен **снимать** фильтр, а не отправлять `\"\"` в запрос — это стоит явно прописать в задаче для разработки, иначе бэкенд может начать фильтровать по пустой строке;\n- «Apply без изменений» не должен порождать лишнюю перезагрузку таблицы (п. 4 выше).","html":"\u003ch2>D1. Кнопка Apply\u003c/h2>\n\u003cp>\u003cstrong>Правило: Apply всегда активна\u003c/strong> — в дропдауне чипа и в дровере. Не зависит от того, пустое ли поле и менялось ли что-то.\u003c/p>\n\u003ch3>Что происходит по клику\u003c/h3>\n\u003col>\n\u003cli>Запускается валидация всех полей, которые показываются в этом контейнере (дропдаун или дровер целиком).\u003c/li>\n\u003cli>Есть ошибки → см. D2. Ничего не применяется, контейнер не закрывается.\u003c/li>\n\u003cli>Ошибок нет:\u003cul>\n\u003cli>черновик становится применённым значением;\u003c/li>\n\u003cli>пустое поле / пустой выбор = фильтр \u003cstrong>снят\u003c/strong> (параметр не уходит в запрос);\u003c/li>\n\u003cli>дропдаун / дровер закрывается;\u003c/li>\n\u003cli>таблица перезапрашивается, чипы обновляются.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Если черновик совпадает с применённым значением — контейнер закрывается, запрос можно не отправлять (оптимизация, не обязательное требование).\u003c/li>\n\u003c/ol>\n\u003ch3>Дополнительно\u003c/h3>\n\u003cul>\n\u003cli>Enter в текстовом поле дропдауна = Apply.\u003c/li>\n\u003cli>В дровере Apply применяет \u003cstrong>все\u003c/strong> фильтры разом. Частичного применения нет: если хотя бы одно поле невалидно, не применяется ничего.\u003c/li>\n\u003c/ul>\n\u003ch3>Почему так (комментарий к решению)\u003c/h3>\n\u003cp>Согласна с решением. Аргументы «за»:\u003c/p>\n\u003cul>\n\u003cli>соответствует конвенции продукта «кнопки не дизейблим»;\u003c/li>\n\u003cli>закрывает реальный баг: стереть значение и применить пустое было невозможно, кроме как через × или Clear all — а это неочевидно;\u003c/li>\n\u003cli>задизейбленная кнопка не объясняет, \u003cem>почему\u003c/em> она неактивна; активная кнопка + ошибка у поля объясняет.\u003c/li>\n\u003c/ul>\n\u003cp>На что обратить внимание, чтобы решение не создало новых проблем:\u003c/p>\n\u003cul>\n\u003cli>«Apply с пустым значением» должен \u003cstrong>снимать\u003c/strong> фильтр, а не отправлять \u003ccode>&quot;&quot;\u003c/code> в запрос — это стоит явно прописать в задаче для разработки, иначе бэкенд может начать фильтровать по пустой строке;\u003c/li>\n\u003cli>«Apply без изменений» не должен порождать лишнюю перезагрузку таблицы (п. 4 выше).\u003c/li>\n\u003c/ul>\n"},{"md":"## D2. Валидация\n\n### Когда показываем ошибку\n\n| Момент | Поведение |\n|---|---|\n| Пользователь печатает | Ошибку не показываем (не ругаем на полпути). Исключение — если ошибка у поля уже показана: она пересчитывается на каждый ввод и пропадает, как только значение стало валидным. |\n| Потеря фокуса (blur) | Поле валидируется, при ошибке — красный бордер + текст ошибки под полем. |\n| Клик Apply | Валидируются все поля контейнера (в т. ч. те, которых пользователь не касался). |\n\n### Клик Apply при невалидном значении\n\nКнопка остаётся активной, но:\n\n- значение **не применяется и не отправляется**;\n- дропдаун / дровер **не закрывается**;\n- у невалидных полей — красный бордер и текст ошибки;\n- **фокус переходит в первое невалидное поле** (а не просто снимается). Предлагаю это вместо «снять фокус»: пользователь сразу может исправить значение, и это работает для клавиатуры и скринридеров. Если команда хочет именно blur — допустимо, но тогда хотя бы не терять позицию фокуса на кнопке.\n- в дровере: если невалидное поле в свёрнутом аккордеоне — аккордеон раскрывается, дровер скроллится к первому полю с ошибкой.\n\n### Закрытие с невалидным черновиком\n\nКлик вне / Esc / повторный клик по чипу — закрывают, невалидный черновик отбрасывается, ошибки сбрасываются. Применённое значение остаётся прежним.\n\n### Обязательность\n\nФильтр по своей природе необязателен. Красные точки «required» в макетах фильтров (IMG_2344, IMG_2349) нужно либо убрать (визуал, позже), либо описать конкретный кейс, где пустое значение недопустимо. Предлагаю: обязательных фильтров нет; если у страницы обязательный параметр — это значение по умолчанию (D4), которое нельзя снять.\n\n### Комментарий к решению\n\nСогласна: активная кнопка + блокировка отправки — правильная связка. Это стандартное поведение форм («валидируй по submit, не дизейбли submit»). Важное — чтобы клик по Apply давал **видимую** реакцию; иначе пользователь решит, что кнопка сломана. Отсюда перенос фокуса в поле с ошибкой и раскрытие аккордеона в дровере.","html":"\u003ch2>D2. Валидация\u003c/h2>\n\u003ch3>Когда показываем ошибку\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Момент\u003c/th>\n\u003cth>Поведение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Пользователь печатает\u003c/td>\n\u003ctd>Ошибку не показываем (не ругаем на полпути). Исключение — если ошибка у поля уже показана: она пересчитывается на каждый ввод и пропадает, как только значение стало валидным.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Потеря фокуса (blur)\u003c/td>\n\u003ctd>Поле валидируется, при ошибке — красный бордер + текст ошибки под полем.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Клик Apply\u003c/td>\n\u003ctd>Валидируются все поля контейнера (в т. ч. те, которых пользователь не касался).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Клик Apply при невалидном значении\u003c/h3>\n\u003cp>Кнопка остаётся активной, но:\u003c/p>\n\u003cul>\n\u003cli>значение \u003cstrong>не применяется и не отправляется\u003c/strong>;\u003c/li>\n\u003cli>дропдаун / дровер \u003cstrong>не закрывается\u003c/strong>;\u003c/li>\n\u003cli>у невалидных полей — красный бордер и текст ошибки;\u003c/li>\n\u003cli>\u003cstrong>фокус переходит в первое невалидное поле\u003c/strong> (а не просто снимается). Предлагаю это вместо «снять фокус»: пользователь сразу может исправить значение, и это работает для клавиатуры и скринридеров. Если команда хочет именно blur — допустимо, но тогда хотя бы не терять позицию фокуса на кнопке.\u003c/li>\n\u003cli>в дровере: если невалидное поле в свёрнутом аккордеоне — аккордеон раскрывается, дровер скроллится к первому полю с ошибкой.\u003c/li>\n\u003c/ul>\n\u003ch3>Закрытие с невалидным черновиком\u003c/h3>\n\u003cp>Клик вне / Esc / повторный клик по чипу — закрывают, невалидный черновик отбрасывается, ошибки сбрасываются. Применённое значение остаётся прежним.\u003c/p>\n\u003ch3>Обязательность\u003c/h3>\n\u003cp>Фильтр по своей природе необязателен. Красные точки «required» в макетах фильтров (IMG_2344, IMG_2349) нужно либо убрать (визуал, позже), либо описать конкретный кейс, где пустое значение недопустимо. Предлагаю: обязательных фильтров нет; если у страницы обязательный параметр — это значение по умолчанию (D4), которое нельзя снять.\u003c/p>\n\u003ch3>Комментарий к решению\u003c/h3>\n\u003cp>Согласна: активная кнопка + блокировка отправки — правильная связка. Это стандартное поведение форм («валидируй по submit, не дизейбли submit»). Важное — чтобы клик по Apply давал \u003cstrong>видимую\u003c/strong> реакцию; иначе пользователь решит, что кнопка сломана. Отсюда перенос фокуса в поле с ошибкой и раскрытие аккордеона в дровере.\u003c/p>\n"},{"md":"## D3. Очистка\n\n⚠️ Частично.\n\n| Элемент | Где | Что делает |\n|---|---|---|\n| × на чипе | страница | Очищает этот фильтр и **сразу применяет**. Дропдаун не открывается. Быстрый фильтр остаётся без значения, чип применённого фильтра исчезает (B1). |\n| Clear all | страница | Очищает все фильтры и сразу применяет. Показывается, только если применён хотя бы один фильтр. Быстрые фильтры остаются без значений, чипы применённых фильтров исчезают. |\n| Clear в секции | дровер | Показывается, только если у фильтра есть значение; у Switch его нет. Очищает черновик этой секции. Применяется по Apply. |\n| Clear all / Reset to default | дровер | Возвращает все фильтры к состоянию по умолчанию, **сразу применяет** и закрывает дровер. Название зависит от того, есть ли значения по умолчанию (C5). |\n| Стереть значение в поле + Apply | чип и дровер | То же, что ×: фильтр снят. |","html":"\u003ch2>D3. Очистка\u003c/h2>\n\u003cp>⚠️ Частично.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Элемент\u003c/th>\n\u003cth>Где\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>× на чипе\u003c/td>\n\u003ctd>страница\u003c/td>\n\u003ctd>Очищает этот фильтр и \u003cstrong>сразу применяет\u003c/strong>. Дропдаун не открывается. Быстрый фильтр остаётся без значения, чип применённого фильтра исчезает (B1).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all\u003c/td>\n\u003ctd>страница\u003c/td>\n\u003ctd>Очищает все фильтры и сразу применяет. Показывается, только если применён хотя бы один фильтр. Быстрые фильтры остаются без значений, чипы применённых фильтров исчезают.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear в секции\u003c/td>\n\u003ctd>дровер\u003c/td>\n\u003ctd>Показывается, только если у фильтра есть значение; у Switch его нет. Очищает черновик этой секции. Применяется по Apply.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all / Reset to default\u003c/td>\n\u003ctd>дровер\u003c/td>\n\u003ctd>Возвращает все фильтры к состоянию по умолчанию, \u003cstrong>сразу применяет\u003c/strong> и закрывает дровер. Название зависит от того, есть ли значения по умолчанию (C5).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Стереть значение в поле + Apply\u003c/td>\n\u003ctd>чип и дровер\u003c/td>\n\u003ctd>То же, что ×: фильтр снят.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## D4. Значения по умолчанию и Reset to default\n\n⚠️ Частично.\n\n- Значение по умолчанию — значение, которое продукт задаёт фильтру при первом открытии страницы.\n- Секция дровера со значением по умолчанию считается секцией со значением: она развёрнута и у неё есть Clear (C3).\n- Кнопка сброса в дровере возвращает именно значения по умолчанию; если их нет, она называется Clear all (C5).\n- Не описано: как значения по умолчанию показываются в чипах на странице и что делает Clear all на странице, если они есть.\n\n---\n\n# Блок E. Типы фильтров\n\nЗдесь только то, чем тип отличается от общих правил блоков A–D. Для каждого типа описано поведение в трёх местах: чип на странице без значения, чип со значением и секция в дровере.","html":"\u003ch2>D4. Значения по умолчанию и Reset to default\u003c/h2>\n\u003cp>⚠️ Частично.\u003c/p>\n\u003cul>\n\u003cli>Значение по умолчанию — значение, которое продукт задаёт фильтру при первом открытии страницы.\u003c/li>\n\u003cli>Секция дровера со значением по умолчанию считается секцией со значением: она развёрнута и у неё есть Clear (C3).\u003c/li>\n\u003cli>Кнопка сброса в дровере возвращает именно значения по умолчанию; если их нет, она называется Clear all (C5).\u003c/li>\n\u003cli>Не описано: как значения по умолчанию показываются в чипах на странице и что делает Clear all на странице, если они есть.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Блок E. Типы фильтров\u003c/h1>\n\u003cp>Здесь только то, чем тип отличается от общих правил блоков A–D. Для каждого типа описано поведение в трёх местах: чип на странице без значения, чип со значением и секция в дровере.\u003c/p>\n"},{"md":"## Общее для всех типов\n\n- **Чип без значения:** `Label ⌄`. У Switch шеврона нет.\n- **Чип со значением:** `Label Value × ⌄`. Клик по × очищает фильтр и сразу применяет (D3).\n- **Открытый дропдаун:** чип в активном (filled) состоянии, шеврон смотрит вверх.\n- **Заголовок секции в дровере** всегда выровнен **по левому краю**.\n- **Clear в секции дровера** показывается, **только если у фильтра есть значение**. Нет значения — нет и кнопки Clear. У Switch кнопки Clear нет никогда.\n- **Apply в дропдауне чипа** есть у типов, где значение вводят с клавиатуры или выбирают несколько вариантов: Text input, Amount range, Multiselect. У Select, Date picker и Date range picker кнопки Apply нет: выбор применяется сразу.","html":"\u003ch2>Общее для всех типов\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Чип без значения:\u003c/strong> \u003ccode>Label ⌄\u003c/code>. У Switch шеврона нет.\u003c/li>\n\u003cli>\u003cstrong>Чип со значением:\u003c/strong> \u003ccode>Label Value × ⌄\u003c/code>. Клик по × очищает фильтр и сразу применяет (D3).\u003c/li>\n\u003cli>\u003cstrong>Открытый дропдаун:\u003c/strong> чип в активном (filled) состоянии, шеврон смотрит вверх.\u003c/li>\n\u003cli>\u003cstrong>Заголовок секции в дровере\u003c/strong> всегда выровнен \u003cstrong>по левому краю\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Clear в секции дровера\u003c/strong> показывается, \u003cstrong>только если у фильтра есть значение\u003c/strong>. Нет значения — нет и кнопки Clear. У Switch кнопки Clear нет никогда.\u003c/li>\n\u003cli>\u003cstrong>Apply в дропдауне чипа\u003c/strong> есть у типов, где значение вводят с клавиатуры или выбирают несколько вариантов: Text input, Amount range, Multiselect. У Select, Date picker и Date range picker кнопки Apply нет: выбор применяется сразу.\u003c/li>\n\u003c/ul>\n"},{"md":"## Сводная таблица\n\n| Тип | Чип без значения | Дропдаун на странице | Чип со значением | Дровер | Apply в дропдауне |\n|---|---|---|---|---|---|\n| Text input | `Label ⌄` | Поле + Apply | `Label Value × ⌄` | Одно поле | Да |\n| Amount range | `Label ⌄` | Два поля «от» и «до» + Apply | `Label from 10 to 100 × ⌄` | Два поля в строку | Да |\n| Select | `Label ⌄` | Поиск + список, один вариант | `Label Option × ⌄` | Список с радио-кнопками, поиск, Show all | Нет |\n| Multiselect | `Label ⌄` | Поиск + список с чекбоксами + Apply | `Label Option × ⌄` или `Label (2) × ⌄` | Список с чекбоксами, поиск, Show all | Да |\n| Date picker | `Label ⌄` | Один календарь | `Label 08/10/2025 × ⌄` | Одно поле с одной датой | Нет |\n| Date range picker | `Label ⌄` | Один пикер с двумя календарями | `Label from 08/10/2025 to 02/12/2025 × ⌄` | **Одно** поле с двумя датами | Нет |\n| Switch | `Label` (без шеврона) | Нет дропдауна | `Label ×` | Только переключатель, без Clear | — |","html":"\u003ch2>Сводная таблица\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Тип\u003c/th>\n\u003cth>Чип без значения\u003c/th>\n\u003cth>Дропдаун на странице\u003c/th>\n\u003cth>Чип со значением\u003c/th>\n\u003cth>Дровер\u003c/th>\n\u003cth>Apply в дропдауне\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Text input\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Поле + Apply\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code>\u003c/td>\n\u003ctd>Одно поле\u003c/td>\n\u003ctd>Да\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amount range\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Два поля «от» и «до» + Apply\u003c/td>\n\u003ctd>\u003ccode>Label from 10 to 100 × ⌄\u003c/code>\u003c/td>\n\u003ctd>Два поля в строку\u003c/td>\n\u003ctd>Да\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Select\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Поиск + список, один вариант\u003c/td>\n\u003ctd>\u003ccode>Label Option × ⌄\u003c/code>\u003c/td>\n\u003ctd>Список с радио-кнопками, поиск, Show all\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Multiselect\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Поиск + список с чекбоксами + Apply\u003c/td>\n\u003ctd>\u003ccode>Label Option × ⌄\u003c/code> или \u003ccode>Label (2) × ⌄\u003c/code>\u003c/td>\n\u003ctd>Список с чекбоксами, поиск, Show all\u003c/td>\n\u003ctd>Да\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Date picker\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Один календарь\u003c/td>\n\u003ctd>\u003ccode>Label 08/10/2025 × ⌄\u003c/code>\u003c/td>\n\u003ctd>Одно поле с одной датой\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Date range picker\u003c/td>\n\u003ctd>\u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Один пикер с двумя календарями\u003c/td>\n\u003ctd>\u003ccode>Label from 08/10/2025 to 02/12/2025 × ⌄\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Одно\u003c/strong> поле с двумя датами\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Switch\u003c/td>\n\u003ctd>\u003ccode>Label\u003c/code> (без шеврона)\u003c/td>\n\u003ctd>Нет дропдауна\u003c/td>\n\u003ctd>\u003ccode>Label ×\u003c/code>\u003c/td>\n\u003ctd>Только переключатель, без Clear\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## E1. Text input\n\nВарианты: **Text** (любой текст, плейсхолдер «Input the value») и **Numeric** (только цифры, плейсхолдер «Input the number»).\n\n**На странице**\n- Клик по чипу открывает дропдаун: заголовок поля, поле ввода и Apply. Фокус сразу в поле.\n- Когда в поле есть текст, внутри поля появляется × для быстрой очистки ввода. Он очищает только черновик: фильтр снимается, когда пользователь нажмёт Apply.\n- Enter в поле работает как Apply.\n- После Apply чип показывает введённое значение: `Text Caldera UI × ⌄`. Длинное значение обрезается многоточием (B3).\n- Повторное открытие показывает применённое значение в поле.\n\n**В дровере**\n- Одно поле под заголовком секции. Clear появляется, когда в поле есть применённое или введённое значение.\n- Иконки календаря в текстовом поле быть не должно (ошибка в макете, см. ниже).\n\n**Валидация** — по общим правилам D2. Для Numeric: нецифровые символы не вводятся.","html":"\u003ch2>E1. Text input\u003c/h2>\n\u003cp>Варианты: \u003cstrong>Text\u003c/strong> (любой текст, плейсхолдер «Input the value») и \u003cstrong>Numeric\u003c/strong> (только цифры, плейсхолдер «Input the number»).\u003c/p>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Клик по чипу открывает дропдаун: заголовок поля, поле ввода и Apply. Фокус сразу в поле.\u003c/li>\n\u003cli>Когда в поле есть текст, внутри поля появляется × для быстрой очистки ввода. Он очищает только черновик: фильтр снимается, когда пользователь нажмёт Apply.\u003c/li>\n\u003cli>Enter в поле работает как Apply.\u003c/li>\n\u003cli>После Apply чип показывает введённое значение: \u003ccode>Text Caldera UI × ⌄\u003c/code>. Длинное значение обрезается многоточием (B3).\u003c/li>\n\u003cli>Повторное открытие показывает применённое значение в поле.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Одно поле под заголовком секции. Clear появляется, когда в поле есть применённое или введённое значение.\u003c/li>\n\u003cli>Иконки календаря в текстовом поле быть не должно (ошибка в макете, см. ниже).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Валидация\u003c/strong> — по общим правилам D2. Для Numeric: нецифровые символы не вводятся.\u003c/p>\n"},{"md":"## E2. Amount range\n\n**На странице**\n- Дропдаун: два поля «от» и «до» в строку + Apply.\n- В чипе: `Label from 10 to 100`, `Label from 10`, `Label to 100`.\n\n**В дровере**\n- Два поля в строку под заголовком секции, без иконок календаря.\n\n**Правила границ**\n- Заполнены обе границы → проверяем `from ≤ to`. Ошибка показывается у поля, которое редактировали последним (или у `to`, если оба).\n- Заполнена одна граница → валидно, это открытый диапазон.\n- Обе пустые → фильтр снят. Это **не ошибка**: в макете Validation (IMG_2520, четвёртый пример) пустые поля ошибочно показаны с ошибкой.\n\n**Не описано:** формат ввода чисел и разделители разрядов.","html":"\u003ch2>E2. Amount range\u003c/h2>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Дропдаун: два поля «от» и «до» в строку + Apply.\u003c/li>\n\u003cli>В чипе: \u003ccode>Label from 10 to 100\u003c/code>, \u003ccode>Label from 10\u003c/code>, \u003ccode>Label to 100\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Два поля в строку под заголовком секции, без иконок календаря.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Правила границ\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Заполнены обе границы → проверяем \u003ccode>from ≤ to\u003c/code>. Ошибка показывается у поля, которое редактировали последним (или у \u003ccode>to\u003c/code>, если оба).\u003c/li>\n\u003cli>Заполнена одна граница → валидно, это открытый диапазон.\u003c/li>\n\u003cli>Обе пустые → фильтр снят. Это \u003cstrong>не ошибка\u003c/strong>: в макете Validation (IMG_2520, четвёртый пример) пустые поля ошибочно показаны с ошибкой.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Не описано:\u003c/strong> формат ввода чисел и разделители разрядов.\u003c/p>\n"},{"md":"## E3. Select\n\nОдиночный выбор.\n\n**На странице**\n- Дропдаун: поиск и список вариантов. Кнопки Apply нет.\n- Клик по варианту **сразу применяет** его и закрывает дропдаун.\n- В чипе: `Label Option × ⌄`.\n- Пока список загружается, вместо вариантов показываются скелетоны (IMG_2508).\n\n**В дровере**\n- Список с радио-кнопками, поиск, Show all для длинных списков. Clear появляется, когда вариант выбран.\n- Выбор в дровере меняет черновик и применяется по Apply дровера.\n\n> В Pixso есть вариант Select с кнопкой Apply и подзаголовками у вариантов (IMG_2512, сверху). Нужно решить, остаётся ли он отдельным вариантом или его убираем — см. открытые вопросы.","html":"\u003ch2>E3. Select\u003c/h2>\n\u003cp>Одиночный выбор.\u003c/p>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Дропдаун: поиск и список вариантов. Кнопки Apply нет.\u003c/li>\n\u003cli>Клик по варианту \u003cstrong>сразу применяет\u003c/strong> его и закрывает дропдаун.\u003c/li>\n\u003cli>В чипе: \u003ccode>Label Option × ⌄\u003c/code>.\u003c/li>\n\u003cli>Пока список загружается, вместо вариантов показываются скелетоны (IMG_2508).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Список с радио-кнопками, поиск, Show all для длинных списков. Clear появляется, когда вариант выбран.\u003c/li>\n\u003cli>Выбор в дровере меняет черновик и применяется по Apply дровера.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>В Pixso есть вариант Select с кнопкой Apply и подзаголовками у вариантов (IMG_2512, сверху). Нужно решить, остаётся ли он отдельным вариантом или его убираем — см. открытые вопросы.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## E4. Multiselect\n\n**На странице**\n- Дропдаун: поиск, список с чекбоксами и Apply.\n- В чипе: один выбранный вариант — `Label Option × ⌄`, два и больше — счётчик `Label (2) × ⌄`.\n\n**В дровере**\n- Список с чекбоксами, поиск, Show all. Clear появляется, когда выбран хотя бы один вариант.","html":"\u003ch2>E4. Multiselect\u003c/h2>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Дропдаун: поиск, список с чекбоксами и Apply.\u003c/li>\n\u003cli>В чипе: один выбранный вариант — \u003ccode>Label Option × ⌄\u003c/code>, два и больше — счётчик \u003ccode>Label (2) × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Список с чекбоксами, поиск, Show all. Clear появляется, когда выбран хотя бы один вариант.\u003c/li>\n\u003c/ul>\n"},{"md":"## E5. Date picker\n\nОдно поле — **одна дата**.\n\n**На странице**\n- Дропдаун: один календарь с переключением месяца и года. Кнопки Apply нет.\n- Клик по дате **сразу применяет** её и закрывает дропдаун.\n- В чипе: `Label 08/10/2025 × ⌄`.\n\n**В дровере**\n- Одно поле с плейсхолдером `DD/MM/YYYY` и иконкой календаря. Клик по полю или иконке открывает тот же календарь.","html":"\u003ch2>E5. Date picker\u003c/h2>\n\u003cp>Одно поле — \u003cstrong>одна дата\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Дропдаун: один календарь с переключением месяца и года. Кнопки Apply нет.\u003c/li>\n\u003cli>Клик по дате \u003cstrong>сразу применяет\u003c/strong> её и закрывает дропдаун.\u003c/li>\n\u003cli>В чипе: \u003ccode>Label 08/10/2025 × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Одно поле с плейсхолдером \u003ccode>DD/MM/YYYY\u003c/code> и иконкой календаря. Клик по полю или иконке открывает тот же календарь.\u003c/li>\n\u003c/ul>\n"},{"md":"## E6. Date range picker\n\n**Правило: Date range picker — это одно поле и один пикер.** Не два Date picker.\n\nРаньше Date range picker был ошибочно собран из двух отдельных Date picker («с» и «по»), и связь между выбором начальной и конечной даты работала неудобно. От этого уходим: диапазон всегда выбирается в одном поле.\n\n**На странице**\n- Дропдаун: один пикер с двумя календарями (текущий и следующий месяц). Кнопки Apply нет.\n- Первый клик — начальная дата, второй — конечная. Дни между ними подсвечиваются.\n- Если второй клик раньше первой даты, даты меняются местами: диапазон всегда идёт от ранней даты к поздней.\n- Начало и конец могут совпадать: двойной клик по одной дате — диапазон в один день.\n- После выбора второй даты диапазон **сразу применяется**, дропдаун закрывается.\n- Если пользователь выбрал только начальную дату и закрыл дропдаун, черновик отбрасывается (A1).\n- В чипе: `Label from 08/10/2025 to 02/12/2025 × ⌄`.\n\n**В дровере**\n- **Одно** поле с плейсхолдером из двух дат через дефис: `DD/MM/YYYY – DD/MM/YYYY`.\n- Клик по полю открывает тот же пикер с двумя календарями.\n- После выбора в поле сразу проставляются обе даты: `08/10/2025 – 02/12/2025`.\n- Clear очищает обе даты сразу.\n\n**Одна граница:** в отличие от Amount range, открытого диапазона у дат нет: применяется только диапазон с обеими датами.","html":"\u003ch2>E6. Date range picker\u003c/h2>\n\u003cp>\u003cstrong>Правило: Date range picker — это одно поле и один пикер.\u003c/strong> Не два Date picker.\u003c/p>\n\u003cp>Раньше Date range picker был ошибочно собран из двух отдельных Date picker («с» и «по»), и связь между выбором начальной и конечной даты работала неудобно. От этого уходим: диапазон всегда выбирается в одном поле.\u003c/p>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Дропдаун: один пикер с двумя календарями (текущий и следующий месяц). Кнопки Apply нет.\u003c/li>\n\u003cli>Первый клик — начальная дата, второй — конечная. Дни между ними подсвечиваются.\u003c/li>\n\u003cli>Если второй клик раньше первой даты, даты меняются местами: диапазон всегда идёт от ранней даты к поздней.\u003c/li>\n\u003cli>Начало и конец могут совпадать: двойной клик по одной дате — диапазон в один день.\u003c/li>\n\u003cli>После выбора второй даты диапазон \u003cstrong>сразу применяется\u003c/strong>, дропдаун закрывается.\u003c/li>\n\u003cli>Если пользователь выбрал только начальную дату и закрыл дропдаун, черновик отбрасывается (A1).\u003c/li>\n\u003cli>В чипе: \u003ccode>Label from 08/10/2025 to 02/12/2025 × ⌄\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Одно\u003c/strong> поле с плейсхолдером из двух дат через дефис: \u003ccode>DD/MM/YYYY – DD/MM/YYYY\u003c/code>.\u003c/li>\n\u003cli>Клик по полю открывает тот же пикер с двумя календарями.\u003c/li>\n\u003cli>После выбора в поле сразу проставляются обе даты: \u003ccode>08/10/2025 – 02/12/2025\u003c/code>.\u003c/li>\n\u003cli>Clear очищает обе даты сразу.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Одна граница:\u003c/strong> в отличие от Amount range, открытого диапазона у дат нет: применяется только диапазон с обеими датами.\u003c/p>\n"},{"md":"## E7. Switch\n\n**Название.** Предлагаю называть тип **Switch**, а не Boolean. Boolean — это тип данных, а не элемент интерфейса. В дровере это и есть переключатель, и в Pixso секция уже подписана «Switch» (IMG_2522). На странице его можно называть «чип-переключатель».\n\n**На странице**\n- Чип без шеврона: `Label`. Дропдауна нет.\n- Клик — фильтр включается и **сразу применяется**, на чипе появляется ×: `Label ×`.\n- Повторный клик по чипу или клик по × — фильтр снимается и сразу применяется, × исчезает.\n- Ховер: чип в активном (filled) состоянии (IMG_2509).\n\n**В дровере**\n- Только переключатель, **без кнопки Clear**.\n- Переключение меняет черновик и применяется по Apply дровера.\n\n**Состояния:** включён / не задан. Значения `false` нет: выключенный Switch не фильтрует таблицу. Если нужен фильтр «только нет», это Select с вариантами Yes / No.\n\nSwitch почти всегда используется как быстрый фильтр (B1).","html":"\u003ch2>E7. Switch\u003c/h2>\n\u003cp>\u003cstrong>Название.\u003c/strong> Предлагаю называть тип \u003cstrong>Switch\u003c/strong>, а не Boolean. Boolean — это тип данных, а не элемент интерфейса. В дровере это и есть переключатель, и в Pixso секция уже подписана «Switch» (IMG_2522). На странице его можно называть «чип-переключатель».\u003c/p>\n\u003cp>\u003cstrong>На странице\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Чип без шеврона: \u003ccode>Label\u003c/code>. Дропдауна нет.\u003c/li>\n\u003cli>Клик — фильтр включается и \u003cstrong>сразу применяется\u003c/strong>, на чипе появляется ×: \u003ccode>Label ×\u003c/code>.\u003c/li>\n\u003cli>Повторный клик по чипу или клик по × — фильтр снимается и сразу применяется, × исчезает.\u003c/li>\n\u003cli>Ховер: чип в активном (filled) состоянии (IMG_2509).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>В дровере\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Только переключатель, \u003cstrong>без кнопки Clear\u003c/strong>.\u003c/li>\n\u003cli>Переключение меняет черновик и применяется по Apply дровера.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Состояния:\u003c/strong> включён / не задан. Значения \u003ccode>false\u003c/code> нет: выключенный Switch не фильтрует таблицу. Если нужен фильтр «только нет», это Select с вариантами Yes / No.\u003c/p>\n\u003cp>Switch почти всегда используется как быстрый фильтр (B1).\u003c/p>\n"},{"md":"## Ошибки в текущих макетах\n\nНе меняют поведение, но их стоит поправить, когда дойдём до визуала:\n\n- **Дровер (IMG_2522):** заголовки секций Amount range, Text input и Date range стоят по центру. Все заголовки должны быть выровнены по левому краю.\n- **Дровер:** у полей Amount range и Text input иконка календаря — её быть не должно.\n- **Дровер:** кнопка в футере подписана «Save», должна быть «Apply».\n- **Дровер:** у полей стоят красные точки «required» — у фильтров обязательных полей нет (D2).\n- **Date picker на странице (IMG_2519):** у чипа со значением нет ×.\n- **Validation (IMG_2520):** две пустые границы Amount range показаны с ошибкой, а это снятый фильтр.\n\n---\n\n# Блок F. Фильтры и страница","html":"\u003ch2>Ошибки в текущих макетах\u003c/h2>\n\u003cp>Не меняют поведение, но их стоит поправить, когда дойдём до визуала:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Дровер (IMG_2522):\u003c/strong> заголовки секций Amount range, Text input и Date range стоят по центру. Все заголовки должны быть выровнены по левому краю.\u003c/li>\n\u003cli>\u003cstrong>Дровер:\u003c/strong> у полей Amount range и Text input иконка календаря — её быть не должно.\u003c/li>\n\u003cli>\u003cstrong>Дровер:\u003c/strong> кнопка в футере подписана «Save», должна быть «Apply».\u003c/li>\n\u003cli>\u003cstrong>Дровер:\u003c/strong> у полей стоят красные точки «required» — у фильтров обязательных полей нет (D2).\u003c/li>\n\u003cli>\u003cstrong>Date picker на странице (IMG_2519):\u003c/strong> у чипа со значением нет ×.\u003c/li>\n\u003cli>\u003cstrong>Validation (IMG_2520):\u003c/strong> две пустые границы Amount range показаны с ошибкой, а это снятый фильтр.\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003ch1>Блок F. Фильтры и страница\u003c/h1>\n"},{"md":"## F1. Сохранение фильтров\n\n⏳ Не описано.","html":"\u003ch2>F1. Сохранение фильтров\u003c/h2>\n\u003cp>⏳ Не описано.\u003c/p>\n"},{"md":"## F2. Результат фильтрации\n\n⏳ Не описано.\n\n---\n\n# Блок G. Клавиатура и доступность","html":"\u003ch2>F2. Результат фильтрации\u003c/h2>\n\u003cp>⏳ Не описано.\u003c/p>\n\u003chr>\n\u003ch1>Блок G. Клавиатура и доступность\u003c/h1>\n"},{"md":"## G1. Порядок фокуса, клавиши, скринридеры\n\n⚠️ Пока правила разбросаны по B5, D1, D2. Собрать сюда.","html":"\u003ch2>G1. Порядок фокуса, клавиши, скринридеры\u003c/h2>\n\u003cp>⚠️ Пока правила разбросаны по B5, D1, D2. Собрать сюда.\u003c/p>\n"},{"md":"## Открытые вопросы\n\n1. **C5 · Кнопка сброса в дровере** — подтвердить: одна кнопка; называется Clear all, если значений по умолчанию нет, и Reset to default, если есть; сброс применяется сразу и закрывает дровер.\n2. **D4 · Clear all на странице при значениях по умолчанию** — очищает всё или возвращает к значениям по умолчанию, как кнопка в дровере? Предлагаю второе и тогда переименовать её так же, в Reset to default.\n3. **E7 · Switch** — есть ли в продуктах фильтры, где сейчас реально используется значение `false`? Их нужно найти и перевести на select до изменения поведения чипа.\n4. **F1 · Сохранение при смене таба** (вопрос из макета IMG_2352) — фильтры общие для всех табов или свои у каждого?\n5. **C4 · Длинные списки** — подтвердить: лимит 6 по умолчанию с настройкой у продукта; Show all, только если скрыто 2 варианта или больше; названия Show all (N) / Show less; выбранные варианты поднимаются наверх при открытии дровера.\n6. **A3, B4, C3 · Быстрые фильтры** — подтвердить предложения: быстрый фильтр дублируется в дровере; чипы применённых фильтров стоят в порядке секций дровера; ориентир «до 5 фильтров — только быстрые» и «не больше 4 быстрых вместе с All Filters».\n7. **B2 · Счётчик на All Filters** — нужен ли бейдж с числом применённых фильтров (особенно в конфигурации B, где чипы могут уйти на вторую строку)? Если да — считать ли в нём быстрые фильтры.\n8. **B3 · Формат дат в чипе** — в storybook `MM/DD/YYYY`, в макетах `DD/MM/YY`. Выбрать один (визуал, не блокирует).\n9. **E3 · Select с кнопкой Apply** (IMG_2512) — оставляем как отдельный вариант (например, для вариантов с подзаголовками) или убираем, чтобы Select всегда применялся по клику?\n10. **E6 · Date range picker** — подтвердить: если вторая дата раньше первой, даты меняются местами; двойной клик по одной дате — диапазон в один день.","html":"\u003ch2>Открытые вопросы\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>C5 · Кнопка сброса в дровере\u003c/strong> — подтвердить: одна кнопка; называется Clear all, если значений по умолчанию нет, и Reset to default, если есть; сброс применяется сразу и закрывает дровер.\u003c/li>\n\u003cli>\u003cstrong>D4 · Clear all на странице при значениях по умолчанию\u003c/strong> — очищает всё или возвращает к значениям по умолчанию, как кнопка в дровере? Предлагаю второе и тогда переименовать её так же, в Reset to default.\u003c/li>\n\u003cli>\u003cstrong>E7 · Switch\u003c/strong> — есть ли в продуктах фильтры, где сейчас реально используется значение \u003ccode>false\u003c/code>? Их нужно найти и перевести на select до изменения поведения чипа.\u003c/li>\n\u003cli>\u003cstrong>F1 · Сохранение при смене таба\u003c/strong> (вопрос из макета IMG_2352) — фильтры общие для всех табов или свои у каждого?\u003c/li>\n\u003cli>\u003cstrong>C4 · Длинные списки\u003c/strong> — подтвердить: лимит 6 по умолчанию с настройкой у продукта; Show all, только если скрыто 2 варианта или больше; названия Show all (N) / Show less; выбранные варианты поднимаются наверх при открытии дровера.\u003c/li>\n\u003cli>\u003cstrong>A3, B4, C3 · Быстрые фильтры\u003c/strong> — подтвердить предложения: быстрый фильтр дублируется в дровере; чипы применённых фильтров стоят в порядке секций дровера; ориентир «до 5 фильтров — только быстрые» и «не больше 4 быстрых вместе с All Filters».\u003c/li>\n\u003cli>\u003cstrong>B2 · Счётчик на All Filters\u003c/strong> — нужен ли бейдж с числом применённых фильтров (особенно в конфигурации B, где чипы могут уйти на вторую строку)? Если да — считать ли в нём быстрые фильтры.\u003c/li>\n\u003cli>\u003cstrong>B3 · Формат дат в чипе\u003c/strong> — в storybook \u003ccode>MM/DD/YYYY\u003c/code>, в макетах \u003ccode>DD/MM/YY\u003c/code>. Выбрать один (визуал, не блокирует).\u003c/li>\n\u003cli>\u003cstrong>E3 · Select с кнопкой Apply\u003c/strong> (IMG_2512) — оставляем как отдельный вариант (например, для вариантов с подзаголовками) или убираем, чтобы Select всегда применялся по клику?\u003c/li>\n\u003cli>\u003cstrong>E6 · Date range picker\u003c/strong> — подтвердить: если вторая дата раньше первой, даты меняются местами; двойной клик по одной дате — диапазон в один день.\u003c/li>\n\u003c/ol>\n"}]},"en":{"md":"# Filters — Behavior Guidelines\n\nStatus: draft v0.2 · 21.10.2026\nScreenshots of the current implementation and mockups: `screens/filters/` (IMG_2336–2355)\nRussian version: `Caldera-filters-guidelines.md`\n\n> This document defines how filters **behave**. We are not changing the visuals for now: a UI change would make products look inconsistent until every product has updated the library. Anything marked \"visual\" below is design debt for later.\n\n---\n\n## Guide structure\n\nThe guide is split into blocks. Each block answers one question and relies only on the blocks above it, so they can be written and agreed on one at a time.\n\n```\nA. Foundations ───────► what a filter is and where it lives\n   ├─ B. Page chips ────► how a filter looks and opens on the page\n   └─ C. Drawer ────────► how a filter looks and opens in the drawer\n          └─ D. Applying ─► what happens to the value (same in B and C)\n                 └─ E. Types ─► what is specific to each control\n                        └─ F. Page ─► how filters live together with the table\nG. Accessibility — cross-cutting block, collects keyboard rules from all blocks\n```\n\n✅ done · ⚠️ partial · ⏳ not started\n\n### Block A. Foundations\n*Question: what are filters made of, and how is their state organized? The terms and the model defined here are used in every other block.*\n\n| # | Section | Status |\n|---|---|---|\n| A1 | Terms and the \"draft / applied value\" model | ✅ |\n| A2 | Anatomy: filter bar on the page, All Filters drawer | ⏳ |\n| A3 | Filter bar configurations: quick filters only / All Filters only / both | ✅ proposal |\n\n### Block B. Page chips\n*Question: how does a filter look on the page, and how does its dropdown open? Relies on A.*\n\n| # | Section | Status |\n|---|---|---|\n| B1 | Chip types: quick filter and applied-filter chip | ✅ proposal |\n| B2 | Chip states: default, hover, open, with value, with counter, loading | ⏳ |\n| B3 | Value in the chip: date and range formats, multiselect counter, truncating long values | ⏳ |\n| B4 | Chip order and wrapping to a second line | ✅ proposal |\n| B5 | Opening and closing the chip dropdown | ✅ |\n\n### Block C. All Filters drawer\n*Question: how does a filter look and behave in the drawer, and how is the drawer connected to the chips? Relies on A and B.*\n\n| # | Section | Status |\n|---|---|---|\n| C1 | Opening and closing | ✅ |\n| C2 | Structure: header, body, footer | ✅ |\n| C3 | Sections: expanded and collapsed state, Expand / Collapse all | ✅ |\n| C4 | Long lists: Show all / Show less, search, loading | ✅ proposal |\n| C5 | Footer buttons: Apply and reset (Clear all / Reset to default) | ✅ proposal |\n| C6 | Syncing with the page chips | ✅ proposal |\n| C7 | Not yet covered | ⏳ |\n\n### Block D. Applying, validation, clearing\n*Question: what happens to the value — when it is applied, when it isn't, and how it is reset? The rules are the same for the chip dropdown (B) and the drawer (C).*\n\n| # | Section | Status |\n|---|---|---|\n| D1 | Apply button | ✅ |\n| D2 | Validation | ✅ |\n| D3 | Clearing: × on a chip, Clear in a section, Clear all on the page and in the drawer | ⚠️ |\n| D4 | Default values and Reset to default | ⏳ |\n\n### Block E. Filter types\n*Question: what does a specific control add to the general rules? Only differences from A–D go here; general rules are not repeated.*\n\n| # | Section | Status |\n|---|---|---|\n| — | Common to all types and summary table | ✅ |\n| E1 | Text input (Text, Numeric) | ✅ |\n| E2 | Amount range | ✅ |\n| E3 | Select | ✅ (question about the Apply variant) |\n| E4 | Multiselect | ✅ |\n| E5 | Date picker | ✅ |\n| E6 | Date range picker — one field | ✅ |\n| E7 | Switch (formerly Boolean) | ✅ |\n| — | Errors in the current mockups | ✅ |\n\n### Block F. Filters and the page\n*Question: how do filters live together with the page — what happens to them when switching tabs or reloading, and what does the result look like? Relies on everything above.*\n\n| # | Section | Status |\n|---|---|---|\n| F1 | Persisting filters: switching tabs, navigating between pages, reload, URL | ⏳ |\n| F2 | Filtering result: empty table, loading, request error | ⏳ |\n\n### Block G. Keyboard and accessibility\n*Cross-cutting block: collects in one place the focus and key rules that are currently spread across B–E.*\n\n| # | Section | Status |\n|---|---|---|\n| G1 | Focus order, keys, screen readers | ⚠️ (inside B5, D1, D2) |\n\n### Open questions — at the end of the document\n\n---\n\n# Block A. Foundations\n\n## A1. Terms and the core model\n\n- **Chip** — a filter in the bar above the table. Opens a dropdown with a control and an Apply button. There are two kinds (details in B1):\n  - **Quick filter** — a chip that is **always** on the page, whether or not it has a value. The set of quick filters is defined by the product.\n  - **Applied-filter chip** — appears on the page only when a filter from the drawer has been applied, and disappears when it is cleared.\n- **Drawer (All Filters)** — a side panel with all of the page's filters and shared Clear all / Apply buttons.\n- **Applied value** — the value that was sent in the request and that the table is currently filtered by.\n- **Draft** — what the user has typed or selected but not yet applied.\n\n**The core rule everything else is built on:**\n\n1. Until the user clicks Apply, they are editing a **draft**. The table and the chips show **applied** values only.\n2. Apply turns the draft into the applied value (if the draft is valid).\n3. Closing without Apply (click outside, Esc, the drawer's close button) **discards the draft**. Next time it opens, the user sees the applied value.\n4. The chip and the drawer are two entry points to **the same filter state**. A value applied in a chip is immediately visible in the drawer, and vice versa. Apply, validation and clearing rules are the same in both places.\n\n> In the current mockups (IMG_2345), the chip shows the draft value \"Label from 10 to\" while the input is invalid. Under the rule above, the chip should show the last applied value.\n\n## A2. Anatomy\n\n⏳ Not started.\n\n## A3. Filter bar configurations\n\n| Configuration | When to use | What is on the page |\n|---|---|---|\n|
