irements go to the Hint, not the tooltip\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Slider / Range\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stepper (numeric +/−)\u003c/strong>\u003c/td>\n\u003ctd>After the label text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Checkbox group\u003c/strong>\u003c/td>\n\u003ctd>After the group title (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Radio button group\u003c/strong>\u003c/td>\n\u003ctd>After the group title (legend)\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Single Checkbox\u003c/strong>\u003c/td>\n\u003ctd>After the checkbox text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t toggle the checkbox\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Single Radio option\u003c/strong>\u003c/td>\n\u003ctd>After the option text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t select the option\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Switch / Toggle\u003c/strong>\u003c/td>\n\u003ctd>After the switch label text\u003c/td>\n\u003ctd>If the label is left of the switch — trigger sits between the text and the switch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Segmented control\u003c/strong>\u003c/td>\n\u003ctd>After the control title\u003c/td>\n\u003ctd>Not inside segments\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Form section / Fieldset\u003c/strong>\u003c/td>\n\u003ctd>After the section title\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.2 Data display\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Component\u003c/th>\n\u003cth>Trigger position\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Table column header\u003c/strong>\u003c/td>\n\u003ctd>After the header text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t sort\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Key-value / Description list\u003c/strong>\u003c/td>\n\u003ctd>After the key (parameter name)\u003c/td>\n\u003ctd>Not after the value\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Card, section title, page block title\u003c/strong>\u003c/td>\n\u003ctd>After the title text\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Accordion / expandable section\u003c/strong>\u003c/td>\n\u003ctd>After the title text\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t expand or collapse the section\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>KPI / Stat tile\u003c/strong>\u003c/td>\n\u003ctd>After the metric caption\u003c/td>\n\u003ctd>Typical case: how the metric is calculated\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Chart\u003c/strong>\u003c/td>\n\u003ctd>After the chart title or legend item\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Filter sections in the All Filters drawer\u003c/strong>\u003c/td>\n\u003ctd>After the filter name\u003c/td>\n\u003ctd>Clicking the trigger doesn&#39;t collapse the section\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Stepper / Wizard steps\u003c/strong>\u003c/td>\n\u003ctd>After the step name\u003c/td>\n\u003ctd>Only when the step needs explanation\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>3.3 Where the trigger is not placed\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Inside a button, link, chip, tag, menu item, tab\u003c/strong> — a nested interactive element breaks clicking and accessibility. Use a tooltip on the element itself.\u003c/li>\n\u003cli>\u003cstrong>Inside an input\u003c/strong> (suffix area) — reserved for field icons: clear, show password, calendar, chevron.\u003c/li>\n\u003cli>\u003cstrong>In modal and drawer titles\u003c/strong> — if the window needs an explanation, put it in the window body.\u003c/li>\n\u003cli>\u003cstrong>In table value cells\u003c/strong> — a repeating icon in every row clutters the table. Explain in the column header or with a tooltip on the value itself.\u003c/li>\n\u003c/ul>\n"},{"md":"## 4. Anatomy of a label with a trigger\n\n```\n[ Label text ][ * ][ 4px ][ (i) ]\n```\n\n- **Order:** label text → required marker `*` (or \"(optional)\") → trigger. The trigger is always the last element of the label.\n- **Gap** between the last label element and the trigger: **4 px** *(proposal)*.\n- **Don't push the trigger to the right edge** of the field (justify-between): the link between icon and text is lost, and on wide fields it drifts away.\n\n### Icon size *(proposal)*\n\n| Label text size | Icon | Hit area |\n|---|---|---|\n| 12 px (S) | 14 px | at least 24 × 24 px |\n| 14 px (M) | 16 px | at least 24 × 24 px |\n| 16 px and up (titles) | 16–20 px | at least 24 × 24 px |\n\nThe hit area is extended with invisible padding and **doesn't affect layout**: the label row height doesn't change because of the trigger.\n\n### Vertical alignment\nThe icon is centered on the **line height of the text line** it sits on, not on the height of the whole label block.\n\n### Icon states\n\n| State | Look |\n|---|---|\n| Default | Secondary icon color (neutral / secondary) |\n| Hover | Darker / primary color, `pointer` cursor (`help` is acceptable in hover mode) |\n| Active (tooltip open in click mode) | Same color as hover, kept while the tooltip is open |\n| Focus | Standard library focus ring |\n| Disabled field | **The trigger stays active**, see 6.4 |\n\nThe icon color doesn't change when the field has an error — it doesn't turn red.","html":"\u003ch2>4. Anatomy of a label with a trigger\u003c/h2>\n\u003cpre>\u003ccode>[ Label text ][ * ][ 4px ][ (i) ]\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Order:\u003c/strong> label text → required marker \u003ccode>*\u003c/code> (or &quot;(optional)&quot;) → trigger. The trigger is always the last element of the label.\u003c/li>\n\u003cli>\u003cstrong>Gap\u003c/strong> between the last label element and the trigger: \u003cstrong>4 px\u003c/strong> \u003cem>(proposal)\u003c/em>.\u003c/li>\n\u003cli>\u003cstrong>Don&#39;t push the trigger to the right edge\u003c/strong> of the field (justify-between): the link between icon and text is lost, and on wide fields it drifts away.\u003c/li>\n\u003c/ul>\n\u003ch3>Icon size \u003cem>(proposal)\u003c/em>\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Label text size\u003c/th>\n\u003cth>Icon\u003c/th>\n\u003cth>Hit area\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>12 px (S)\u003c/td>\n\u003ctd>14 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14 px (M)\u003c/td>\n\u003ctd>16 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>16 px and up (titles)\u003c/td>\n\u003ctd>16–20 px\u003c/td>\n\u003ctd>at least 24 × 24 px\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The hit area is extended with invisible padding and \u003cstrong>doesn&#39;t affect layout\u003c/strong>: the label row height doesn&#39;t change because of the trigger.\u003c/p>\n\u003ch3>Vertical alignment\u003c/h3>\n\u003cp>The icon is centered on the \u003cstrong>line height of the text line\u003c/strong> it sits on, not on the height of the whole label block.\u003c/p>\n\u003ch3>Icon states\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>State\u003c/th>\n\u003cth>Look\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Default\u003c/td>\n\u003ctd>Secondary icon color (neutral / secondary)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hover\u003c/td>\n\u003ctd>Darker / primary color, \u003ccode>pointer\u003c/code> cursor (\u003ccode>help\u003c/code> is acceptable in hover mode)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Active (tooltip open in click mode)\u003c/td>\n\u003ctd>Same color as hover, kept while the tooltip is open\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Focus\u003c/td>\n\u003ctd>Standard library focus ring\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Disabled field\u003c/td>\n\u003ctd>\u003cstrong>The trigger stays active\u003c/strong>, see 6.4\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The icon color doesn&#39;t change when the field has an error — it doesn&#39;t turn red.\u003c/p>\n"},{"md":"## 5. Tooltip position relative to the trigger\n\nBase rules (width, arrow opposite the first line of text, 4 directions) are on the Tooltip page. For the built-in trigger we add:\n\n- **Default direction:** to the right of the trigger (arrow on the left, opposite the first line of text), as in the \"Phone number\" field example.\n- **If there's no room**, the tooltip flips in this order: **right → top → bottom → left**. It never goes off-screen and is never clipped by its container.\n- **In tables and narrow columns** the default is **top** or **bottom**, so neighboring columns aren't covered.\n- The tooltip is rendered **above everything** (portal), so table, card, modal or drawer overflow doesn't clip it.\n- The tooltip may cover the field itself: it's temporary and closes as soon as the user starts typing.\n- **On scroll** the tooltip moves with the trigger. If the trigger leaves the viewport, the tooltip closes.","html":"\u003ch2>5. Tooltip position relative to the trigger\u003c/h2>\n\u003cp>Base rules (width, arrow opposite the first line of text, 4 directions) are on the Tooltip page. For the built-in trigger we add:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Default direction:\u003c/strong> to the right of the trigger (arrow on the left, opposite the first line of text), as in the &quot;Phone number&quot; field example.\u003c/li>\n\u003cli>\u003cstrong>If there&#39;s no room\u003c/strong>, the tooltip flips in this order: \u003cstrong>right → top → bottom → left\u003c/strong>. It never goes off-screen and is never clipped by its container.\u003c/li>\n\u003cli>\u003cstrong>In tables and narrow columns\u003c/strong> the default is \u003cstrong>top\u003c/strong> or \u003cstrong>bottom\u003c/strong>, so neighboring columns aren&#39;t covered.\u003c/li>\n\u003cli>The tooltip is rendered \u003cstrong>above everything\u003c/strong> (portal), so table, card, modal or drawer overflow doesn&#39;t clip it.\u003c/li>\n\u003cli>The tooltip may cover the field itself: it&#39;s temporary and closes as soon as the user starts typing.\u003c/li>\n\u003cli>\u003cstrong>On scroll\u003c/strong> the tooltip moves with the trigger. If the trigger leaves the viewport, the tooltip closes.\u003c/li>\n\u003c/ul>\n"},{"md":"## 6. Edge cases\n\n### 6.1 Long label wraps onto several lines\n- The trigger sits **at the end of the last line**, right after the last word (and the `*` marker).\n- The trigger is **glued to the last word**: the last word, `*` and icon never break apart. The icon never ends up alone on a new line.\n- The icon is centered on the line it sits on.\n\n```\nTax authority division code\nat the place of registration * (i)\n```\n\n✗ Wrong:\n```\nTax authority division code at the place of registration *\n(i)\n```\n\n### 6.2 Label truncated to one line (tables, compact forms)\n- The text is truncated with an ellipsis; **the `*` marker and the trigger are always visible**: `Tax authority divis… * (i)`.\n- The full label text is shown in the trigger tooltip's **header** (Header from the Tooltip anatomy), with the explanation below. This way the user never gets two tooltips (overflow + info) on one label.\n- Constant truncation is a signal to shorten the label.\n\n### 6.3 Label to the left of the field (horizontal form)\n- The trigger follows the label text inside the label column. Wrapping follows rule 6.1.\n- If labels are right-aligned in their column, the trigger still follows the text, and the whole \"text + `*` + trigger\" group is right-aligned.\n\n### 6.4 Disabled or read-only field\n- The trigger **stays active**: it opens and receives focus. Users especially need to understand why a field is unavailable or where its value comes from.\n- If a field is disabled and the reason needs explaining, this trigger is the right place for it.\n\n### 6.5 Field in error state\n- The trigger stays in place, its color doesn't change.\n- The error text goes below the field, not into the tooltip. The tooltip doesn't open automatically on error.\n\n### 6.6 Field without a visible label\n- Don't add a trigger. Explain in a Hint or in the section / column title.\n\n### 6.7 Checkbox or radio with a trigger on an option\n- The trigger is **outside the clickable area** of the option label: clicking it opens the tooltip and **doesn't toggle** the value.\n- Same for a column header (sorting), accordion (expanding), filter section.\n\n### 6.8 Long tooltip text\n- **Hover** mode: up to ~200 characters / 3–4 lines at the recommended width *(proposal)*.\n- Longer text, a header, a link or an action — **click** mode.\n- More than one or two paragraphs — not a tooltip: a \"Learn more\" link or a drawer.\n\n### 6.9 Several tooltips nearby\n- **Only one** tooltip is open at a time. Opening a new one closes the previous one (in both modes).\n\n### 6.10 Loading\n- While the label is a skeleton, the trigger is hidden — it appears together with the text.\n\n### 6.11 Touch devices\n- There's no hover, so a hover-mode tooltip opens on **tap** on the trigger and closes on tap outside.","html":"\u003ch2>6. Edge cases\u003c/h2>\n\u003ch3>6.1 Long label wraps onto several lines\u003c/h3>\n\u003cul>\n\u003cli>The trigger sits \u003cstrong>at the end of the last line\u003c/strong>, right after the last word (and the \u003ccode>*\u003c/code> marker).\u003c/li>\n\u003cli>The trigger is \u003cstrong>glued to the last word\u003c/strong>: the last word, \u003ccode>*\u003c/code> and icon never break apart. The icon never ends up alone on a new line.\u003c/li>\n\u003cli>The icon is centered on the line it sits on.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode>Tax authority division code\nat the place of registration * (i)\n\u003c/code>\u003c/pre>\n\u003cp>✗ Wrong:\u003c/p>\n\u003cpre>\u003ccode>Tax authority division code at the place of registration *\n(i)\n\u003c/code>\u003c/pre>\n\u003ch3>6.2 Label truncated to one line (tables, compact forms)\u003c/h3>\n\u003cul>\n\u003cli>The text is truncated with an ellipsis; \u003cstrong>the \u003ccode>*\u003c/code> marker and the trigger are always visible\u003c/strong>: \u003ccode>Tax authority divis… * (i)\u003c/code>.\u003c/li>\n\u003cli>The full label text is shown in the trigger tooltip&#39;s \u003cstrong>header\u003c/strong> (Header from the Tooltip anatomy), with the explanation below. This way the user never gets two tooltips (overflow + info) on one label.\u003c/li>\n\u003cli>Constant truncation is a signal to shorten the label.\u003c/li>\n\u003c/ul>\n\u003ch3>6.3 Label to the left of the field (horizontal form)\u003c/h3>\n\u003cul>\n\u003cli>The trigger follows the label text inside the label column. Wrapping follows rule 6.1.\u003c/li>\n\u003cli>If labels are right-aligned in their column, the trigger still follows the text, and the whole &quot;text + \u003ccode>*\u003c/code> + trigger&quot; group is right-aligned.\u003c/li>\n\u003c/ul>\n\u003ch3>6.4 Disabled or read-only field\u003c/h3>\n\u003cul>\n\u003cli>The trigger \u003cstrong>stays active\u003c/strong>: it opens and receives focus. Users especially need to understand why a field is unavailable or where its value comes from.\u003c/li>\n\u003cli>If a field is disabled and the reason needs explaining, this trigger is the right place for it.\u003c/li>\n\u003c/ul>\n\u003ch3>6.5 Field in error state\u003c/h3>\n\u003cul>\n\u003cli>The trigger stays in place, its color doesn&#39;t change.\u003c/li>\n\u003cli>The error text goes below the field, not into the tooltip. The tooltip doesn&#39;t open automatically on error.\u003c/li>\n\u003c/ul>\n\u003ch3>6.6 Field without a visible label\u003c/h3>\n\u003cul>\n\u003cli>Don&#39;t add a trigger. Explain in a Hint or in the section / column title.\u003c/li>\n\u003c/ul>\n\u003ch3>6.7 Checkbox or radio with a trigger on an option\u003c/h3>\n\u003cul>\n\u003cli>The trigger is \u003cstrong>outside the clickable area\u003c/strong> of the option label: clicking it opens the tooltip and \u003cstrong>doesn&#39;t toggle\u003c/strong> the value.\u003c/li>\n\u003cli>Same for a column header (sorting), accordion (expanding), filter section.\u003c/li>\n\u003c/ul>\n\u003ch3>6.8 Long tooltip text\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Hover\u003c/strong> mode: up to ~200 characters / 3–4 lines at the recommended width \u003cem>(proposal)\u003c/em>.\u003c/li>\n\u003cli>Longer text, a header, a link or an action — \u003cstrong>click\u003c/strong> mode.\u003c/li>\n\u003cli>More than one or two paragraphs — not a tooltip: a &quot;Learn more&quot; link or a drawer.\u003c/li>\n\u003c/ul>\n\u003ch3>6.9 Several tooltips nearby\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Only one\u003c/strong> tooltip is open at a time. Opening a new one closes the previous one (in both modes).\u003c/li>\n\u003c/ul>\n\u003ch3>6.10 Loading\u003c/h3>\n\u003cul>\n\u003cli>While the label is a skeleton, the trigger is hidden — it appears together with the text.\u003c/li>\n\u003c/ul>\n\u003ch3>6.11 Touch devices\u003c/h3>\n\u003cul>\n\u003cli>There&#39;s no hover, so a hover-mode tooltip opens on \u003cstrong>tap\u003c/strong> on the trigger and closes on tap outside.\u003c/li>\n\u003c/ul>\n"},{"md":"## 7. Behavior: hover and click\n\nThe mode is set per trigger instance. **Use one mode within a form or table** — users shouldn't have to guess where to hover and where to click.\n\n| | **Hover** (default) | **Click** |\n|---|---|---|\n| When to choose | Short text, no links or actions | Long text, header, link, instruction (\"?\"), text needs to be read while filling in |\n| Opening with a mouse | Hover over the trigger, ~300 ms delay *(proposal)* | Click on the trigger |\n| Opening with a keyboard | Focus on the trigger (Tab) | Enter / Space on the trigger |\n| Closing | Pointer leaves trigger and tooltip, ~150 ms delay *(proposal)*; focus lost; Esc | Close button; click outside; Esc; clicking the trigger again |\n| Close button | No | Yes |\n| Pointer on the tooltip | The tooltip stays open while the pointer is on it (text can be selected and copied) | — |\n| Links and buttons inside | Not allowed | Allowed |\n| Blocks the page | No | No (non-modal) |\n\n### General rules\n- Clicking the trigger **doesn't move focus into the field** and doesn't submit the form (`type=\"button\"`, trigger outside the field's `\u003clabel>` or with default action prevented).\n- After closing with Esc, focus stays on (or returns to) the trigger.\n- In click mode, if there's a link inside, Tab moves focus into the tooltip; after the last element — to the next element on the page.","html":"\u003ch2>7. Behavior: hover and click\u003c/h2>\n\u003cp>The mode is set per trigger instance. \u003cstrong>Use one mode within a form or table\u003c/strong> — users shouldn&#39;t have to guess where to hover and where to click.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003cstrong>Hover\u003c/strong> (default)\u003c/th>\n\u003cth>\u003cstrong>Click\u003c/strong>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>When to choose\u003c/td>\n\u003ctd>Short text, no links or actions\u003c/td>\n\u003ctd>Long text, header, link, instruction (&quot;?&quot;), text needs to be read while filling in\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Opening with a mouse\u003c/td>\n\u003ctd>Hover over the trigger, ~300 ms delay \u003cem>(proposal)\u003c/em>\u003c/td>\n\u003ctd>Click on the trigger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Opening with a keyboard\u003c/td>\n\u003ctd>Focus on the trigger (Tab)\u003c/td>\n\u003ctd>Enter / Space on the trigger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Closing\u003c/td>\n\u003ctd>Pointer leaves trigger and tooltip, ~150 ms delay \u003cem>(proposal)\u003c/em>; focus lost; Esc\u003c/td>\n\u003ctd>Close button; click outside; Esc; clicking the trigger again\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Close button\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>Yes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pointer on the tooltip\u003c/td>\n\u003ctd>The tooltip stays open while the pointer is on it (text can be selected and copied)\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Links and buttons inside\u003c/td>\n\u003ctd>Not allowed\u003c/td>\n\u003ctd>Allowed\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Blocks the page\u003c/td>\n\u003ctd>No\u003c/td>\n\u003ctd>No (non-modal)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>General rules\u003c/h3>\n\u003cul>\n\u003cli>Clicking the trigger \u003cstrong>doesn&#39;t move focus into the field\u003c/strong> and doesn&#39;t submit the form (\u003ccode>type=&quot;button&quot;\u003c/code>, trigger outside the field&#39;s \u003ccode>&lt;label&gt;\u003c/code> or with default action prevented).\u003c/li>\n\u003cli>After closing with Esc, focus stays on (or returns to) the trigger.\u003c/li>\n\u003cli>In click mode, if there&#39;s a link inside, Tab moves focus into the tooltip; after the last element — to the next element on the page.\u003c/li>\n\u003c/ul>\n"},{"md":"## 8. Accessibility\n\n- The trigger is a `\u003cbutton type=\"button\">`, not an icon with a click handler.\n- The trigger has an accessible name: `aria-label=\"More info: \u003clabel text>\"`, not just \"Info\".\n- Hover mode: the tooltip has `role=\"tooltip\"` and is linked to the trigger via `aria-describedby`.\n- Click mode: the tooltip is linked to the trigger via `aria-expanded` + `aria-controls`.\n- Icon contrast against the background in the default state is at least 3:1.\n- Hit area is at least 24 × 24 px.\n- The tooltip opens and closes with the keyboard, not only with a mouse.","html":"\u003ch2>8. Accessibility\u003c/h2>\n\u003cul>\n\u003cli>The trigger is a \u003ccode>&lt;button type=&quot;button&quot;&gt;\u003c/code>, not an icon with a click handler.\u003c/li>\n\u003cli>The trigger has an accessible name: \u003ccode>aria-label=&quot;More info: &lt;label text&gt;&quot;\u003c/code>, not just &quot;Info&quot;.\u003c/li>\n\u003cli>Hover mode: the tooltip has \u003ccode>role=&quot;tooltip&quot;\u003c/code> and is linked to the trigger via \u003ccode>aria-describedby\u003c/code>.\u003c/li>\n\u003cli>Click mode: the tooltip is linked to the trigger via \u003ccode>aria-expanded\u003c/code> + \u003ccode>aria-controls\u003c/code>.\u003c/li>\n\u003cli>Icon contrast against the background in the default state is at least 3:1.\u003c/li>\n\u003cli>Hit area is at least 24 × 24 px.\u003c/li>\n\u003cli>The tooltip opens and closes with the keyboard, not only with a mouse.\u003c/li>\n\u003c/ul>\n"},{"md":"## 9. Tooltip text\n\n- 1–3 short sentences. Sentence case, ending with a period.\n- Doesn't repeat the label: not \"Tax ID is the company's tax ID\", but what it is and where to find it.\n- No critical information: anything required to fill the field goes to the Hint.\n- \"i\" answers \"what is this / how does it work\", \"?\" answers \"what should I do / where do I get it\".","html":"\u003ch2>9. Tooltip text\u003c/h2>\n\u003cul>\n\u003cli>1–3 short sentences. Sentence case, ending with a period.\u003c/li>\n\u003cli>Doesn&#39;t repeat the label: not &quot;Tax ID is the company&#39;s tax ID&quot;, but what it is and where to find it.\u003c/li>\n\u003cli>No critical information: anything required to fill the field goes to the Hint.\u003c/li>\n\u003cli>&quot;i&quot; answers &quot;what is this / how does it work&quot;, &quot;?&quot; answers &quot;what should I do / where do I get it&quot;.\u003c/li>\n\u003c/ul>\n"},{"md":"## 10. Component properties\n\n### In Pixso (on every base component from section 3)\n\n| Property | Values |\n|---|---|\n| `Tooltip trigger` | boolean, default false |\n| `Trigger icon` | `i` / `?` |\n\nThe tooltip itself isn't baked into the component — on mockups it's shown as a separate Tooltip component instance next to the trigger.\n\n### For development (reference)\n\n| Property | Values | Default |\n|---|---|---|\n| `tooltip.content` | text / node | — |\n| `tooltip.header` | text | — |\n| `tooltip.icon` | `info` / `help` | `info` |\n| `tooltip.trigger` | `hover` / `click` | `hover` |\n| `tooltip.placement` | `right` / `top` / `bottom` / `left` | `right` (`top` in tables) |\n| `tooltip.theme` | `dark` / `light` | see question 3 below |","html":"\u003ch2>10. Component properties\u003c/h2>\n\u003ch3>In Pixso (on every base component from section 3)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Property\u003c/th>\n\u003cth>Values\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Tooltip trigger\u003c/code>\u003c/td>\n\u003ctd>boolean, default false\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Trigger icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>i\u003c/code> / \u003ccode>?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The tooltip itself isn&#39;t baked into the component — on mockups it&#39;s shown as a separate Tooltip component instance next to the trigger.\u003c/p>\n\u003ch3>For development (reference)\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Property\u003c/th>\n\u003cth>Values\u003c/th>\n\u003cth>Default\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>tooltip.content\u003c/code>\u003c/td>\n\u003ctd>text / node\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.header\u003c/code>\u003c/td>\n\u003ctd>text\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.icon\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code> / \u003ccode>help\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.trigger\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code> / \u003ccode>click\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>hover\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.placement\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> / \u003ccode>top\u003c/code> / \u003ccode>bottom\u003c/code> / \u003ccode>left\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>right\u003c/code> (\u003ccode>top\u003c/code> in tables)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tooltip.theme\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>dark\u003c/code> / \u003ccode>light\u003c/code>\u003c/td>\n\u003ctd>see question 3 below\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"md":"## 11. Do / Don't checklist\n\n✅ Trigger right after the label text and the `*` marker\n✅ Trigger glued to the last word when wrapping\n✅ Trigger and `*` always visible when the label is truncated\n✅ Trigger active on a disabled field\n✅ One mode (hover or click) within a form\n✅ Clicking the trigger doesn't toggle or sort anything\n\n❌ Trigger inside a field, button, chip, tab\n❌ Trigger pushed to the right edge of the field\n❌ Validation errors in the tooltip\n❌ Information everyone needs hidden in a tooltip\n❌ Icon alone on a new line\n❌ Two tooltips on one label (overflow + info)","html":"\u003ch2>11. Do / Don&#39;t checklist\u003c/h2>\n\u003cp>✅ Trigger right after the label text and the \u003ccode>*\u003c/code> marker\n✅ Trigger glued to the last word when wrapping\n✅ Trigger and \u003ccode>*\u003c/code> always visible when the label is truncated\n✅ Trigger active on a disabled field\n✅ One mode (hover or click) within a form\n✅ Clicking the trigger doesn&#39;t toggle or sort anything\u003c/p>\n\u003cp>❌ Trigger inside a field, button, chip, tab\n❌ Trigger pushed to the right edge of the field\n❌ Validation errors in the tooltip\n❌ Information everyone needs hidden in a tooltip\n❌ Icon alone on a new line\n❌ Two tooltips on one label (overflow + info)\u003c/p>\n"},{"md":"## 12. Open questions for the team\n\n1. **Max tooltip width:** the English Tooltip page shows `max-width: 320px` in the example but says 500 px in the text; the Russian page says 250 px recommended, 500 px max. We need one value.\n2. **Hover delays:** 300 ms to open, 150 ms to close — agree with developers.\n3. **Default theme** for the built-in trigger: dark or light tooltip?\n4. **Cursor in hover mode:** `pointer` or `help`?\n5. **Text length limit** for hover mode: is ~200 characters OK?","html":"\u003ch2>12. Open questions for the team\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Max tooltip width:\u003c/strong> the English Tooltip page shows \u003ccode>max-width: 320px\u003c/code> in the example but says 500 px in the text; the Russian page says 250 px recommended, 500 px max. We need one value.\u003c/li>\n\u003cli>\u003cstrong>Hover delays:\u003c/strong> 300 ms to open, 150 ms to close — agree with developers.\u003c/li>\n\u003cli>\u003cstrong>Default theme\u003c/strong> for the built-in trigger: dark or light tooltip?\u003c/li>\n\u003cli>\u003cstrong>Cursor in hover mode:\u003c/strong> \u003ccode>pointer\u003c/code> or \u003ccode>help\u003c/code>?\u003c/li>\n\u003cli>\u003cstrong>Text length limit\u003c/strong> for hover mode: is ~200 characters OK?\u003c/li>\n\u003c/ol>\n"}]}}},{"id":"filters","title":{"ru":"Фильтры","en":"Filters"},"docs":{"ru":{"md":"# Фильтры — гайдлайны поведения\n\nСтатус: черновик v0.2 · 21.10.2026\nСкрины текущей реализации и макетов: `screens/filters/` (IMG_2336–2355)\nАнглийская версия: `Caldera-filters-guidelines-en.md`\n\n> Цель документа — зафиксировать **поведение** фильтров. Визуал сейчас не меняем: правка UI разведёт интерфейс продуктов, пока не все обновили библиотеку. Всё, что ниже помечено «визуал», — долг на будущее.\n\n---\n\n## Структура гайда\n\nГайд разбит на блоки. Каждый блок отвечает на один вопрос и опирается только на блоки выше, поэтому их можно описывать и согласовывать по очереди.\n\n```\nA. Основа ─────────────► что такое фильтр и где он живёт\n   ├─ B. Чипы на странице ─► как фильтр выглядит и открывается на странице\n   └─ C. Дровер ───────────► как фильтр выглядит и открывается в дровере\n          └─ D. Применение ─► что происходит со значением (одинаково в B и C)\n                 └─ E. Типы ─► что особенного у конкретного контрола\n                        └─ F. Страница ─► как фильтры живут вместе с таблицей\nG. Доступность — сквозной блок, собирает правила клавиатуры из всех блоков\n```\n\n✅ описано · ⚠️ частично · ⏳ не начато\n\n### Блок A. Основа\n*Вопрос: из чего состоят фильтры и как устроено их состояние? Термины и модель отсюда используются во всех остальных блоках.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| A1 | Термины и модель «черновик / применённое значение» | ✅ |\n| A2 | Анатомия: панель фильтров на странице, дровер All Filters | ⏳ |\n| A3 | Конфигурации панели: только быстрые фильтры / только All Filters / вместе | ✅ предложение |\n\n### Блок B. Чипы на странице\n*Вопрос: как фильтр выглядит на странице и как открывается его дропдаун? Опирается на A.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| B1 | Виды чипов: быстрый фильтр и чип применённого фильтра | ✅ предложение |\n| B2 | Состояния чипа: default, hover, open, со значением, со счётчиком, loading | ⏳ |\n| B3 | Значение в чипе: формат дат и диапазонов, счётчик multiselect, обрезка длинных значений | ⏳ |\n| B4 | Порядок чипов и перенос на вторую строку | ✅ предложение |\n| B5 | Открытие и закрытие дропдауна чипа | ✅ |\n\n### Блок C. Дровер All Filters\n*Вопрос: как фильтр выглядит и ведёт себя в дровере и как дровер связан с чипами? Опирается на A и B.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| C1 | Открытие и закрытие | ✅ |\n| C2 | Структура: шапка, тело, футер | ✅ |\n| C3 | Секции: развёрнутое и свёрнутое состояние, Expand / Collapse all | ✅ |\n| C4 | Длинные списки: Show all / Show less, поиск, загрузка | ✅ предложение |\n| C5 | Кнопки футера: Apply и сброс (Clear all / Reset to default) | ✅ предложение |\n| C6 | Синхронизация с чипами на странице | ✅ предложение |\n| C7 | Что ещё не описано | ⏳ |\n\n### Блок D. Применение, валидация, очистка\n*Вопрос: что происходит со значением — когда оно применяется, когда нет, как сбрасывается? Правила общие для дропдауна чипа (B) и дровера (C).*\n\n| # | Раздел | Статус |\n|---|---|---|\n| D1 | Кнопка Apply | ✅ |\n| D2 | Валидация | ✅ |\n| D3 | Очистка: × на чипе, Clear в секции, Clear all на странице и в дровере | ⚠️ |\n| D4 | Значения по умолчанию и Reset to default | ⏳ |\n\n### Блок E. Типы фильтров\n*Вопрос: что добавляет к общим правилам конкретный контрол? Здесь только отличия от A–D, общие правила не повторяются.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| — | Общее для всех типов и сводная таблица | ✅ |\n| E1 | Text input (Text, Numeric) | ✅ |\n| E2 | Amount range | ✅ |\n| E3 | Select | ✅ (вопрос про вариант с Apply) |\n| E4 | Multiselect | ✅ |\n| E5 | Date picker | ✅ |\n| E6 | Date range picker — одно поле | ✅ |\n| E7 | Switch (бывш. Boolean) | ✅ |\n| — | Ошибки в текущих макетах | ✅ |\n\n### Блок F. Фильтры и страница\n*Вопрос: как фильтры живут вместе со страницей — что с ними при смене таба, перезагрузке и как выглядит результат? Опирается на всё выше.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| F1 | Сохранение фильтров: смена таба, переход между страницами, перезагрузка, URL | ⏳ |\n| F2 | Результат фильтрации: пустая таблица, загрузка, ошибка запроса | ⏳ |\n\n### Блок G. Клавиатура и доступность\n*Сквозной блок: собирает в одном месте правила фокуса и клавиш, разбросанные по B–E.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| G1 | Порядок фокуса, клавиши, скринридеры | ⚠️ (внутри B5, D1, D2) |\n\n### Открытые вопросы — в конце документа\n\n---\n\n# Блок A. Основа\n\n## A1. Термины и базовая модель\n\n- **Чип** — фильтр в панели над таблицей. Открывает дропдаун с контролом и кнопкой Apply. Бывает двух видов (подробно — B1):\n  - **Быстрый фильтр** — чип, который есть на странице **всегда**, независимо от того, выбрано в нём значение или нет. Набор быстрых фильтров задаёт продукт.\n  - **Чип применённого фильтра** — появляется на странице, только когда фильтр из дровера применён, и исчезает, когда его очищают.\n- **Дровер (All Filters)** — боковая панель со всеми фильтрами страницы и общими кнопками Clear all / Apply.\n- **Применённое значение** — то, что ушло в запрос и по чему отфильтрована таблица.\n- **Черновик** — то, что пользователь ввёл/выбрал, но ещё не применил.\n\n**Главное правило, на котором держится всё остальное:**\n\n1. Пока пользователь не нажал Apply, он редактирует **черновик**. Таблица и чипы показывают только **применённые** значения.\n2. Apply превращает черновик в применённое значение (если он валиден).\n3. Закрытие без Apply (клик вне, Esc, крестик дровера) **отбрасывает черновик**. При следующем открытии пользователь видит применённое значение.\n4. Чип и дровер — два входа в **одно и то же состояние фильтров**. Значение, применённое в чипе, сразу видно в дровере, и наоборот. Правила Apply, валидации и очистки одинаковы в обоих местах.\n\n> Сейчас в макетах (IMG_2345) чип показывает черновое значение «Label from 10 to» при невалидном вводе. По правилу выше чип должен показывать последнее применённое значение.\n\n## A2. Анатомия\n\n⏳ Не описано.\n\n## A3. Конфигурации панели фильтров\n\n| Конфигурация | Когда использовать | Что на странице |\n|---|---|---|\n| **A. Только быстрые фильтры** | В продукте мало фильтров (3–5), прятать их в дровер нет смысла | Быстрые фильтры + Clear all. Кнопки All Filters и дровера нет. |\n| **B. Только All Filters** | Фильтров много, и ни один не используется заметно чаще других | All Filters + чипы применённых фильтров + Clear all |\n| **C. All Filters + быстрые фильтры** | Фильтров много, но 2–4 основных нужны пользователю под рукой | All Filters + быстрые фильтры + чипы применённых фильтров + Clear all |\n\nПредлагаю ориентир для выбора: до 5 фильтров — A; больше 5 — B или C. В C быстрых фильтров не больше 4, иначе панель превращается в дровер, разложенный на странице.\n\n---\n\n# Блок B. Чипы на странице\n\n## B1. Виды чипов\n\n| | Быстрый фильтр | Чип применённого фильтра |\n|---|---|---|\n| Виден на странице | Всегда | Только пока фильтр применён |\n| Без значения | Outline-чип с названием и стрелкой: `Label ⌄` | Не существует |\n| Со значением | `Label Value × ⌄` | `Label Value × ⌄` — выглядит так же |\n| Клик по чипу | Дропдаун с контролом и Apply | Дропдаун с контролом и Apply — ведёт себя так же |\n| × на чипе | Очищает значение и применяет. **Чип остаётся** в состоянии без значения | Очищает значение и применяет. **Чип исчезает** |\n| Apply с пустым значением | Фильтр снят, чип остаётся без значения | Фильтр снят, чип исчезает (дропдаун закрывается вместе с ним) |\n| Clear all на странице | Все быстрые фильтры остаются, без значений | Все чипы применённых фильтров исчезают |\n| Есть ли в дровере | Да (в конфигурации C) | Да — это его источник |\n\nВнешне и по поведению внутри дропдауна оба вида одинаковые. Разница только в том, остаётся ли чип на странице после очистки. Правила B5, D1 и D2 действуют для обоих без исключений.\n\n## B2. Состояния чипа\n\n⏳ Не описано.\n\n## B3. Значение в чипе\n\n⏳ Не описано. Уже известно: для диапазона с одной границей — `Label to 10` / `Label from 10` (см. E2).\n\n## B4. Порядок чипов\n\n`All Filters` → быстрые фильтры → чипы применённых фильтров → `Clear all`\n\n- Быстрые фильтры стоят в порядке, который задал продукт, и не двигаются при применении значений. Пользователь запоминает их положение.\n- Чипы применённых фильтров стоят в порядке секций дровера (а не в порядке применения), чтобы панель не «прыгала» при каждом Apply.\n- При переносе на вторую строку порядок сохраняется (IMG_2336).\n\n## B5. Открытие и закрытие дропдауна чипа\n\n**Исправление:** дропдаун открывается **по клику**, а не по ховеру.\n\n| Действие | Результат |\n|---|---|\n| Ховер на чип | Только визуальный hover-state. Дропдаун не открывается. |\n| Клик по чипу | Открывает дропдаун. Фокус переходит в первый контрол (поле ввода / поиск). |\n| Повторный клик по открытому чипу | Закрывает дропдаун, черновик отбрасывается. |\n| Клик по другому чипу | Текущий дропдаун закрывается (черновик отбрасывается), открывается новый. Одновременно открыт максимум один. |\n| Клик вне дропдауна | Закрывает, черновик отбрасывается. |\n| Esc | Закрывает, черновик отбрасывается, фокус возвращается на чип. |\n| Клик по × на чипе | Очищает фильтр и сразу применяет. Дропдаун **не** открывается. |\n| Enter / Space на чипе в фокусе | Открывает дропдаун (как клик). |\n\nПочему не ховер: дропдаун с полем ввода и кнопкой — это форма; по ховеру он открывается случайно при движении мыши к таблице и закрывается, когда курсор «соскальзывает» с пути к кнопке. Плюс ховер недоступен с клавиатуры и тачпада без курсора.\n\n---\n\n# Блок C. Дровер All Filters\n\nДровер — это боковая панель со всеми фильтрами страницы. Внутри дровера пользователь редактирует черновик (A1): таблица не меняется, пока он не нажмёт Apply.\n\n## C1. Открытие и закрытие\n\n### Открытие\n\n- Дровер открывается **только по клику** на кнопку All Filters.\n- Выезжает справа поверх страницы, страница под ним затемняется. Скролл страницы заблокирован, пока дровер открыт.\n- Если на странице был открыт дропдаун чипа, он закрывается, а его черновик отбрасывается.\n- В дровере сразу показаны **применённые** значения всех фильтров.\n- Фокус переходит в дровер (на заголовок или первый контрол). Tab не выходит за пределы дровера, пока он открыт.\n- Каждый раз дровер открывается со скроллом в самом начале.\n\n### Закрытие\n\n| Действие | Что происходит с изменениями | Дровер |\n|---|---|---|\n| Apply, ошибок нет | Применяются все фильтры разом | Закрывается |\n| Apply, есть ошибки | Ничего не применяется (C5) | Остаётся открытым |\n| Clear all / Reset to default | Сброс применяется сразу (C5) | Закрывается |\n| × в шапке | Черновик отбрасывается | Закрывается |\n| Клик по затемнённой странице | Черновик отбрасывается | Закрывается |\n| Esc | Черновик отбрасывается | Закрывается |\n\n- Подтверждения «У вас есть несохранённые изменения» при закрытии **нет**. Настроить фильтры заново дёшево, а лишний диалог раздражает чаще, чем спасает.\n- После закрытия фокус возвращается на кнопку All Filters.\n\n## C2. Структура дровера\n\n```\n┌──────────────────────────────┐\n│ All Filters               ×  │  ← шапка, закреплена\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← секции, скроллятся\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← футер, закреплён\n└──────────────────────────────┘\n```\n\n- **Шапка** закреплена: название «All Filters», кнопка × и ссылка Expand all / Collapse all (C3).\n- **Тело** скроллится. В нём секции фильтров в фиксированном порядке: сначала быстрые фильтры в порядке страницы, потом остальные (C6).\n- **Футер** закреплён и всегда виден: кнопка сброса и Apply (C5).\n- **Заголовки секций** выровнены по левому краю. Длинный заголовок переносится на вторую строку, а не обрезается.\n\n## C3. Секции: развёрнутое и свёрнутое состояние\n\n### Состояние по умолчанию\n\nПродукт выбирает, в каком состоянии секции открываются по умолчанию:\n\n- **все развёрнуты** — когда фильтров немного и важно видеть всё сразу;\n- **все свёрнуты** — когда фильтров много и дровер иначе становится слишком длинным.\n\n### Секция со значением всегда развёрнута\n\nПри открытии дровера секция, **в которой есть значение**, разворачивается, даже если по умолчанию секции свёрнуты. Значение — это применённое значение или значение по умолчанию (D4). Так пользователь сразу видит, что именно сейчас фильтрует таблицу.\n\n### Управление секцией\n\n- У каждой секции (кроме Switch) в заголовке шеврон: `⌄` — развернуть, `^` — свернуть. Клик по заголовку тоже сворачивает и разворачивает секцию.\n- Пользователь может свернуть секцию даже со значением. Тогда в заголовке остаются кнопка Clear и короткая подсказка о значении: `Status · 2`, `Created on · 08/10/2025`. Без неё свёрнутая секция со значением выглядела бы пустой.\n- **Switch** — не аккордеон: одна строка с названием слева и переключателем справа, без шеврона и без Clear.\n- **Clear** стоит в заголовке секции и показывается, только когда у фильтра есть значение (D3).\n\n### Expand all / Collapse all\n\n- Ссылка под заголовком дровера.\n- Если свёрнута хотя бы одна секция, ссылка называется **Expand all** и разворачивает все.\n- Если развёрнуты все секции, ссылка называется **Collapse all** и сворачивает все.\n- Ссылка нужна, когда секций больше 5. Если их меньше, её можно не показывать.\n\n### Что запоминается\n\nРазвёрнутость секций живёт, пока открыт дровер. При следующем открытии состояние снова считается по правилам выше: состояние по умолчанию плюс развёрнутые секции со значениями.\n\n## C4. Длинные списки: Show all и Show less\n\nКасается Select и Multiselect в дровере.\n\n### Сколько вариантов видно сразу\n\n- По умолчанию в развёрнутой секции видно **6 вариантов**. Продукт может задать другое число для конкретного фильтра.\n- **Правило минимального остатка:** кнопку Show all показываем, только если под ней скрыто **2 варианта или больше**. Если скрыт был бы всего один, показываем весь список сразу: кнопка заняла бы столько же места, сколько этот вариант, и ничего не сэкономила бы.\n  - Пример: лимит 6, вариантов 7 → показываем все 7, кнопки нет.\n  - Пример: лимит 6, вариантов 8 → показываем 6 и кнопку `Show all (8)`.\n- Это одно сравнение («вариантов больше, чем лимит + 1?»), сложной логики тут нет. Поэтому правило встроено в компонент, а продукту остаётся только задать лимит.\n\n### Выбранные варианты всегда видны\n\nЕсли выбранный вариант стоит в списке ниже лимита, в свёрнутом списке его не было бы видно. Поэтому при открытии дровера выбранные варианты поднимаются наверх списка, остальные идут за ними в исходном порядке.\n\nПорядок пересчитывается **только при открытии дровера**, а не в момент клика. Иначе вариант «прыгал» бы из-под курсора.\n\n### Названия кнопок\n\n| Свёрнутый список | Развёрнутый список | Комментарий |\n|---|---|---|\n| **Show all (24)** | **Show less** | Рекомендую. Число сразу показывает, сколько всего вариантов. «Show less» честно описывает действие: список сокращается обратно до лимита, а не исчезает. |\n| Show more | Show less | Стандартная пара, но «more» не говорит, раскроется весь список или только часть. |\n| Show 18 more | Show less | Точно, но число меняется в зависимости от лимита, его сложнее локализовать. |\n| ~~Show all~~ | ~~Hide all~~ | Не использовать: «Hide all» читается как «скрыть всё», хотя первые варианты остаются на месте. |\n\n### Что происходит по Show all\n\n- Список раскрывается **прямо в секции**, без вложенного скролла: дровер и так скроллится, а скролл внутри скролла легко «зажевать» колесом мыши.\n- Если вариантов больше **20**, раскрытый список получает максимальную высоту примерно в 10 строк и собственный скролл. Поиск над списком в этом случае остаётся на месте.\n- Кнопка меняется на **Show less** и стоит под последним вариантом.\n\n### Что происходит по Show less\n\n- Список сворачивается обратно до лимита.\n- Если заголовок секции к этому моменту ушёл за верхний край, дровер подскролливается так, чтобы заголовок секции снова был виден. Пользователь не должен терять место, где он был.\n\n### Поиск в списке\n\n- Поле поиска показывается над списком, если вариантов больше 10.\n- Пока в поиске есть текст, показываются **все** совпадения, без лимита и без Show all.\n- Нет совпадений — текст «No results».\n- Очистка поиска (× в поле) возвращает список в прежнее состояние.\n\n### Загрузка и ошибки\n\n- Пока варианты загружаются, вместо них скелетоны (как в дропдауне чипа, IMG_2508).\n- Ошибка загрузки — текст ошибки и ссылка Retry внутри секции. Остальные секции работают как обычно.\n\n## C5. Кнопки футера\n\n### Apply\n\n**Apply всегда активна** (D1) — независимо от того, менял ли пользователь что-то.\n\nПо клику:\n\n1. Проверяются **все** поля дровера, в том числе в свёрнутых секциях.\n2. Ошибок нет → все фильтры применяются разом, дровер закрывается, таблица обновляется.\n3. Есть ошибки:\n   - ничего не применяется, дровер не закрывается;\n   - свёрнутые секции с ошибками разворачиваются;\n   - дровер **подскролливается к первому полю с ошибкой**, фокус переходит в это поле;\n   - у всех невалидных полей — красный бордер и текст ошибки.\n\nЧастичного применения нет: если невалидно хотя бы одно поле, не применяется ничего.\n\n### Сброс: Clear all или Reset to default\n\n**Рекомендация: одна кнопка сброса, а не две.** Две кнопки сброса рядом заставляют пользователя гадать, чем они отличаются. Кнопка Cancel тоже не нужна: её роль выполняет × в шапке.\n\nКнопка сброса **всегда возвращает фильтры к состоянию по умолчанию** (D4). Её название зависит от того, есть ли у страницы значения по умолчанию:\n\n| У страницы | Название | Что делает |\n|---|---|---|\n| Нет значений по умолчанию | **Clear all** | Очищает все фильтры. «По умолчанию» здесь значит «пусто», поэтому «Clear» точно описывает результат. |\n| Есть значения по умолчанию | **Reset to default** | Возвращает значения по умолчанию, остальное очищает. |\n\nПочему не оставить «Clear all» для обоих случаев: «Clear» обещает пустые поля. Если после клика в фильтре снова появится значение по умолчанию, пользователь решит, что кнопка не сработала. Почему не «Reset to default» для обоих: на странице без значений по умолчанию слово «default» непонятно — к какому умолчанию?\n\nПродукту не нужно выбирать название вручную: оно определяется тем, заданы ли значения по умолчанию. Это убирает разнобой между продуктами.\n\nПоведение кнопки:\n\n- сброс **применяется сразу** и дровер закрывается — так же, как Clear all на странице;\n- кнопка видна всегда, чтобы футер не менялся. Если сбрасывать нечего, клик просто закрывает дровер.\n\n### Clear в секции\n\n- Показывается только когда у фильтра есть значение.\n- Очищает **только черновик этой секции**: значение исчезает, но применяется оно вместе со всем остальным по Apply.\n- Если у фильтра есть значение по умолчанию, Clear в секции всё равно очищает поле полностью. Вернуть значение по умолчанию можно кнопкой Reset to default.\n\n## C6. Синхронизация с чипами на странице\n\n- Быстрый фильтр **дублируется** в дровере. Так дровер остаётся полным списком фильтров страницы: пользователь может настроить всё в одном месте и применить одним Apply.\n- В дровере быстрые фильтры стоят первыми, в том же порядке, что на странице.\n- Значение, применённое в дровере, сразу видно в быстром фильтре на странице, и наоборот.\n- Быстрый фильтр **не превращается** в чип применённого фильтра и не дублируется на странице: одно значение — один чип.\n\n## C7. Что ещё не описано\n\n- **Зависимые фильтры.** Например, варианты Sub-product зависят от выбранного Product. Что происходит с выбранным Sub-product, если Product поменяли в черновике?\n- **Группы секций.** Нужны ли подзаголовки групп, если фильтров больше 15?\n- **Ширина дровера** и поведение на узких экранах.\n- **Ошибка запроса после Apply.** Дровер уже закрыт — где показать ошибку (F2)?\n- **Счётчик на All Filters** — открытый вопрос B2.\n\n---\n\n# Блок D. Применение, валидация, очистка\n\n## D1. Кнопка Apply\n\n**Правило: Apply всегда активна** — в дропдауне чипа и в дровере. Не зависит от того, пустое ли поле и менялось ли что-то.\n\n### Что происходит по клику\n\n1. Запускается валидация всех полей, которые показываются в этом контейнере (дропдаун или дровер целиком).\n2. Есть ошибки → см. D2. Ничего не применяется, контейнер не закрывается.\n3. Ошибок нет:\n   - черновик становится применённым значением;\n   - пустое поле / пустой выбор = фильтр **снят** (параметр не уходит в запрос);\n   - дропдаун / дровер закрывается;\n   - таблица перезапрашивается, чипы обновляются.\n4. Если черновик совпадает с применённым значением — контейнер закрывается, запрос можно не отправлять (оптимизация, не обязательное требование).\n\n### Дополнительно\n\n- Enter в текстовом поле дропдауна = Apply.\n- В дровере Apply применяет **все** фильтры разом. Частичного применения нет: если хотя бы одно поле невалидно, не применяется ничего.\n\n### Почему так (комментарий к решению)\n\nСогласна с решением. Аргументы «за»:\n\n- соответствует конвенции продукта «кнопки не дизейблим»;\n- закрывает реальный баг: стереть значение и применить пустое было невозможно, кроме как через × или Clear all — а это неочевидно;\n- задизейбленная кнопка не объясняет, *почему* она неактивна; активная кнопка + ошибка у поля объясняет.\n\nНа что обратить внимание, чтобы решение не создало новых проблем:\n\n- «Apply с пустым значением» должен **снимать** фильтр, а не отправлять `\"\"` в запрос — это стоит явно прописать в задаче для разработки, иначе бэкенд может начать фильтровать по пустой строке;\n- «Apply без изменений» не должен порождать лишнюю перезагрузку таблицы (п. 4 выше).\n\n## D2. Валидация\n\n### Когда показываем ошибку\n\n| Момент | Поведение |\n|---|---|\n| Пользователь печатает | Ошибку не показываем (не ругаем на полпути). Исключение — если ошибка у поля уже показана: она пересчитывается на каждый ввод и пропадает, как только значение стало валидным. |\n| Потеря фокуса (blur) | Поле валидируется, при ошибке — красный бордер + текст ошибки под полем. |\n| Клик Apply | Валидируются все поля контейнера (в т. ч. те, которых пользователь не касался). |\n\n### Клик Apply при невалидном значении\n\nКнопка остаётся активной, но:\n\n- значение **не применяется и не отправляется**;\n- дропдаун / дровер **не закрывается**;\n- у невалидных полей — красный бордер и текст ошибки;\n- **фокус переходит в первое невалидное поле** (а не просто снимается). Предлагаю это вместо «снять фокус»: пользователь сразу может исправить значение, и это работает для клавиатуры и скринридеров. Если команда хочет именно blur — допустимо, но тогда хотя бы не терять позицию фокуса на кнопке.\n- в дровере: если невалидное поле в свёрнутом аккордеоне — аккордеон раскрывается, дровер скроллится к первому полю с ошибкой.\n\n### Закрытие с невалидным черновиком\n\nКлик вне / Esc / повторный клик по чипу — закрывают, невалидный черновик отбрасывается, ошибки сбрасываются. Применённое значение остаётся прежним.\n\n### Обязательность\n\nФильтр по своей природе необязателен. Красные точки «required» в макетах фильтров (IMG_2344, IMG_2349) нужно либо убрать (визуал, позже), либо описать конкретный кейс, где пустое значение недопустимо. Предлагаю: обязательных фильтров нет; если у страницы обязательный параметр — это значение по умолчанию (D4), которое нельзя снять.\n\n### Комментарий к решению\n\nСогласна: активная кнопка + блокировка отправки — правильная связка. Это стандартное поведение форм («валидируй по submit, не дизейбли submit»). Важное — чтобы клик по Apply давал **видимую** реакцию; иначе пользователь решит, что кнопка сломана. Отсюда перенос фокуса в поле с ошибкой и раскрытие аккордеона в дровере.\n\n## D3. Очистка\n\n⚠️ Частично.\n\n| Элемент | Где | Что делает |\n|---|---|---|\n| × на чипе | страница | Очищает этот фильтр и **сразу применяет**. Дропдаун не открывается. Быстрый фильтр остаётся без значения, чип применённого фильтра исчезает (B1). |\n| Clear all | страница | Очищает все фильтры и сразу применяет. Показывается, только если применён хотя бы один фильтр. Быстрые фильтры остаются без значений, чипы применённых фильтров исчезают. |\n| Clear в секции | дровер | Показывается, только если у фильтра есть значение; у Switch его нет. Очищает черновик этой секции. Применяется по Apply. |\n| Clear all / Reset to default | дровер | Возвращает все фильтры к состоянию по умолчанию, **сразу применяет** и закрывает дровер. Название зависит от того, есть ли значения по умолчанию (C5). |\n| Стереть значение в поле + Apply | чип и дровер | То же, что ×: фильтр снят. |\n\n## D4. Значения по умолчанию и Reset to default\n\n⚠️ Частично.\n\n- Значение по умолчанию — значение, которое продукт задаёт фильтру при первом открытии страницы.\n- Секция дровера со значением по умолчанию считается секцией со значением: она развёрнута и у неё есть Clear (C3).\n- Кнопка сброса в дровере возвращает именно значения по умолчанию; если их нет, она называется Clear all (C5).\n- Не описано: как значения по умолчанию показываются в чипах на странице и что делает Clear all на странице, если они есть.\n\n---\n\n# Блок E. Типы фильтров\n\nЗдесь только то, чем тип отличается от общих правил блоков A–D. Для каждого типа описано поведение в трёх местах: чип на странице без значения, чип со значением и секция в дровере.\n\n## Общее для всех типов\n\n- **Чип без значения:** `Label ⌄`. У Switch шеврона нет.\n- **Чип со значением:** `Label Value × ⌄`. Клик по × очищает фильтр и сразу применяет (D3).\n- **Открытый дропдаун:** чип в активном (filled) состоянии, шеврон смотрит вверх.\n- **Заголовок секции в дровере** всегда выровнен **по левому краю**.\n- **Clear в секции дровера** показывается, **только если у фильтра есть значение**. Нет значения — нет и кнопки Clear. У Switch кнопки Clear нет никогда.\n- **Apply в дропдауне чипа** есть у типов, где значение вводят с клавиатуры или выбирают несколько вариантов: Text input, Amount range, Multiselect. У Select, Date picker и Date range picker кнопки Apply нет: выбор применяется сразу.\n\n## Сводная таблица\n\n| Тип | Чип без значения | Дропдаун на странице | Чип со значением | Дровер | Apply в дропдауне |\n|---|---|---|---|---|---|\n| Text input | `Label ⌄` | Поле + Apply | `Label Value × ⌄` | Одно поле | Да |\n| Amount range | `Label ⌄` | Два поля «от» и «до» + Apply | `Label from 10 to 100 × ⌄` | Два поля в строку | Да |\n| Select | `Label ⌄` | Поиск + список, один вариант | `Label Option × ⌄` | Список с радио-кнопками, поиск, Show all | Нет |\n| Multiselect | `Label ⌄` | Поиск + список с чекбоксами + Apply | `Label Option × ⌄` или `Label (2) × ⌄` | Список с чекбоксами, поиск, Show all | Да |\n| Date picker | `Label ⌄` | Один календарь | `Label 08/10/2025 × ⌄` | Одно поле с одной датой | Нет |\n| Date range picker | `Label ⌄` | Один пикер с двумя календарями | `Label from 08/10/2025 to 02/12/2025 × ⌄` | **Одно** поле с двумя датами | Нет |\n| Switch | `Label` (без шеврона) | Нет дропдауна | `Label ×` | Только переключатель, без Clear | — |\n\n## E1. Text input\n\nВарианты: **Text** (любой текст, плейсхолдер «Input the value») и **Numeric** (только цифры, плейсхолдер «Input the number»).\n\n**На странице**\n- Клик по чипу открывает дропдаун: заголовок поля, поле ввода и Apply. Фокус сразу в поле.\n- Когда в поле есть текст, внутри поля появляется × для быстрой очистки ввода. Он очищает только черновик: фильтр снимается, когда пользователь нажмёт Apply.\n- Enter в поле работает как Apply.\n- После Apply чип показывает введённое значение: `Text Caldera UI × ⌄`. Длинное значение обрезается многоточием (B3).\n- Повторное открытие показывает применённое значение в поле.\n\n**В дровере**\n- Одно поле под заголовком секции. Clear появляется, когда в поле есть применённое или введённое значение.\n- Иконки календаря в текстовом поле быть не должно (ошибка в макете, см. ниже).\n\n**Валидация** — по общим правилам D2. Для Numeric: нецифровые символы не вводятся.\n\n## E2. Amount range\n\n**На странице**\n- Дропдаун: два поля «от» и «до» в строку + Apply.\n- В чипе: `Label from 10 to 100`, `Label from 10`, `Label to 100`.\n\n**В дровере**\n- Два поля в строку под заголовком секции, без иконок календаря.\n\n**Правила границ**\n- Заполнены обе границы → проверяем `from ≤ to`. Ошибка показывается у поля, которое редактировали последним (или у `to`, если оба).\n- Заполнена одна граница → валидно, это открытый диапазон.\n- Обе пустые → фильтр снят. Это **не ошибка**: в макете Validation (IMG_2520, четвёртый пример) пустые поля ошибочно показаны с ошибкой.\n\n**Не описано:** формат ввода чисел и разделители разрядов.\n\n## E3. Select\n\nОдиночный выбор.\n\n**На странице**\n- Дропдаун: поиск и список вариантов. Кнопки Apply нет.\n- Клик по варианту **сразу применяет** его и закрывает дропдаун.\n- В чипе: `Label Option × ⌄`.\n- Пока список загружается, вместо вариантов показываются скелетоны (IMG_2508).\n\n**В дровере**\n- Список с радио-кнопками, поиск, Show all для длинных списков. Clear появляется, когда вариант выбран.\n- Выбор в дровере меняет черновик и применяется по Apply дровера.\n\n> В Pixso есть вариант Select с кнопкой Apply и подзаголовками у вариантов (IMG_2512, сверху). Нужно решить, остаётся ли он отдельным вариантом или его убираем — см. открытые вопросы.\n\n## E4. Multiselect\n\n**На странице**\n- Дропдаун: поиск, список с чекбоксами и Apply.\n- В чипе: один выбранный вариант — `Label Option × ⌄`, два и больше — счётчик `Label (2) × ⌄`.\n\n**В дровере**\n- Список с чекбоксами, поиск, Show all. Clear появляется, когда выбран хотя бы один вариант.\n\n## E5. Date picker\n\nОдно поле — **одна дата**.\n\n**На странице**\n- Дропдаун: один календарь с переключением месяца и года. Кнопки Apply нет.\n- Клик по дате **сразу применяет** её и закрывает дропдаун.\n- В чипе: `Label 08/10/2025 × ⌄`.\n\n**В дровере**\n- Одно поле с плейсхолдером `DD/MM/YYYY` и иконкой календаря. Клик по полю или иконке открывает тот же календарь.\n\n## E6. Date range picker\n\n**Правило: Date range picker — это одно поле и один пикер.** Не два Date picker.\n\nРаньше Date range picker был ошибочно собран из двух отдельных Date picker («с» и «по»), и связь между выбором начальной и конечной даты работала неудобно. От этого уходим: диапазон всегда выбирается в одном поле.\n\n**На странице**\n- Дропдаун: один пикер с двумя календарями (текущий и следующий месяц). Кнопки Apply нет.\n- Первый клик — начальная дата, второй — конечная. Дни между ними подсвечиваются.\n- Если второй клик раньше первой даты, даты меняются местами: диапазон всегда идёт от ранней даты к поздней.\n- Начало и конец могут совпадать: двойной клик по одной дате — диапазон в один день.\n- После выбора второй даты диапазон **сразу применяется**, дропдаун закрывается.\n- Если пользователь выбрал только начальную дату и закрыл дропдаун, черновик отбрасывается (A1).\n- В чипе: `Label from 08/10/2025 to 02/12/2025 × ⌄`.\n\n**В дровере**\n- **Одно** поле с плейсхолдером из двух дат через дефис: `DD/MM/YYYY – DD/MM/YYYY`.\n- Клик по полю открывает тот же пикер с двумя календарями.\n- После выбора в поле сразу проставляются обе даты: `08/10/2025 – 02/12/2025`.\n- Clear очищает обе даты сразу.\n\n**Одна граница:** в отличие от Amount range, открытого диапазона у дат нет: применяется только диапазон с обеими датами.\n\n## E7. Switch\n\n**Название.** Предлагаю называть тип **Switch**, а не Boolean. Boolean — это тип данных, а не элемент интерфейса. В дровере это и есть переключатель, и в Pixso секция уже подписана «Switch» (IMG_2522). На странице его можно называть «чип-переключатель».\n\n**На странице**\n- Чип без шеврона: `Label`. Дропдауна нет.\n- Клик — фильтр включается и **сразу применяется**, на чипе появляется ×: `Label ×`.\n- Повторный клик по чипу или клик по × — фильтр снимается и сразу применяется, × исчезает.\n- Ховер: чип в активном (filled) состоянии (IMG_2509).\n\n**В дровере**\n- Только переключатель, **без кнопки Clear**.\n- Переключение меняет черновик и применяется по Apply дровера.\n\n**Состояния:** включён / не задан. Значения `false` нет: выключенный Switch не фильтрует таблицу. Если нужен фильтр «только нет», это Select с вариантами Yes / No.\n\nSwitch почти всегда используется как быстрый фильтр (B1).\n\n## Ошибки в текущих макетах\n\nНе меняют поведение, но их стоит поправить, когда дойдём до визуала:\n\n- **Дровер (IMG_2522):** заголовки секций Amount range, Text input и Date range стоят по центру. Все заголовки должны быть выровнены по левому краю.\n- **Дровер:** у полей Amount range и Text input иконка календаря — её быть не должно.\n- **Дровер:** кнопка в футере подписана «Save», должна быть «Apply».\n- **Дровер:** у полей стоят красные точки «required» — у фильтров обязательных полей нет (D2).\n- **Date picker на странице (IMG_2519):** у чипа со значением нет ×.\n- **Validation (IMG_2520):** две пустые границы Amount range показаны с ошибкой, а это снятый фильтр.\n\n---\n\n# Блок F. Фильтры и страница\n\n## F1. Сохранение фильтров\n\n⏳ Не описано.\n\n## F2. Результат фильтрации\n\n⏳ Не описано.\n\n---\n\n# Блок G. Клавиатура и доступность\n\n## G1. Порядок фокуса, клавиши, скринридеры\n\n⚠️ Пока правила разбросаны по B5, D1, D2. Собрать сюда.\n\n---\n\n## Открытые вопросы\n\n1. **C5 · Кнопка сброса в дровере** — подтвердить: одна кнопка; называется Clear all, если значений по умолчанию нет, и Reset to default, если есть; сброс применяется сразу и закрывает дровер.\n2. **D4 · Clear all на странице при значениях по умолчанию** — очищает всё или возвращает к значениям по умолчанию, как кнопка в дровере? Предлагаю второе и тогда переименовать её так же, в Reset to default.\n3. **E7 · Switch** — есть ли в продуктах фильтры, где сейчас реально используется значение `false`? Их нужно найти и перевести на select до изменения поведения чипа.\n4. **F1 · Сохранение при смене таба** (вопрос из макета IMG_2352) — фильтры общие для всех табов или свои у каждого?\n5. **C4 · Длинные списки** — подтвердить: лимит 6 по умолчанию с настройкой у продукта; Show all, только если скрыто 2 варианта или больше; названия Show all (N) / Show less; выбранные варианты поднимаются наверх при открытии дровера.\n6. **A3, B4, C3 · Быстрые фильтры** — подтвердить предложения: быстрый фильтр дублируется в дровере; чипы применённых фильтров стоят в порядке секций дровера; ориентир «до 5 фильтров — только быстрые» и «не больше 4 быстрых вместе с All Filters».\n7. **B2 · Счётчик на All Filters** — нужен ли бейдж с числом применённых фильтров (особенно в конфигурации B, где чипы могут уйти на вторую строку)? Если да — считать ли в нём быстрые фильтры.\n8. **B3 · Формат дат в чипе** — в storybook `MM/DD/YYYY`, в макетах `DD/MM/YY`. Выбрать один (визуал, не блокирует).\n9. **E3 · Select с кнопкой Apply** (IMG_2512) — оставляем как отдельный вариант (например, для вариантов с подзаголовками) или убираем, чтобы Select всегда применялся по клику?\n10. **E6 · Date range picker** — подтвердить: если вторая дата раньше первой, даты меняются местами; двойной клик по одной дате — диапазон в один день.\n","sections":[{"md":"# Фильтры — гайдлайны поведения\n\nСтатус: черновик v0.2 · 21.10.2026\nСкрины текущей реализации и макетов: `screens/filters/` (IMG_2336–2355)\nАнглийская версия: `Caldera-filters-guidelines-en.md`\n\n> Цель документа — зафиксировать **поведение** фильтров. Визуал сейчас не меняем: правка UI разведёт интерфейс продуктов, пока не все обновили библиотеку. Всё, что ниже помечено «визуал», — долг на будущее.","html":"\u003ch1>Фильтры — гайдлайны поведения\u003c/h1>\n\u003cp>Статус: черновик v0.2 · 21.10.2026\nСкрины текущей реализации и макетов: \u003ccode>screens/filters/\u003c/code> (IMG_2336–2355)\nАнглийская версия: \u003ccode>Caldera-filters-guidelines-en.md\u003c/code>\u003c/p>\n\u003cblockquote>\n\u003cp>Цель документа — зафиксировать \u003cstrong>поведение\u003c/strong> фильтров. Визуал сейчас не меняем: правка UI разведёт интерфейс продуктов, пока не все обновили библиотеку. Всё, что ниже помечено «визуал», — долг на будущее.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## Структура гайда\n\nГайд разбит на блоки. Каждый блок отвечает на один вопрос и опирается только на блоки выше, поэтому их можно описывать и согласовывать по очереди.\n\n```\nA. Основа ─────────────► что такое фильтр и где он живёт\n   ├─ B. Чипы на странице ─► как фильтр выглядит и открывается на странице\n   └─ C. Дровер ───────────► как фильтр выглядит и открывается в дровере\n          └─ D. Применение ─► что происходит со значением (одинаково в B и C)\n                 └─ E. Типы ─► что особенного у конкретного контрола\n                        └─ F. Страница ─► как фильтры живут вместе с таблицей\nG. Доступность — сквозной блок, собирает правила клавиатуры из всех блоков\n```\n\n✅ описано · ⚠️ частично · ⏳ не начато\n\n### Блок A. Основа\n*Вопрос: из чего состоят фильтры и как устроено их состояние? Термины и модель отсюда используются во всех остальных блоках.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| A1 | Термины и модель «черновик / применённое значение» | ✅ |\n| A2 | Анатомия: панель фильтров на странице, дровер All Filters | ⏳ |\n| A3 | Конфигурации панели: только быстрые фильтры / только All Filters / вместе | ✅ предложение |\n\n### Блок B. Чипы на странице\n*Вопрос: как фильтр выглядит на странице и как открывается его дропдаун? Опирается на A.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| B1 | Виды чипов: быстрый фильтр и чип применённого фильтра | ✅ предложение |\n| B2 | Состояния чипа: default, hover, open, со значением, со счётчиком, loading | ⏳ |\n| B3 | Значение в чипе: формат дат и диапазонов, счётчик multiselect, обрезка длинных значений | ⏳ |\n| B4 | Порядок чипов и перенос на вторую строку | ✅ предложение |\n| B5 | Открытие и закрытие дропдауна чипа | ✅ |\n\n### Блок C. Дровер All Filters\n*Вопрос: как фильтр выглядит и ведёт себя в дровере и как дровер связан с чипами? Опирается на A и B.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| C1 | Открытие и закрытие | ✅ |\n| C2 | Структура: шапка, тело, футер | ✅ |\n| C3 | Секции: развёрнутое и свёрнутое состояние, Expand / Collapse all | ✅ |\n| C4 | Длинные списки: Show all / Show less, поиск, загрузка | ✅ предложение |\n| C5 | Кнопки футера: Apply и сброс (Clear all / Reset to default) | ✅ предложение |\n| C6 | Синхронизация с чипами на странице | ✅ предложение |\n| C7 | Что ещё не описано | ⏳ |\n\n### Блок D. Применение, валидация, очистка\n*Вопрос: что происходит со значением — когда оно применяется, когда нет, как сбрасывается? Правила общие для дропдауна чипа (B) и дровера (C).*\n\n| # | Раздел | Статус |\n|---|---|---|\n| D1 | Кнопка Apply | ✅ |\n| D2 | Валидация | ✅ |\n| D3 | Очистка: × на чипе, Clear в секции, Clear all на странице и в дровере | ⚠️ |\n| D4 | Значения по умолчанию и Reset to default | ⏳ |\n\n### Блок E. Типы фильтров\n*Вопрос: что добавляет к общим правилам конкретный контрол? Здесь только отличия от A–D, общие правила не повторяются.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| — | Общее для всех типов и сводная таблица | ✅ |\n| E1 | Text input (Text, Numeric) | ✅ |\n| E2 | Amount range | ✅ |\n| E3 | Select | ✅ (вопрос про вариант с Apply) |\n| E4 | Multiselect | ✅ |\n| E5 | Date picker | ✅ |\n| E6 | Date range picker — одно поле | ✅ |\n| E7 | Switch (бывш. Boolean) | ✅ |\n| — | Ошибки в текущих макетах | ✅ |\n\n### Блок F. Фильтры и страница\n*Вопрос: как фильтры живут вместе со страницей — что с ними при смене таба, перезагрузке и как выглядит результат? Опирается на всё выше.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| F1 | Сохранение фильтров: смена таба, переход между страницами, перезагрузка, URL | ⏳ |\n| F2 | Результат фильтрации: пустая таблица, загрузка, ошибка запроса | ⏳ |\n\n### Блок G. Клавиатура и доступность\n*Сквозной блок: собирает в одном месте правила фокуса и клавиш, разбросанные по B–E.*\n\n| # | Раздел | Статус |\n|---|---|---|\n| G1 | Порядок фокуса, клавиши, скринридеры | ⚠️ (внутри B5, D1, D2) |\n\n### Открытые вопросы — в конце документа\n\n---\n\n# Блок A. Основа","html":"\u003ch2>Структура гайда\u003c/h2>\n\u003cp>Гайд разбит на блоки. Каждый блок отвечает на один вопрос и опирается только на блоки выше, поэтому их можно описывать и согласовывать по очереди.\u003c/p>\n\u003cpre>\u003ccode>A. Основа ─────────────► что такое фильтр и где он живёт\n   ├─ B. Чипы на странице ─► как фильтр выглядит и открывается на странице\n   └─ C. Дровер ───────────► как фильтр выглядит и открывается в дровере\n          └─ D. Применение ─► что происходит со значением (одинаково в B и C)\n                 └─ E. Типы ─► что особенного у конкретного контрола\n                        └─ F. Страница ─► как фильтры живут вместе с таблицей\nG. Доступность — сквозной блок, собирает правила клавиатуры из всех блоков\n\u003c/code>\u003c/pre>\n\u003cp>✅ описано · ⚠️ частично · ⏳ не начато\u003c/p>\n\u003ch3>Блок A. Основа\u003c/h3>\n\u003cp>\u003cem>Вопрос: из чего состоят фильтры и как устроено их состояние? Термины и модель отсюда используются во всех остальных блоках.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A1\u003c/td>\n\u003ctd>Термины и модель «черновик / применённое значение»\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A2\u003c/td>\n\u003ctd>Анатомия: панель фильтров на странице, дровер All Filters\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A3\u003c/td>\n\u003ctd>Конфигурации панели: только быстрые фильтры / только All Filters / вместе\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок B. Чипы на странице\u003c/h3>\n\u003cp>\u003cem>Вопрос: как фильтр выглядит на странице и как открывается его дропдаун? Опирается на A.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>B1\u003c/td>\n\u003ctd>Виды чипов: быстрый фильтр и чип применённого фильтра\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B2\u003c/td>\n\u003ctd>Состояния чипа: default, hover, open, со значением, со счётчиком, loading\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B3\u003c/td>\n\u003ctd>Значение в чипе: формат дат и диапазонов, счётчик multiselect, обрезка длинных значений\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B4\u003c/td>\n\u003ctd>Порядок чипов и перенос на вторую строку\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B5\u003c/td>\n\u003ctd>Открытие и закрытие дропдауна чипа\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок C. Дровер All Filters\u003c/h3>\n\u003cp>\u003cem>Вопрос: как фильтр выглядит и ведёт себя в дровере и как дровер связан с чипами? Опирается на A и B.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>C1\u003c/td>\n\u003ctd>Открытие и закрытие\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C2\u003c/td>\n\u003ctd>Структура: шапка, тело, футер\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C3\u003c/td>\n\u003ctd>Секции: развёрнутое и свёрнутое состояние, Expand / Collapse all\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C4\u003c/td>\n\u003ctd>Длинные списки: Show all / Show less, поиск, загрузка\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C5\u003c/td>\n\u003ctd>Кнопки футера: Apply и сброс (Clear all / Reset to default)\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C6\u003c/td>\n\u003ctd>Синхронизация с чипами на странице\u003c/td>\n\u003ctd>✅ предложение\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C7\u003c/td>\n\u003ctd>Что ещё не описано\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок D. Применение, валидация, очистка\u003c/h3>\n\u003cp>\u003cem>Вопрос: что происходит со значением — когда оно применяется, когда нет, как сбрасывается? Правила общие для дропдауна чипа (B) и дровера (C).\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>D1\u003c/td>\n\u003ctd>Кнопка Apply\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D2\u003c/td>\n\u003ctd>Валидация\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D3\u003c/td>\n\u003ctd>Очистка: × на чипе, Clear в секции, Clear all на странице и в дровере\u003c/td>\n\u003ctd>⚠️\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D4\u003c/td>\n\u003ctd>Значения по умолчанию и Reset to default\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок E. Типы фильтров\u003c/h3>\n\u003cp>\u003cem>Вопрос: что добавляет к общим правилам конкретный контрол? Здесь только отличия от A–D, общие правила не повторяются.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>Общее для всех типов и сводная таблица\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E1\u003c/td>\n\u003ctd>Text input (Text, Numeric)\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E2\u003c/td>\n\u003ctd>Amount range\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E3\u003c/td>\n\u003ctd>Select\u003c/td>\n\u003ctd>✅ (вопрос про вариант с Apply)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E4\u003c/td>\n\u003ctd>Multiselect\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E5\u003c/td>\n\u003ctd>Date picker\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E6\u003c/td>\n\u003ctd>Date range picker — одно поле\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E7\u003c/td>\n\u003ctd>Switch (бывш. Boolean)\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>Ошибки в текущих макетах\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок F. Фильтры и страница\u003c/h3>\n\u003cp>\u003cem>Вопрос: как фильтры живут вместе со страницей — что с ними при смене таба, перезагрузке и как выглядит результат? Опирается на всё выше.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>F1\u003c/td>\n\u003ctd>Сохранение фильтров: смена таба, переход между страницами, перезагрузка, URL\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2\u003c/td>\n\u003ctd>Результат фильтрации: пустая таблица, загрузка, ошибка запроса\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Блок G. Клавиатура и доступность\u003c/h3>\n\u003cp>\u003cem>Сквозной блок: собирает в одном месте правила фокуса и клавиш, разбросанные по B–E.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Раздел\u003c/th>\n\u003cth>Статус\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>G1\u003c/td>\n\u003ctd>Порядок фокуса, клавиши, скринридеры\u003c/td>\n\u003ctd>⚠️ (внутри B5, D1, D2)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Открытые вопросы — в конце документа\u003c/h3>\n\u003chr>\n\u003ch1>Блок A. Основа\u003c/h1>\n"},{"md":"## A1. Термины и базовая модель\n\n- **Чип** — фильтр в панели над таблицей. Открывает дропдаун с контролом и кнопкой Apply. Бывает двух видов (подробно — B1):\n  - **Быстрый фильтр** — чип, который есть на странице **всегда**, независимо от того, выбрано в нём значение или нет. Набор быстрых фильтров задаёт продукт.\n  - **Чип применённого фильтра** — появляется на странице, только когда фильтр из дровера применён, и исчезает, когда его очищают.\n- **Дровер (All Filters)** — боковая панель со всеми фильтрами страницы и общими кнопками Clear all / Apply.\n- **Применённое значение** — то, что ушло в запрос и по чему отфильтрована таблица.\n- **Черновик** — то, что пользователь ввёл/выбрал, но ещё не применил.\n\n**Главное правило, на котором держится всё остальное:**\n\n1. Пока пользователь не нажал Apply, он редактирует **черновик**. Таблица и чипы показывают только **применённые** значения.\n2. Apply превращает черновик в применённое значение (если он валиден).\n3. Закрытие без Apply (клик вне, Esc, крестик дровера) **отбрасывает черновик**. При следующем открытии пользователь видит применённое значение.\n4. Чип и дровер — два входа в **одно и то же состояние фильтров**. Значение, применённое в чипе, сразу видно в дровере, и наоборот. Правила Apply, валидации и очистки одинаковы в обоих местах.\n\n> Сейчас в макетах (IMG_2345) чип показывает черновое значение «Label from 10 to» при невалидном вводе. По правилу выше чип должен показывать последнее применённое значение.","html":"\u003ch2>A1. Термины и базовая модель\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Чип\u003c/strong> — фильтр в панели над таблицей. Открывает дропдаун с контролом и кнопкой Apply. Бывает двух видов (подробно — B1):\u003cul>\n\u003cli>\u003cstrong>Быстрый фильтр\u003c/strong> — чип, который есть на странице \u003cstrong>всегда\u003c/strong>, независимо от того, выбрано в нём значение или нет. Набор быстрых фильтров задаёт продукт.\u003c/li>\n\u003cli>\u003cstrong>Чип применённого фильтра\u003c/strong> — появляется на странице, только когда фильтр из дровера применён, и исчезает, когда его очищают.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Дровер (All Filters)\u003c/strong> — боковая панель со всеми фильтрами страницы и общими кнопками Clear all / Apply.\u003c/li>\n\u003cli>\u003cstrong>Применённое значение\u003c/strong> — то, что ушло в запрос и по чему отфильтрована таблица.\u003c/li>\n\u003cli>\u003cstrong>Черновик\u003c/strong> — то, что пользователь ввёл/выбрал, но ещё не применил.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Главное правило, на котором держится всё остальное:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Пока пользователь не нажал Apply, он редактирует \u003cstrong>черновик\u003c/strong>. Таблица и чипы показывают только \u003cstro
