**A. Quick filters only** | The product has few filters (3–5); there is no point hiding them in a drawer | Quick filters + Clear all. No All Filters button and no drawer. |\n| **B. All Filters only** | There are many filters, and none is used noticeably more often than the others | All Filters + applied-filter chips + Clear all |\n| **C. All Filters + quick filters** | There are many filters, but 2–4 key ones should be at hand | All Filters + quick filters + applied-filter chips + Clear all |\n\nSuggested rule of thumb: up to 5 filters — A; more than 5 — B or C. In C, use no more than 4 quick filters; otherwise the bar turns into a drawer laid out on the page.\n\n---\n\n# Block B. Page chips\n\n## B1. Chip types\n\n| | Quick filter | Applied-filter chip |\n|---|---|---|\n| Visible on the page | Always | Only while the filter is applied |\n| Without a value | Outline chip with a label and an arrow: `Label ⌄` | Does not exist |\n| With a value | `Label Value × ⌄` | `Label Value × ⌄` — looks the same |\n| Click on the chip | Dropdown with a control and Apply | Dropdown with a control and Apply — behaves the same |\n| × on the chip | Clears the value and applies. **The chip stays**, with no value | Clears the value and applies. **The chip disappears** |\n| Apply with an empty value | Filter removed; the chip stays, with no value | Filter removed; the chip disappears (the dropdown closes with it) |\n| Clear all on the page | All quick filters stay, with no values | All applied-filter chips disappear |\n| Present in the drawer | Yes (in configuration C) | Yes — the drawer is where it comes from |\n\nBoth kinds look and behave the same inside the dropdown. The only difference is whether the chip stays on the page after being cleared. Rules B5, D1 and D2 apply to both without exception.\n\n## B2. Chip states\n\n⏳ Not started.\n\n## B3. Value in the chip\n\n⏳ Not started. Already known: for a range with one boundary — `Label to 10` / `Label from 10` (see E2).\n\n## B4. Chip order\n\n`All Filters` → quick filters → applied-filter chips → `Clear all`\n\n- Quick filters keep the order defined by the product and do not move when values are applied. Users remember where they are.\n- Applied-filter chips follow the order of the drawer sections (not the order in which they were applied), so the bar doesn't \"jump\" on every Apply.\n- When wrapping to a second line, the order is preserved (IMG_2336).\n\n## B5. Opening and closing the chip dropdown\n\n**Fix:** the dropdown opens **on click**, not on hover.\n\n| Action | Result |\n|---|---|\n| Hover over a chip | Visual hover state only. The dropdown does not open. |\n| Click on a chip | Opens the dropdown. Focus moves to the first control (input / search). |\n| Click on the open chip again | Closes the dropdown; the draft is discarded. |\n| Click on another chip | The current dropdown closes (draft discarded) and the new one opens. At most one is open at a time. |\n| Click outside the dropdown | Closes it; the draft is discarded. |\n| Esc | Closes it; the draft is discarded; focus returns to the chip. |\n| Click on × on a chip | Clears the filter and applies immediately. The dropdown does **not** open. |\n| Enter / Space on a focused chip | Opens the dropdown (same as click). |\n\nWhy not hover: a dropdown with an input and a button is a form. On hover, it opens by accident as the mouse moves toward the table, and closes when the cursor \"slips off\" on its way to the button. Hover is also unavailable from the keyboard and on a touchpad without a cursor.\n\n---\n\n# Block C. All Filters drawer\n\nThe drawer is a side panel with all of the page's filters. Inside the drawer, the user edits a draft (A1): the table doesn't change until they click Apply.\n\n## C1. Opening and closing\n\n### Opening\n\n- The drawer opens **only on click** on the All Filters button.\n- It slides in from the right over the page, and the page behind it is dimmed. Page scrolling is locked while the drawer is open.\n- If a chip dropdown was open on the page, it closes and its draft is discarded.\n- The drawer shows the **applied** values of all filters right away.\n- Focus moves into the drawer (to the title or the first control). Tab doesn't leave the drawer while it is open.\n- The drawer always opens scrolled to the top.\n\n### Closing\n\n| Action | What happens to changes | Drawer |\n|---|---|---|\n| Apply, no errors | All filters are applied at once | Closes |\n| Apply, with errors | Nothing is applied (C5) | Stays open |\n| Clear all / Reset to default | The reset is applied immediately (C5) | Closes |\n| × in the header | The draft is discarded | Closes |\n| Click on the dimmed page | The draft is discarded | Closes |\n| Esc | The draft is discarded | Closes |\n\n- There is **no** \"You have unsaved changes\" confirmation on close. Setting filters again is cheap, and an extra dialog annoys more often than it helps.\n- After closing, focus returns to the All Filters button.\n\n## C2. Drawer structure\n\n```\n┌──────────────────────────────┐\n│ All Filters               ×  │  ← header, pinned\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← sections, scroll\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← footer, pinned\n└──────────────────────────────┘\n```\n\n- **Header** is pinned: the title \"All Filters\", the × button and the Expand all / Collapse all link (C3).\n- **Body** scrolls. It contains the filter sections in a fixed order: quick filters first, in page order, then the rest (C6).\n- **Footer** is pinned and always visible: the reset button and Apply (C5).\n- **Section titles** are left-aligned. A long title wraps to a second line instead of being truncated.\n\n## C3. Sections: expanded and collapsed state\n\n### Default state\n\nThe product chooses which state sections open in by default:\n\n- **all expanded** — when there are few filters and it matters to see everything at once;\n- **all collapsed** — when there are many filters and the drawer would otherwise get too long.\n\n### A section with a value is always expanded\n\nWhen the drawer opens, a section **that has a value** is expanded, even if sections are collapsed by default. A value is either an applied value or a default value (D4). This way the user immediately sees what is filtering the table right now.\n\n### Controlling a section\n\n- Every section (except Switch) has a chevron in its header: `⌄` — expand, `^` — collapse. Clicking the header also expands and collapses the section.\n- The user can collapse a section even if it has a value. The header then keeps the Clear button and a short value hint: `Status · 2`, `Created on · 08/10/2025`. Without it, a collapsed section with a value would look empty.\n- **Switch** is not an accordion: one row with the title on the left and the switch on the right, no chevron and no Clear.\n- **Clear** sits in the section header and is shown only when the filter has a value (D3).\n\n### Expand all / Collapse all\n\n- A link under the drawer title.\n- If at least one section is collapsed, the link reads **Expand all** and expands them all.\n- If all sections are expanded, the link reads **Collapse all** and collapses them all.\n- The link is needed when there are more than 5 sections. With fewer, it can be hidden.\n\n### What is remembered\n\nWhich sections are expanded is kept while the drawer is open. The next time it opens, the state is calculated again using the rules above: the default state plus expanded sections with values.\n\n## C4. Long lists: Show all and Show less\n\nApplies to Select and Multiselect in the drawer.\n\n### How many options are visible\n\n- By default, an expanded section shows **6 options**. The product can set a different number for a specific filter.\n- **Minimum-remainder rule:** the Show all button is shown only if **2 or more options** would be hidden under it. If only one would be hidden, show the whole list: the button would take as much space as that option and save nothing.\n  - Example: limit 6, 7 options → show all 7, no button.\n  - Example: limit 6, 8 options → show 6 and a `Show all (8)` button.\n- This is a single comparison (\"more options than limit + 1?\"), not complex logic. So the rule is built into the component, and the product only sets the limit.\n\n### Selected options are always visible\n\nIf a selected option sits below the limit, it would be hidden in the collapsed list. So when the drawer opens, selected options move to the top of the list, and the rest follow in their original order.\n\nThe order is recalculated **only when the drawer opens**, not on click. Otherwise options would \"jump\" from under the cursor.\n\n### Button labels\n\n| Collapsed list | Expanded list | Comment |\n|---|---|---|\n| **Show all (24)** | **Show less** | Recommended. The number shows the total right away. \"Show less\" honestly describes the action: the list shrinks back to the limit, it doesn't disappear. |\n| Show more | Show less | A standard pair, but \"more\" doesn't say whether the whole list or only part of it will open. |\n| Show 18 more | Show less | Precise, but the number depends on the limit and is harder to localize. |\n| ~~Show all~~ | ~~Hide all~~ | Don't use: \"Hide all\" reads as \"hide everything\", although the first options stay in place. |\n\n### What happens on Show all\n\n- The list expands **right inside the section**, without a nested scroll: the drawer already scrolls, and a scroll inside a scroll easily traps the mouse wheel.\n- If there are more than **20** options, the expanded list gets a maximum height of about 10 rows and its own scroll. In this case, the search above the list stays in place.\n- The button changes to **Show less** and sits under the last option.\n\n### What happens on Show less\n\n- The list collapses back to the limit.\n- If the section title has scrolled out of view by then, the drawer scrolls so the section title is visible again. The user shouldn't lose their place.\n\n### Search in the list\n\n- A search field is shown above the list if there are more than 10 options.\n- While the search has text, **all** matches are shown, with no limit and no Show all.\n- No matches — the text \"No results\".\n- Clearing the search (× in the field) returns the list to its previous state.\n\n### Loading and errors\n\n- While options load, skeletons are shown instead (as in the chip dropdown, IMG_2508).\n- Loading error — error text and a Retry link inside the section. Other sections work as usual.\n\n## C5. Footer buttons\n\n### Apply\n\n**Apply is always enabled** (D1) — whether or not the user changed anything.\n\nOn click:\n\n1. **All** fields in the drawer are validated, including those in collapsed sections.\n2. No errors → all filters are applied at once, the drawer closes, the table updates.\n3. Errors:\n   - nothing is applied, the drawer stays open;\n   - collapsed sections with errors expand;\n   - the drawer **scrolls to the first field with an error**, and focus moves to that field;\n   - all invalid fields get a red border and error text.\n\nThere is no partial apply: if even one field is invalid, nothing is applied.\n\n### Reset: Clear all or Reset to default\n\n**Recommendation: one reset button, not two.** Two reset buttons side by side make the user guess how they differ. A Cancel button isn't needed either: the × in the header does that job.\n\nThe reset button **always returns the filters to their default state** (D4). Its label depends on whether the page has default values:\n\n| The page has | Label | What it does |\n|---|---|---|\n| No default values | **Clear all** | Clears all filters. \"Default\" here means \"empty\", so \"Clear\" describes the result exactly. |\n| Default values | **Reset to default** | Restores the default values and clears everything else. |\n\nWhy not keep \"Clear all\" for both cases: \"Clear\" promises empty fields. If a default value reappears in a filter after the click, the user will think the button didn't work. Why not \"Reset to default\" for both: on a page without defaults, the word \"default\" is confusing — default to what?\n\nThe product doesn't need to pick the label by hand: it is determined by whether default values are set. This removes inconsistency between products.\n\nButton behavior:\n\n- the reset **is applied immediately** and the drawer closes — the same as Clear all on the page;\n- the button is always visible so the footer doesn't change. If there is nothing to reset, clicking it simply closes the drawer.\n\n### Clear in a section\n\n- Shown only when the filter has a value.\n- Clears **only this section's draft**: the value disappears, but the change is applied together with everything else on Apply.\n- If the filter has a default value, Clear in a section still empties the field completely. The default value can be restored with Reset to default.\n\n## C6. Syncing with the page chips\n\n- A quick filter is **duplicated** in the drawer. This keeps the drawer a complete list of the page's filters: the user can set everything in one place and apply it with one Apply.\n- In the drawer, quick filters come first, in the same order as on the page.\n- A value applied in the drawer is immediately visible in the quick filter on the page, and vice versa.\n- A quick filter **does not turn into** an applied-filter chip and is not duplicated on the page: one value — one chip.\n\n## C7. Not yet covered\n\n- **Dependent filters.** For example, Sub-product options depend on the selected Product. What happens to the selected Sub-product if Product changes in the draft?\n- **Section groups.** Are group subheadings needed when there are more than 15 filters?\n- **Drawer width** and behavior on narrow screens.\n- **Request error after Apply.** The drawer is already closed — where should the error be shown (F2)?\n- **Counter on All Filters** — open question B2.\n\n---\n\n# Block D. Applying, validation, clearing\n\n## D1. Apply button\n\n**Rule: Apply is always enabled** — in the chip dropdown and in the drawer. It does not depend on whether a field is empty or whether anything has changed.\n\n### What happens on click\n\n1. All fields shown in this container (the dropdown, or the whole drawer) are validated.\n2. There are errors → see D2. Nothing is applied; the container stays open.\n3. No errors:\n   - the draft becomes the applied value;\n   - an empty field / empty selection = the filter is **removed** (the parameter is not sent in the request);\n   - the dropdown / drawer closes;\n   - the table is re-requested and the chips update.\n4. If the draft matches the applied value, the container closes and the request may be skipped (an optimization, not a requirement).\n\n### Also\n\n- Enter in a dropdown text field = Apply.\n- In the drawer, Apply applies **all** filters at once. There is no partial apply: if even one field is invalid, nothing is applied.\n\n### Rationale (comment on the decision)\n\nI agree with the decision. Arguments for:\n\n- it follows the product convention \"we don't disable buttons\";\n- it fixes a real bug: erasing a value and applying an empty one was impossible except via × or Clear all — which is not obvious;\n- a disabled button doesn't explain *why* it is disabled; an enabled button + an error on the field does.\n\nWhat to watch out for so the decision doesn't create new problems:\n\n- \"Apply with an empty value\" must **remove** the filter, not send `\"\"` in the request. This should be stated explicitly in the dev ticket; otherwise the backend may start filtering by an empty string;\n- \"Apply with no changes\" should not trigger an unnecessary table reload (item 4 above).\n\n## D2. Validation\n\n### When to show an error\n\n| Moment | Behavior |\n|---|---|\n| User is typing | No error shown (don't scold halfway through). Exception: if an error is already shown on the field, it is re-checked on every keystroke and disappears as soon as the value becomes valid. |\n| Focus leaves the field (blur) | The field is validated; on error — red border + error text under the field. |\n| Click on Apply | All fields in the container are validated (including ones the user hasn't touched). |\n\n### Clicking Apply with an invalid value\n\nThe button stays enabled, but:\n\n- the value is **not applied and not sent**;\n- the dropdown / drawer **does not close**;\n- invalid fields get a red border and error text;\n- **focus moves to the first invalid field** (instead of just being removed). I suggest this instead of \"remove focus\": the user can fix the value right away, and it works for keyboard and screen-reader users. If the team specifically wants blur, that's acceptable, but at least focus position on the button shouldn't be lost.\n- in the drawer: if the invalid field is inside a collapsed accordion, the accordion expands and the drawer scrolls to the first field with an error.\n\n### Closing with an invalid draft\n\nClick outside / Esc / clicking the chip again — closes the container; the invalid draft is discarded and errors are reset. The applied value stays the same.\n\n### Required fields\n\nA filter is optional by nature. The red \"required\" dots in the filter mockups (IMG_2344, IMG_2349) should either be removed (visual, later) or tied to a specific case where an empty value is not allowed. Suggestion: there are no required filters; if a page has a mandatory parameter, it is a default value (D4) that cannot be removed.\n\n### Comment on the decision\n\nI agree: an enabled button + blocked submission is the right combination. It is standard form behavior (\"validate on submit, don't disable submit\"). What matters is that clicking Apply produces a **visible** reaction; otherwise the user will think the button is broken. Hence moving focus to the field with the error and expanding the accordion in the drawer.\n\n## D3. Clearing\n\n⚠️ Partial.\n\n| Element | Where | What it does |\n|---|---|---|\n| × on a chip | page | Clears this filter and **applies immediately**. The dropdown does not open. A quick filter stays with no value; an applied-filter chip disappears (B1). |\n| Clear all | page | Clears all filters and applies immediately. Shown only if at least one filter is applied. Quick filters stay with no values; applied-filter chips disappear. |\n| Clear in a section | drawer | Shown only when the filter has a value; Switch never has it. Clears this section's draft. Applied on Apply. |\n| Clear all / Reset to default | drawer | Returns all filters to their default state, **applies immediately** and closes the drawer. The label depends on whether default values exist (C5). |\n| Erase the value in a field + Apply | chip and drawer | Same as ×: the filter is removed. |\n\n## D4. Default values and Reset to default\n\n⚠️ Partial.\n\n- A default value is a value the product sets for a filter when the page first opens.\n- A drawer section with a default value counts as a section with a value: it is expanded and has Clear (C3).\n- The drawer's reset button restores exactly the default values; if there are none, it is labeled Clear all (C5).\n- Not yet covered: how default values are shown in the page chips, and what Clear all on the page does when defaults exist.\n\n---\n\n# Block E. Filter types\n\nOnly what makes a type different from the general rules in blocks A–D. Each type is described in three places: a chip on the page without a value, a chip with a value, and the drawer section.\n\n## Common to all types\n\n- **Chip without a value:** `Label ⌄`. Switch has no chevron.\n- **Chip with a value:** `Label Value × ⌄`. Clicking × clears the filter and applies immediately (D3).\n- **Open dropdown:** the chip is in the active (filled) state, the chevron points up.\n- **Section title in the drawer** is always **left-aligned**.\n- **Clear in a drawer section** is shown **only when the filter has a value**. No value — no Clear button. Switch never has a Clear button.\n- **Apply in the chip dropdown** exists for types where the value is typed or several options are picked: Text input, Amount range, Multiselect. Select, Date picker and Date range picker have no Apply: the choice is applied immediately.\n\n## Summary table\n\n| Type | Chip without a value | Dropdown on the page | Chip with a value | Drawer | Apply in the dropdown |\n|---|---|---|---|---|---|\n| Text input | `Label ⌄` | Field + Apply | `Label Value × ⌄` | One field | Yes |\n| Amount range | `Label ⌄` | Two fields, \"from\" and \"to\" + Apply | `Label from 10 to 100 × ⌄` | Two fields in a row | Yes |\n| Select | `Label ⌄` | Search + list, one option | `Label Option × ⌄` | List with radio buttons, search, Show all | No |\n| Multiselect | `Label ⌄` | Search + list with checkboxes + Apply | `Label Option × ⌄` or `Label (2) × ⌄` | List with checkboxes, search, Show all | Yes |\n| Date picker | `Label ⌄` | One calendar | `Label 08/10/2025 × ⌄` | One field with one date | No |\n| Date range picker | `Label ⌄` | One picker with two calendars | `Label from 08/10/2025 to 02/12/2025 × ⌄` | **One** field with two dates | No |\n| Switch | `Label` (no chevron) | No dropdown | `Label ×` | Switch only, no Clear | — |\n\n## E1. Text input\n\nVariants: **Text** (any text, placeholder \"Input the value\") and **Numeric** (digits only, placeholder \"Input the number\").\n\n**On the page**\n- Clicking the chip opens a dropdown: field title, input and Apply. Focus goes straight to the input.\n- When the field has text, a × appears inside it to clear the input quickly. It clears only the draft: the filter is removed when the user clicks Apply.\n- Enter in the field works as Apply.\n- After Apply, the chip shows the entered value: `Text Caldera UI × ⌄`. A long value is truncated with an ellipsis (B3).\n- Reopening shows the applied value in the field.\n\n**In the drawer**\n- One field under the section title. Clear appears when the field has an applied or entered value.\n- A text field must not have a calendar icon (mockup error, see below).\n\n**Validation** — general rules in D2. For Numeric: non-digit characters can't be typed.\n\n## E2. Amount range\n\n**On the page**\n- Dropdown: two fields, \"from\" and \"to\", in a row + Apply.\n- In the chip: `Label from 10 to 100`, `Label from 10`, `Label to 100`.\n\n**In the drawer**\n- Two fields in a row under the section title, no calendar icons.\n\n**Boundary rules**\n- Both boundaries filled → check `from ≤ to`. The error is shown on the field edited last (or on `to`, if both).\n- One boundary filled → valid; this is an open range.\n- Both empty → the filter is removed. This is **not an error**: in the Validation mockup (IMG_2520, fourth example), empty fields are wrongly shown with an error.\n\n**Not yet covered:** number input format and thousands separators.\n\n## E3. Select\n\nSingle choice.\n\n**On the page**\n- Dropdown: search and a list of options. No Apply button.\n- Clicking an option **applies it immediately** and closes the dropdown.\n- In the chip: `Label Option × ⌄`.\n- While the list is loading, skeletons are shown instead of options (IMG_2508).\n\n**In the drawer**\n- List with radio buttons, search, Show all for long lists. Clear appears when an option is selected.\n- A choice in the drawer changes the draft and is applied with the drawer's Apply.\n\n> Pixso also has a Select variant with an Apply button and option subtitles (IMG_2512, top). We need to decide whether it stays as a separate variant or is removed — see open questions.\n\n## E4. Multiselect\n\n**On the page**\n- Dropdown: search, list with checkboxes, and Apply.\n- In the chip: one selected option — `Label Option × ⌄`; two or more — a counter, `Label (2) × ⌄`.\n\n**In the drawer**\n- List with checkboxes, search, Show all. Clear appears when at least one option is selected.\n\n## E5. Date picker\n\nOne field — **one date**.\n\n**On the page**\n- Dropdown: one calendar with month and year switching. No Apply button.\n- Clicking a date **applies it immediately** and closes the dropdown.\n- In the chip: `Label 08/10/2025 × ⌄`.\n\n**In the drawer**\n- One field with the placeholder `DD/MM/YYYY` and a calendar icon. Clicking the field or the icon opens the same calendar.\n\n## E6. Date range picker\n\n**Rule: a Date range picker is one field and one picker.** Not two Date pickers.\n\nPreviously, the Date range picker was wrongly built from two separate Date pickers (\"from\" and \"to\"), and the link between picking the start and end dates was awkward. We are moving away from that: a range is always picked in one field.\n\n**On the page**\n- Dropdown: one picker with two calendars (current and next month). No Apply button.\n- First click — start date, second click — end date. The days in between are highlighted.\n- If the second click is earlier than the first date, the dates swap: the range always runs from the earlier date to the later one.\n- Start and end can be the same: clicking one date twice gives a one-day range.\n- After the second date is picked, the range **is applied immediately** and the dropdown closes.\n- If the user picked only the start date and closed the dropdown, the draft is discarded (A1).\n- In the chip: `Label from 08/10/2025 to 02/12/2025 × ⌄`.\n\n**In the drawer**\n- **One** field with a placeholder of two dates separated by a dash: `DD/MM/YYYY – DD/MM/YYYY`.\n- Clicking the field opens the same picker with two calendars.\n- After picking, both dates are filled in the field at once: `08/10/2025 – 02/12/2025`.\n- Clear clears both dates at once.\n\n**One boundary:** unlike Amount range, dates have no open range: only a range with both dates is applied.\n\n## E7. Switch\n\n**Name.** I suggest calling this type **Switch**, not Boolean. Boolean is a data type, not a UI element. In the drawer it is literally a switch, and in Pixso the section is already labeled \"Switch\" (IMG_2522). On the page it can be called a \"switch chip\".\n\n**On the page**\n- Chip without a chevron: `Label`. No dropdown.\n- Click — the filter turns on and **is applied immediately**; a × appears on the chip: `Label ×`.\n- Clicking the chip again or clicking × — the filter is removed and applied immediately; the × disappears.\n- Hover: the chip is in the active (filled) state (IMG_2509).\n\n**In the drawer**\n- Switch only, **no Clear button**.\n- Toggling changes the draft and is applied with the drawer's Apply.\n\n**States:** on / not set. There is no `false` value: a switched-off Switch does not filter the table. If a \"no only\" filter is needed, use a Select with Yes / No options.\n\nSwitch is almost always used as a quick filter (B1).\n\n## Errors in the current mockups\n\nThey don't change behavior but should be fixed when we get to the visuals:\n\n- **Drawer (IMG_2522):** the section titles Amount range, Text input and Date range are centered. All titles must be left-aligned.\n- **Drawer:** the Amount range and Text input fields have a calendar icon — they shouldn't.\n- **Drawer:** the footer button is labeled \"Save\"; it should be \"Apply\".\n- **Drawer:** fields have red \"required\" dots — filters have no required fields (D2).\n- **Date picker on the page (IMG_2519):** the chip with a value has no ×.\n- **Validation (IMG_2520):** two empty Amount range boundaries are shown with an error, but this is a removed filter.\n\n---\n\n# Block F. Filters and the page\n\n## F1. Persisting filters\n\n⏳ Not started.\n\n## F2. Filtering result\n\n⏳ Not started.\n\n---\n\n# Block G. Keyboard and accessibility\n\n## G1. Focus order, keys, screen readers\n\n⚠️ The rules are currently spread across B5, D1, D2. To be collected here.\n\n---\n\n## Open questions\n\n1. **C5 · Reset button in the drawer** — confirm: one button; labeled Clear all if there are no default values and Reset to default if there are; the reset is applied immediately and closes the drawer.\n2. **D4 · Clear all on the page with default values** — does it clear everything or return to the defaults, like the drawer button? I suggest the latter, and then renaming it the same way, to Reset to default.\n3. **E7 · Switch** — are there filters in the products that actually use the `false` value today? They need to be found and moved to a select before the chip behavior changes.\n4. **F1 · Persisting across tabs** (question from mockup IMG_2352) — are filters shared across all tabs, or does each tab have its own?\n5. **C4 · Long lists** — confirm: a default limit of 6, configurable by the product; Show all only if 2 or more options are hidden; labels Show all (N) / Show less; selected options move to the top when the drawer opens.\n6. **A3, B4, C3 · Quick filters** — confirm the proposals: a quick filter is duplicated in the drawer; applied-filter chips follow the order of the drawer sections; rules of thumb \"up to 5 filters — quick filters only\" and \"no more than 4 quick filters together with All Filters\".\n7. **B2 · Counter on All Filters** — is a badge with the number of applied filters needed (especially in configuration B, where chips may wrap to a second line)? If so, should it count quick filters?\n8. **B3 · Date format in the chip** — Storybook uses `MM/DD/YYYY`, the mockups use `DD/MM/YY`. Pick one (visual, not blocking).\n9. **E3 · Select with an Apply button** (IMG_2512) — keep it as a separate variant (e.g. for options with subtitles) or remove it so Select always applies on click?\n10. **E6 · Date range picker** — confirm: if the second date is earlier than the first, the dates swap; clicking one date twice gives a one-day range.\n","sections":[{"md":"# Filters — Behavior Guidelines\n\nStatus: draft v0.2 · 21.10.2026\nScreenshots of the current implementation and mockups: `screens/filters/` (IMG_2336–2355)\nRussian version: `Caldera-filters-guidelines.md`\n\n> This document defines how filters **behave**. We are not changing the visuals for now: a UI change would make products look inconsistent until every product has updated the library. Anything marked \"visual\" below is design debt for later.","html":"\u003ch1>Filters — Behavior Guidelines\u003c/h1>\n\u003cp>Status: draft v0.2 · 21.10.2026\nScreenshots of the current implementation and mockups: \u003ccode>screens/filters/\u003c/code> (IMG_2336–2355)\nRussian version: \u003ccode>Caldera-filters-guidelines.md\u003c/code>\u003c/p>\n\u003cblockquote>\n\u003cp>This document defines how filters \u003cstrong>behave\u003c/strong>. We are not changing the visuals for now: a UI change would make products look inconsistent until every product has updated the library. Anything marked &quot;visual&quot; below is design debt for later.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## Guide structure\n\nThe guide is split into blocks. Each block answers one question and relies only on the blocks above it, so they can be written and agreed on one at a time.\n\n```\nA. Foundations ───────► what a filter is and where it lives\n   ├─ B. Page chips ────► how a filter looks and opens on the page\n   └─ C. Drawer ────────► how a filter looks and opens in the drawer\n          └─ D. Applying ─► what happens to the value (same in B and C)\n                 └─ E. Types ─► what is specific to each control\n                        └─ F. Page ─► how filters live together with the table\nG. Accessibility — cross-cutting block, collects keyboard rules from all blocks\n```\n\n✅ done · ⚠️ partial · ⏳ not started\n\n### Block A. Foundations\n*Question: what are filters made of, and how is their state organized? The terms and the model defined here are used in every other block.*\n\n| # | Section | Status |\n|---|---|---|\n| A1 | Terms and the \"draft / applied value\" model | ✅ |\n| A2 | Anatomy: filter bar on the page, All Filters drawer | ⏳ |\n| A3 | Filter bar configurations: quick filters only / All Filters only / both | ✅ proposal |\n\n### Block B. Page chips\n*Question: how does a filter look on the page, and how does its dropdown open? Relies on A.*\n\n| # | Section | Status |\n|---|---|---|\n| B1 | Chip types: quick filter and applied-filter chip | ✅ proposal |\n| B2 | Chip states: default, hover, open, with value, with counter, loading | ⏳ |\n| B3 | Value in the chip: date and range formats, multiselect counter, truncating long values | ⏳ |\n| B4 | Chip order and wrapping to a second line | ✅ proposal |\n| B5 | Opening and closing the chip dropdown | ✅ |\n\n### Block C. All Filters drawer\n*Question: how does a filter look and behave in the drawer, and how is the drawer connected to the chips? Relies on A and B.*\n\n| # | Section | Status |\n|---|---|---|\n| C1 | Opening and closing | ✅ |\n| C2 | Structure: header, body, footer | ✅ |\n| C3 | Sections: expanded and collapsed state, Expand / Collapse all | ✅ |\n| C4 | Long lists: Show all / Show less, search, loading | ✅ proposal |\n| C5 | Footer buttons: Apply and reset (Clear all / Reset to default) | ✅ proposal |\n| C6 | Syncing with the page chips | ✅ proposal |\n| C7 | Not yet covered | ⏳ |\n\n### Block D. Applying, validation, clearing\n*Question: what happens to the value — when it is applied, when it isn't, and how it is reset? The rules are the same for the chip dropdown (B) and the drawer (C).*\n\n| # | Section | Status |\n|---|---|---|\n| D1 | Apply button | ✅ |\n| D2 | Validation | ✅ |\n| D3 | Clearing: × on a chip, Clear in a section, Clear all on the page and in the drawer | ⚠️ |\n| D4 | Default values and Reset to default | ⏳ |\n\n### Block E. Filter types\n*Question: what does a specific control add to the general rules? Only differences from A–D go here; general rules are not repeated.*\n\n| # | Section | Status |\n|---|---|---|\n| — | Common to all types and summary table | ✅ |\n| E1 | Text input (Text, Numeric) | ✅ |\n| E2 | Amount range | ✅ |\n| E3 | Select | ✅ (question about the Apply variant) |\n| E4 | Multiselect | ✅ |\n| E5 | Date picker | ✅ |\n| E6 | Date range picker — one field | ✅ |\n| E7 | Switch (formerly Boolean) | ✅ |\n| — | Errors in the current mockups | ✅ |\n\n### Block F. Filters and the page\n*Question: how do filters live together with the page — what happens to them when switching tabs or reloading, and what does the result look like? Relies on everything above.*\n\n| # | Section | Status |\n|---|---|---|\n| F1 | Persisting filters: switching tabs, navigating between pages, reload, URL | ⏳ |\n| F2 | Filtering result: empty table, loading, request error | ⏳ |\n\n### Block G. Keyboard and accessibility\n*Cross-cutting block: collects in one place the focus and key rules that are currently spread across B–E.*\n\n| # | Section | Status |\n|---|---|---|\n| G1 | Focus order, keys, screen readers | ⚠️ (inside B5, D1, D2) |\n\n### Open questions — at the end of the document\n\n---\n\n# Block A. Foundations","html":"\u003ch2>Guide structure\u003c/h2>\n\u003cp>The guide is split into blocks. Each block answers one question and relies only on the blocks above it, so they can be written and agreed on one at a time.\u003c/p>\n\u003cpre>\u003ccode>A. Foundations ───────► what a filter is and where it lives\n   ├─ B. Page chips ────► how a filter looks and opens on the page\n   └─ C. Drawer ────────► how a filter looks and opens in the drawer\n          └─ D. Applying ─► what happens to the value (same in B and C)\n                 └─ E. Types ─► what is specific to each control\n                        └─ F. Page ─► how filters live together with the table\nG. Accessibility — cross-cutting block, collects keyboard rules from all blocks\n\u003c/code>\u003c/pre>\n\u003cp>✅ done · ⚠️ partial · ⏳ not started\u003c/p>\n\u003ch3>Block A. Foundations\u003c/h3>\n\u003cp>\u003cem>Question: what are filters made of, and how is their state organized? The terms and the model defined here are used in every other block.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>A1\u003c/td>\n\u003ctd>Terms and the &quot;draft / applied value&quot; model\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A2\u003c/td>\n\u003ctd>Anatomy: filter bar on the page, All Filters drawer\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>A3\u003c/td>\n\u003ctd>Filter bar configurations: quick filters only / All Filters only / both\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block B. Page chips\u003c/h3>\n\u003cp>\u003cem>Question: how does a filter look on the page, and how does its dropdown open? Relies on A.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>B1\u003c/td>\n\u003ctd>Chip types: quick filter and applied-filter chip\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B2\u003c/td>\n\u003ctd>Chip states: default, hover, open, with value, with counter, loading\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B3\u003c/td>\n\u003ctd>Value in the chip: date and range formats, multiselect counter, truncating long values\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B4\u003c/td>\n\u003ctd>Chip order and wrapping to a second line\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B5\u003c/td>\n\u003ctd>Opening and closing the chip dropdown\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block C. All Filters drawer\u003c/h3>\n\u003cp>\u003cem>Question: how does a filter look and behave in the drawer, and how is the drawer connected to the chips? Relies on A and B.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>C1\u003c/td>\n\u003ctd>Opening and closing\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C2\u003c/td>\n\u003ctd>Structure: header, body, footer\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C3\u003c/td>\n\u003ctd>Sections: expanded and collapsed state, Expand / Collapse all\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C4\u003c/td>\n\u003ctd>Long lists: Show all / Show less, search, loading\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C5\u003c/td>\n\u003ctd>Footer buttons: Apply and reset (Clear all / Reset to default)\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C6\u003c/td>\n\u003ctd>Syncing with the page chips\u003c/td>\n\u003ctd>✅ proposal\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>C7\u003c/td>\n\u003ctd>Not yet covered\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block D. Applying, validation, clearing\u003c/h3>\n\u003cp>\u003cem>Question: what happens to the value — when it is applied, when it isn&#39;t, and how it is reset? The rules are the same for the chip dropdown (B) and the drawer (C).\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>D1\u003c/td>\n\u003ctd>Apply button\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D2\u003c/td>\n\u003ctd>Validation\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D3\u003c/td>\n\u003ctd>Clearing: × on a chip, Clear in a section, Clear all on the page and in the drawer\u003c/td>\n\u003ctd>⚠️\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>D4\u003c/td>\n\u003ctd>Default values and Reset to default\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block E. Filter types\u003c/h3>\n\u003cp>\u003cem>Question: what does a specific control add to the general rules? Only differences from A–D go here; general rules are not repeated.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>Common to all types and summary table\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E1\u003c/td>\n\u003ctd>Text input (Text, Numeric)\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E2\u003c/td>\n\u003ctd>Amount range\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E3\u003c/td>\n\u003ctd>Select\u003c/td>\n\u003ctd>✅ (question about the Apply variant)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E4\u003c/td>\n\u003ctd>Multiselect\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E5\u003c/td>\n\u003ctd>Date picker\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E6\u003c/td>\n\u003ctd>Date range picker — one field\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E7\u003c/td>\n\u003ctd>Switch (formerly Boolean)\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>—\u003c/td>\n\u003ctd>Errors in the current mockups\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block F. Filters and the page\u003c/h3>\n\u003cp>\u003cem>Question: how do filters live together with the page — what happens to them when switching tabs or reloading, and what does the result look like? Relies on everything above.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>F1\u003c/td>\n\u003ctd>Persisting filters: switching tabs, navigating between pages, reload, URL\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2\u003c/td>\n\u003ctd>Filtering result: empty table, loading, request error\u003c/td>\n\u003ctd>⏳\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Block G. Keyboard and accessibility\u003c/h3>\n\u003cp>\u003cem>Cross-cutting block: collects in one place the focus and key rules that are currently spread across B–E.\u003c/em>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Section\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>G1\u003c/td>\n\u003ctd>Focus order, keys, screen readers\u003c/td>\n\u003ctd>⚠️ (inside B5, D1, D2)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>Open questions — at the end of the document\u003c/h3>\n\u003chr>\n\u003ch1>Block A. Foundations\u003c/h1>\n"},{"md":"## A1. Terms and the core model\n\n- **Chip** — a filter in the bar above the table. Opens a dropdown with a control and an Apply button. There are two kinds (details in B1):\n  - **Quick filter** — a chip that is **always** on the page, whether or not it has a value. The set of quick filters is defined by the product.\n  - **Applied-filter chip** — appears on the page only when a filter from the drawer has been applied, and disappears when it is cleared.\n- **Drawer (All Filters)** — a side panel with all of the page's filters and shared Clear all / Apply buttons.\n- **Applied value** — the value that was sent in the request and that the table is currently filtered by.\n- **Draft** — what the user has typed or selected but not yet applied.\n\n**The core rule everything else is built on:**\n\n1. Until the user clicks Apply, they are editing a **draft**. The table and the chips show **applied** values only.\n2. Apply turns the draft into the applied value (if the draft is valid).\n3. Closing without Apply (click outside, Esc, the drawer's close button) **discards the draft**. Next time it opens, the user sees the applied value.\n4. The chip and the drawer are two entry points to **the same filter state**. A value applied in a chip is immediately visible in the drawer, and vice versa. Apply, validation and clearing rules are the same in both places.\n\n> In the current mockups (IMG_2345), the chip shows the draft value \"Label from 10 to\" while the input is invalid. Under the rule above, the chip should show the last applied value.","html":"\u003ch2>A1. Terms and the core model\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Chip\u003c/strong> — a filter in the bar above the table. Opens a dropdown with a control and an Apply button. There are two kinds (details in B1):\u003cul>\n\u003cli>\u003cstrong>Quick filter\u003c/strong> — a chip that is \u003cstrong>always\u003c/strong> on the page, whether or not it has a value. The set of quick filters is defined by the product.\u003c/li>\n\u003cli>\u003cstrong>Applied-filter chip\u003c/strong> — appears on the page only when a filter from the drawer has been applied, and disappears when it is cleared.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Drawer (All Filters)\u003c/strong> — a side panel with all of the page&#39;s filters and shared Clear all / Apply buttons.\u003c/li>\n\u003cli>\u003cstrong>Applied value\u003c/strong> — the value that was sent in the request and that the table is currently filtered by.\u003c/li>\n\u003cli>\u003cstrong>Draft\u003c/strong> — what the user has typed or selected but not yet applied.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>The core rule everything else is built on:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Until the user clicks Apply, they are editing a \u003cstrong>draft\u003c/strong>. The table and the chips show \u003cstrong>applied\u003c/strong> values only.\u003c/li>\n\u003cli>Apply turns the draft into the applied value (if the draft is valid).\u003c/li>\n\u003cli>Closing without Apply (click outside, Esc, the drawer&#39;s close button) \u003cstrong>discards the draft\u003c/strong>. Next time it opens, the user sees the applied value.\u003c/li>\n\u003cli>The chip and the drawer are two entry points to \u003cstrong>the same filter state\u003c/strong>. A value applied in a chip is immediately visible in the drawer, and vice versa. Apply, validation and clearing rules are the same in both places.\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>In the current mockups (IMG_2345), the chip shows the draft value &quot;Label from 10 to&quot; while the input is invalid. Under the rule above, the chip should show the last applied value.\u003c/p>\n\u003c/blockquote>\n"},{"md":"## A2. Anatomy\n\n⏳ Not started.","html":"\u003ch2>A2. Anatomy\u003c/h2>\n\u003cp>⏳ Not started.\u003c/p>\n"},{"md":"## A3. Filter bar configurations\n\n| Configuration | When to use | What is on the page |\n|---|---|---|\n| **A. Quick filters only** | The product has few filters (3–5); there is no point hiding them in a drawer | Quick filters + Clear all. No All Filters button and no drawer. |\n| **B. All Filters only** | There are many filters, and none is used noticeably more often than the others | All Filters + applied-filter chips + Clear all |\n| **C. All Filters + quick filters** | There are many filters, but 2–4 key ones should be at hand | All Filters + quick filters + applied-filter chips + Clear all |\n\nSuggested rule of thumb: up to 5 filters — A; more than 5 — B or C. In C, use no more than 4 quick filters; otherwise the bar turns into a drawer laid out on the page.\n\n---\n\n# Block B. Page chips","html":"\u003ch2>A3. Filter bar configurations\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Configuration\u003c/th>\n\u003cth>When to use\u003c/th>\n\u003cth>What is on the page\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>A. Quick filters only\u003c/strong>\u003c/td>\n\u003ctd>The product has few filters (3–5); there is no point hiding them in a drawer\u003c/td>\n\u003ctd>Quick filters + Clear all. No All Filters button and no drawer.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>B. All Filters only\u003c/strong>\u003c/td>\n\u003ctd>There are many filters, and none is used noticeably more often than the others\u003c/td>\n\u003ctd>All Filters + applied-filter chips + Clear all\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>C. All Filters + quick filters\u003c/strong>\u003c/td>\n\u003ctd>There are many filters, but 2–4 key ones should be at hand\u003c/td>\n\u003ctd>All Filters + quick filters + applied-filter chips + Clear all\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Suggested rule of thumb: up to 5 filters — A; more than 5 — B or C. In C, use no more than 4 quick filters; otherwise the bar turns into a drawer laid out on the page.\u003c/p>\n\u003chr>\n\u003ch1>Block B. Page chips\u003c/h1>\n"},{"md":"## B1. Chip types\n\n| | Quick filter | Applied-filter chip |\n|---|---|---|\n| Visible on the page | Always | Only while the filter is applied |\n| Without a value | Outline chip with a label and an arrow: `Label ⌄` | Does not exist |\n| With a value | `Label Value × ⌄` | `Label Value × ⌄` — looks the same |\n| Click on the chip | Dropdown with a control and Apply | Dropdown with a control and Apply — behaves the same |\n| × on the chip | Clears the value and applies. **The chip stays**, with no value | Clears the value and applies. **The chip disappears** |\n| Apply with an empty value | Filter removed; the chip stays, with no value | Filter removed; the chip disappears (the dropdown closes with it) |\n| Clear all on the page | All quick filters stay, with no values | All applied-filter chips disappear |\n| Present in the drawer | Yes (in configuration C) | Yes — the drawer is where it comes from |\n\nBoth kinds look and behave the same inside the dropdown. The only difference is whether the chip stays on the page after being cleared. Rules B5, D1 and D2 apply to both without exception.","html":"\u003ch2>B1. Chip types\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Quick filter\u003c/th>\n\u003cth>Applied-filter chip\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Visible on the page\u003c/td>\n\u003ctd>Always\u003c/td>\n\u003ctd>Only while the filter is applied\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Without a value\u003c/td>\n\u003ctd>Outline chip with a label and an arrow: \u003ccode>Label ⌄\u003c/code>\u003c/td>\n\u003ctd>Does not exist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>With a value\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Label Value × ⌄\u003c/code> — looks the same\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on the chip\u003c/td>\n\u003ctd>Dropdown with a control and Apply\u003c/td>\n\u003ctd>Dropdown with a control and Apply — behaves the same\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>× on the chip\u003c/td>\n\u003ctd>Clears the value and applies. \u003cstrong>The chip stays\u003c/strong>, with no value\u003c/td>\n\u003ctd>Clears the value and applies. \u003cstrong>The chip disappears\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apply with an empty value\u003c/td>\n\u003ctd>Filter removed; the chip stays, with no value\u003c/td>\n\u003ctd>Filter removed; the chip disappears (the dropdown closes with it)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all on the page\u003c/td>\n\u003ctd>All quick filters stay, with no values\u003c/td>\n\u003ctd>All applied-filter chips disappear\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Present in the drawer\u003c/td>\n\u003ctd>Yes (in configuration C)\u003c/td>\n\u003ctd>Yes — the drawer is where it comes from\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Both kinds look and behave the same inside the dropdown. The only difference is whether the chip stays on the page after being cleared. Rules B5, D1 and D2 apply to both without exception.\u003c/p>\n"},{"md":"## B2. Chip states\n\n⏳ Not started.","html":"\u003ch2>B2. Chip states\u003c/h2>\n\u003cp>⏳ Not started.\u003c/p>\n"},{"md":"## B3. Value in the chip\n\n⏳ Not started. Already known: for a range with one boundary — `Label to 10` / `Label from 10` (see E2).","html":"\u003ch2>B3. Value in the chip\u003c/h2>\n\u003cp>⏳ Not started. Already known: for a range with one boundary — \u003ccode>Label to 10\u003c/code> / \u003ccode>Label from 10\u003c/code> (see E2).\u003c/p>\n"},{"md":"## B4. Chip order\n\n`All Filters` → quick filters → applied-filter chips → `Clear all`\n\n- Quick filters keep the order defined by the product and do not move when values are applied. Users remember where they are.\n- Applied-filter chips follow the order of the drawer sections (not the order in which they were applied), so the bar doesn't \"jump\" on every Apply.\n- When wrapping to a second line, the order is preserved (IMG_2336).","html":"\u003ch2>B4. Chip order\u003c/h2>\n\u003cp>\u003ccode>All Filters\u003c/code> → quick filters → applied-filter chips → \u003ccode>Clear all\u003c/code>\u003c/p>\n\u003cul>\n\u003cli>Quick filters keep the order defined by the product and do not move when values are applied. Users remember where they are.\u003c/li>\n\u003cli>Applied-filter chips follow the order of the drawer sections (not the order in which they were applied), so the bar doesn&#39;t &quot;jump&quot; on every Apply.\u003c/li>\n\u003cli>When wrapping to a second line, the order is preserved (IMG_2336).\u003c/li>\n\u003c/ul>\n"},{"md":"## B5. Opening and closing the chip dropdown\n\n**Fix:** the dropdown opens **on click**, not on hover.\n\n| Action | Result |\n|---|---|\n| Hover over a chip | Visual hover state only. The dropdown does not open. |\n| Click on a chip | Opens the dropdown. Focus moves to the first control (input / search). |\n| Click on the open chip again | Closes the dropdown; the draft is discarded. |\n| Click on another chip | The current dropdown closes (draft discarded) and the new one opens. At most one is open at a time. |\n| Click outside the dropdown | Closes it; the draft is discarded. |\n| Esc | Closes it; the draft is discarded; focus returns to the chip. |\n| Click on × on a chip | Clears the filter and applies immediately. The dropdown does **not** open. |\n| Enter / Space on a focused chip | Opens the dropdown (same as click). |\n\nWhy not hover: a dropdown with an input and a button is a form. On hover, it opens by accident as the mouse moves toward the table, and closes when the cursor \"slips off\" on its way to the button. Hover is also unavailable from the keyboard and on a touchpad without a cursor.\n\n---\n\n# Block C. All Filters drawer\n\nThe drawer is a side panel with all of the page's filters. Inside the drawer, the user edits a draft (A1): the table doesn't change until they click Apply.","html":"\u003ch2>B5. Opening and closing the chip dropdown\u003c/h2>\n\u003cp>\u003cstrong>Fix:\u003c/strong> the dropdown opens \u003cstrong>on click\u003c/strong>, not on hover.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Action\u003c/th>\n\u003cth>Result\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Hover over a chip\u003c/td>\n\u003ctd>Visual hover state only. The dropdown does not open.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on a chip\u003c/td>\n\u003ctd>Opens the dropdown. Focus moves to the first control (input / search).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on the open chip again\u003c/td>\n\u003ctd>Closes the dropdown; the draft is discarded.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on another chip\u003c/td>\n\u003ctd>The current dropdown closes (draft discarded) and the new one opens. At most one is open at a time.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click outside the dropdown\u003c/td>\n\u003ctd>Closes it; the draft is discarded.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Esc\u003c/td>\n\u003ctd>Closes it; the draft is discarded; focus returns to the chip.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on × on a chip\u003c/td>\n\u003ctd>Clears the filter and applies immediately. The dropdown does \u003cstrong>not\u003c/strong> open.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Enter / Space on a focused chip\u003c/td>\n\u003ctd>Opens the dropdown (same as click).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Why not hover: a dropdown with an input and a button is a form. On hover, it opens by accident as the mouse moves toward the table, and closes when the cursor &quot;slips off&quot; on its way to the button. Hover is also unavailable from the keyboard and on a touchpad without a cursor.\u003c/p>\n\u003chr>\n\u003ch1>Block C. All Filters drawer\u003c/h1>\n\u003cp>The drawer is a side panel with all of the page&#39;s filters. Inside the drawer, the user edits a draft (A1): the table doesn&#39;t change until they click Apply.\u003c/p>\n"},{"md":"## C1. Opening and closing\n\n### Opening\n\n- The drawer opens **only on click** on the All Filters button.\n- It slides in from the right over the page, and the page behind it is dimmed. Page scrolling is locked while the drawer is open.\n- If a chip dropdown was open on the page, it closes and its draft is discarded.\n- The drawer shows the **applied** values of all filters right away.\n- Focus moves into the drawer (to the title or the first control). Tab doesn't leave the drawer while it is open.\n- The drawer always opens scrolled to the top.\n\n### Closing\n\n| Action | What happens to changes | Drawer |\n|---|---|---|\n| Apply, no errors | All filters are applied at once | Closes |\n| Apply, with errors | Nothing is applied (C5) | Stays open |\n| Clear all / Reset to default | The reset is applied immediately (C5) | Closes |\n| × in the header | The draft is discarded | Closes |\n| Click on the dimmed page | The draft is discarded | Closes |\n| Esc | The draft is discarded | Closes |\n\n- There is **no** \"You have unsaved changes\" confirmation on close. Setting filters again is cheap, and an extra dialog annoys more often than it helps.\n- After closing, focus returns to the All Filters button.","html":"\u003ch2>C1. Opening and closing\u003c/h2>\n\u003ch3>Opening\u003c/h3>\n\u003cul>\n\u003cli>The drawer opens \u003cstrong>only on click\u003c/strong> on the All Filters button.\u003c/li>\n\u003cli>It slides in from the right over the page, and the page behind it is dimmed. Page scrolling is locked while the drawer is open.\u003c/li>\n\u003cli>If a chip dropdown was open on the page, it closes and its draft is discarded.\u003c/li>\n\u003cli>The drawer shows the \u003cstrong>applied\u003c/strong> values of all filters right away.\u003c/li>\n\u003cli>Focus moves into the drawer (to the title or the first control). Tab doesn&#39;t leave the drawer while it is open.\u003c/li>\n\u003cli>The drawer always opens scrolled to the top.\u003c/li>\n\u003c/ul>\n\u003ch3>Closing\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Action\u003c/th>\n\u003cth>What happens to changes\u003c/th>\n\u003cth>Drawer\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Apply, no errors\u003c/td>\n\u003ctd>All filters are applied at once\u003c/td>\n\u003ctd>Closes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apply, with errors\u003c/td>\n\u003ctd>Nothing is applied (C5)\u003c/td>\n\u003ctd>Stays open\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clear all / Reset to default\u003c/td>\n\u003ctd>The reset is applied immediately (C5)\u003c/td>\n\u003ctd>Closes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>× in the header\u003c/td>\n\u003ctd>The draft is discarded\u003c/td>\n\u003ctd>Closes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Click on the dimmed page\u003c/td>\n\u003ctd>The draft is discarded\u003c/td>\n\u003ctd>Closes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Esc\u003c/td>\n\u003ctd>The draft is discarded\u003c/td>\n\u003ctd>Closes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>There is \u003cstrong>no\u003c/strong> &quot;You have unsaved changes&quot; confirmation on close. Setting filters again is cheap, and an extra dialog annoys more often than it helps.\u003c/li>\n\u003cli>After closing, focus returns to the All Filters button.\u003c/li>\n\u003c/ul>\n"},{"md":"## C2. Drawer structure\n\n```\n┌──────────────────────────────┐\n│ All Filters               ×  │  ← header, pinned\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← sections, scroll\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← footer, pinned\n└──────────────────────────────┘\n```\n\n- **Header** is pinned: the title \"All Filters\", the × button and the Expand all / Collapse all link (C3).\n- **Body** scrolls. It contains the filter sections in a fixed order: quick filters first, in page order, then the rest (C6).\n- **Footer** is pinned and always visible: the reset button and Apply (C5).\n- **Section titles** are left-aligned. A long title wraps to a second line instead of being truncated.","html":"\u003ch2>C2. Drawer structure\u003c/h2>\n\u003cpre>\u003ccode>┌──────────────────────────────┐\n│ All Filters               ×  │  ← header, pinned\n│ Expand all ⌄                 │\n├──────────────────────────────┤\n│ Status        Clear     ^    │  ← sections, scroll\n│   ☐ Option 1                 │\n│   ...                        │\n│ Created on               ⌄   │\n│ Switch                  [ ●] │\n├──────────────────────────────┤\n│ [ Clear all ]   [  Apply  ]  │  ← footer, pinned\n└──────────────────────────────┘\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Header\u003c/strong> is pinned: the title &quot;All Filters&quot;, the × button and the Expand all / Collapse all link (C3).\u003c/li>\n\u003cli>\u003cstrong>Body\u003c/strong> scrolls. It contains the filter sections in a fixed order: quick filters first, in page order, then the rest (C6).\u003c/li>\n\u003cli>\u003cstrong>Footer\u003c/strong> is pinned and always visible: the reset button and Apply (C5).\u003c/li>\n\u003cli>\u003cstrong>Section titles\u003c/strong> are left-aligned. A long title wraps to a second line instead of being truncated.\u003c/li>\n\u003c/ul>\n"},{"md":"## C3. Sections: expanded and collapsed state\n\n### Default state\n\nThe product chooses which state sections open in by default:\n\n- **all expanded** — when there are few filters and it matters to see everything at once;\n- **all collapsed** — when there are many filters and the drawer would otherwise get too long.\n\n### A section with a value is always expanded\n\nWhen the drawer opens, a section **that has a value** is expanded, even if sections are collapsed by default. A value is either an applied value or a default value (D4). This way the user immediately sees what is filtering the table right now.\n\n### Controlling a section\n\n- Every section (except Switch) has a chevron in its header: `⌄` — expand, `^` — collapse. Clicking the header also expands and collapses the section.\n- The user can collapse a section even if it has a value. The header then keeps the Clear button and a short value hint: `Status · 2`, `Created on · 08/10/2025`. Without it, a collapsed section with a value would look empty.\n- **Switch** is not an accordion: one row with the title on the left and the switch on the right, no chevron and no Clear.\n- **Clear** sits in the section header and is shown only when the filter has a value (D3).\n\n### Expand all / Collapse all\n\n- A link under the drawer title.\n- If at least one section is collapsed, the link reads **Expand all** and expands them all.\n- If all sections are expanded, the link reads **Collapse all** and collapses them all.\n- The link is needed when there are more than 5 sections. With fewer, it can be hidden.\n\n### What is remembered\n\nWhich sections are expanded is kept while the drawer is open. The next time it opens, the state is calculated again using the rules above: the default state plus expanded sections with values.","html":"\u003ch2>C3. Sections: expanded and collapsed state\u003c/h2>\n\u003ch3>Default state\u003c/h3>\n\u003cp>The product chooses which state sections open in by default:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>all expanded\u003c/strong> — when there are few filters and it matters to see everything at once;\u003c/li>\n\u003cli>\u003cstrong>all collapsed\u003c/strong> — when there are many filters and the drawer would otherwise get too long.\u003c/li>\n\u003c/ul>\n\u003ch3>A section with a value is always expanded\u003c/h3>\n\u003cp>When the drawer opens, a section \u003cstrong>that has a value\u003c/strong> is expanded, even if sections are collapsed by default. A value is either an applied value or a default value (D4). This way the user immediately sees what is filtering the table right now.\u003c/p>\n\u003ch3>Controlling a section\u003c/h3>\n\u003cul>\n\u003cli>Every section (except Switch) has a chevron in its header: \u003ccode>⌄\u003c/code> — expand, \u003ccode>^\u003c/code> — collapse. Clicking the header also expands and collapses the section.\u003c/li>\n\u003cli>The user can collapse a section even if it has a value. The header then keeps the Clear button and a short value hint: \u003ccode>Status · 2\u003c/code>, \u003ccode>Created on · 08/10/2025\u003c/code>. Without it, a collapsed section with a value would look empty.\u003c/li>\n\u003cli>\u003cstrong>Switch\u003c/strong> is not an accordion: one row with the title on the left and the switch on the right, no chevron and no Clear.\u003c/li>\n\u003cli>\u003cstrong>Clear\u003c/strong> sits in the section header and is shown only when the filter has a value (D3).\u003c/li>\n\u003c/ul>\n\u003ch3>Expand all / Collapse all\u003c/h3>\n\u003cul>\n\u003cli>A link under the drawer title.\u003c/li>\n\u003cli>If at least one section is collapsed, the link reads \u003cstrong>Expand all\u003c/strong> and expands them all.\u003c/li>\n\u003cli>If all sections are expanded, the link reads \u003cstrong>Collapse all\u003c/strong> and collapses them all.\u003c/li>\n\u003cli>The link is needed when there are more than 5 sections. With fewer, it can be hidden.\u003c/li>\n\u003c/ul>\n\u003ch3>What is remembered\u003c/h3>\n\u003cp>Which sections are expanded is kept while the drawer is open. The next time it opens, the state is calculated again using the rules above: the default state plus expanded sections with values.\u003c/p>\n"},{"md":"## C4. Long lists: Show all and Show less\n\nApplies to Select and Multiselect in the drawer.\n\n### How many options are visible\n\n- By default, an expanded section shows **6 options**. The product can set a different number for a specific filter.\n- **Minimum-remainder rule:** the Show all button is shown only if **2 or more options** would be hidden under it. If only one would be hidden, show the whole list: the button would take as much space as that option and save nothing.\n  - Example: limit 6, 7 options → show all 7, no button.\n  - Example: limit 6, 8 options → show 6 and a `Show all (8)` button.\n- This is a single comparison (\"more options than limit + 1?\"), not complex logic. So the rule is built into the component, and the product only sets the limit.\n\n### Selected options are always visible\n\nIf a selected option sits below the limit, it would be hidden in the collapsed list. So when the drawer opens, selected options move to the top of the list, and the rest follow in their original order.\n\nThe order is recalculated **only when the drawer opens**, not on click. Otherwise options would \"jump\" from under the cursor.\n\n### Button labels\n\n| Collapsed list | Expanded list | Comment |\n|---|---|---|\n| **Show all (24)** | **Show less** | Recommended. The number shows the total right away. \"Show less\" honestly describes the action: the list shrinks back to the limit, it doesn't disappear. |\n| Show more | Show less | A standard pair, but \"more\" doesn't say whether the whole list or only part of it will open. |\n| Show 18 more | Show less | Precise, but the number depends on the limit and is harder to localize. |\n| ~~Show all~~ | ~~Hide all~~ | Don't use: \"Hide all\" reads as \"hide everything\", although the first options stay in place. |\n\n### What happens on Show all\n\n- The list expands **right inside the section**, without a nested scroll: the drawer already scrolls, and a scroll inside a scroll easily traps the mouse wheel.\n- If there are more than **20** options, the expanded list gets a maximum height of about 10 rows and its own scroll. In this case, the search above the list stays in place.\n- The button changes to **Show less** and sits under the last option.\n\n### What happens on Show less\n\n- The list collapses back to the limit.\n- If the section title has scrolled out of view by then, the drawer scrolls so the section title is visible again. The user shouldn't lose their place.\n\n### Search in the list\n\n- A search field is shown above the list if there are more than 10 options.\n- While the search has text, **all** matches are shown, with no limit and no Show all.\n- No matches — the text \"No results\".\n- Clearing the search (× in the field) returns the list to its previous state.\n\n### Loading and errors\n\n- While options load, skeletons are shown instead (as in the chip dropdown, IMG_2508).\n- Loading error — error text and a Retry link inside the section. Other sections work as usual.","html":"\u003ch2>C4. Long lists: Show all and Show less\u003c/h2>\n\u003cp>Applies to Select and Multiselect in the drawer.\u003c/p>\n\u003ch3>How many options are visible\u003c/h3>\n\u003cul>\n\u003cli>By default, an expanded section shows \u003cstrong>6 options\u003c/strong>. The product can set a different number for a specific filter.\u003c/li>\n\u003cli>\u003cstrong>Minimum-remainder rule:\u003c/strong> the Show all button is shown only if \u003cstrong>2 or more options\u003c/strong> would be hidden under it. If only one would be hidden, show the whole list: the button would take as much space as that option and save nothing.\u003cul>\n\u003cli>Example: limit 6, 7 options → show all 7, no button.\u003c/li>\n\u003cli>Example: limit 6, 8 options → show 6 and a \u003ccode>Show all (8)\u003c/code> button.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>This is a single comparison (&quot;more options than limit + 1?&quot;), not complex logic. So the rule is built into the component, and the product only sets the limit.\u003c/li>\n\u003c/ul>\n\u003ch3>Selected options are always visible\u003c/h3>\n\u003cp>If a selected option sits below the limit, it would be hidden in the collapsed list. So when the drawer opens, selected options move to the top of the list, and the rest follow in their original order.\u003c/p>\n\u003cp>The order is recalculated \u003cstrong>only when the drawer opens\u003c/strong>, not on click. Otherwise options would &quot;jump&quot; from under the cursor.\u003c/p>\n\u003ch3>Button labels\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Collapsed list\u003c/th>\n\u003cth>Expanded list\u003c/th>\n\u003cth>Comment\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Show all (24)\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>Show less\u003c/strong>\u003c/td>\n\u003ctd>Recommended. The number shows the total right away. &quot;Show less&quot; honestly describes the action: the list shrinks back to the limit, it doesn&#39;t disappear.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show more\u003c/td>\n\u003ctd>Show less\u003c/td>\n\u003ctd>A standard pair, but &quot;more&quot; doesn&#39;t say whether the whole list or only part of it will open.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Show 18 more\u003c/td>\n\u003ctd>Show less\u003c/td>\n\u003ctd>Precise, but the number depends on the limit and is harder to localize.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cdel>Show all\u003c/del>\u003c/td>\n\u003ctd>\u003cdel>Hide all\u003c/del>\u003c/td>\n\u003ctd>Don&#39;t use: &quot;Hide all&quot; reads as &quot;hide everything&quot;, although the first options stay in place.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3>What happens on Show all\u003c/h3>\n\u003cul>\n\u003cli>The list expands \u003cstrong>right inside the section\u003c/strong>, without a nested scroll: the drawer already scrolls, and a scroll inside a scroll easily traps the mouse wheel.\u003c/li>\n\u003cli>If there are more than \u003cstrong>20\u003c/strong> options, the expanded list gets a maximum height of about 10 rows and its own scroll. In this case, the search above the list stays in place.\u003c/li>\n\u003cli>The button changes to \u003cstrong>Show less\u003c/strong> and sits under the last option.\u003c/li>\n\u003c/ul>\n\u003ch3>What happens on Show less\u003c/h3>\n\u003cul>\n\u003cli>The list collapses back to the limit.\u003c/li>\n\u003cli>If the section title has scrolled out of view by then, the drawer scrolls so the section title is visible again. The user shouldn&#39;t lose their place.\u003c/li>\n\u003c/ul>\n\u003ch3>Search in the list\u003c/h3>\n\u003cul>\n\u003cli>A search field is shown above the list if there are more than 10 options.\u003c/li>\n\u003cli>While the search has text, \u003cstrong>all\u003c/strong> matches are shown, with no limit and no Show all.\u003c/li>\n\u003cli>No matches — the text &quot;No results&quot;.\u003c/li>\n\u003cli>Clearing the search (× in the field) returns the list to its previous state.\u003c/li>\n\u003c/ul>\n\u003ch3>Loading and errors\u003c/h3>\n\u003cul>\n\u003cli>While options load, skeletons are shown instead (as in the chip dropdown, IMG_2508).\u003c/li>\n\u003cli>Loading error — error text and a Retry link inside the section. Other sections work as usual.\u003c/li>\n\u003c/ul>\n"},{"md":"## C5. Footer buttons\n\n### Apply\n\n**Apply is always enabled** (D1) — whether or not the user changed anything.\n\nOn click:\n\n1. **All** fields in the drawer are validated, including those in collapsed sections.\n2. No errors → all filters are applied at once, the drawer closes, the table updates.\n3. Errors:\n   - nothing is applied, the drawer stays open;\n   - collapsed sections with errors expand;\n   - the drawer **scrolls to the first field with an error**, and focus moves to that field;\n   - all invalid fields get a red border and error text.\n\nThere is no partial apply: if even one field is invalid, nothing is applied.\n\n### Reset: Clear all or Reset to default\n\n**Recommendation: one reset button, not two.** Two reset buttons side by side make the user guess how they differ. A Cancel button isn't needed either: the × in the header does that job.\n\nThe reset button **always returns the filters to their default state** (D4). Its label depends on whether the page has default values:\n\n| The page has | Label | What it does |\n|---|---|---|\n| No default values | **Clear all** | Clears all filters. \"Default\" here means \"empty\", so \"Clear\" describes the result exactly. |\n| Default values | **Reset to default** | Restores the default values and clears everything else. |\n\nWhy not keep \"Clear all\" for both cases: \"Clear\" promises empty fields. If a default value reappears in a filter after the click, the user will think the button didn't work. Why not \"Reset to default\" for both: on a page without defaults, the word \"default\" is confusing — default to what?\n\nThe product doesn't need to pick the label by hand: it is determined by whether default values are set. This removes inconsistency between products.\n\nButton behavior:\n\n- the reset **is applied immediately** and the drawer closes — the same as Clear all on the page;\n- the button is always visible so the footer doesn't change. If there is nothing to reset, clicking it simply closes the drawer.\n\n### Clear in a section\n\n- Shown only when the filter has a value.\n- Clears **only this section's draft**: the value disappears, but the change is applied together with everything else on Apply.\n- If the filter has a default value, Clear in a section still empties the field completely. The default value can be restored with Reset to default.","html":"\u003ch2>C5. Footer buttons\u003c/h2>\n\u003ch3>Apply\u003c/h3>\n\u003cp>\u003cstrong>Apply is always enabled\u003c/strong> (D1) — whether or not the user changed anything.\u003c/p>\n\u003cp>On click:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>All\u003c/strong> fields in the drawer are validated, including those in collapsed sections.\u003c/li>\n\u003cli>No errors → all filters are applied at once, the drawer closes, the table updates.\u003c/li>\n\u003cli>Errors:\u003cul>\n\u003cli>nothing is applied, the drawer stays open;\u003c/li>\n\u003cli>collapsed sections with errors expand;\u003c/li>\n\u003cli>the drawer \u003cstrong>scrolls to the first field with an error\u003c/strong>, and focus moves to that field;\u003c/li>\n\u003cli>all invalid fields get a red border and error text.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003cp>There is no partial apply: if even one field is invalid, nothing is applied.\u003c/p>\n\u003ch3>Reset: Clear all or Reset to default\u003c/h3>\n\u003cp>\u003cstrong>Recommendation: one reset button, not two.\u003c/strong> Two reset buttons side by side make the user guess how they differ. A Cancel button isn&#39;t needed either: the × in the header does that job.\u003c/p>\n\u003cp>The reset button \u003cstrong>always returns the filters to their default state\u003c/strong> (D4). Its label depends on whether the page has default values:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>The page has\u003c/th>\n\u003cth>Label\u003c/th>\n\u003cth>What it does\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>No default values\u003c/td>\n\u003ctd>\u003cstrong>Clear all\u003c/strong>\u003c/td>\n\u003ctd>Clears all filters. &quot;Default&quot; here means &quot;empty&quot;, so &quot;Clear&quot; describes the result exactly.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Default values\u003c/td>\n\u003ctd>\u003cstrong>Reset to default\u003c/strong>\u003c/td>\n\u003ctd>Restores the default values and clears everything else.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Why not keep &quot;Clear all&quot; for both cases: &quot;Clear&quot; promises empty fields. If a default value reappears in a filter after the click, the user will think the button didn&#39;t work. Why not &quot;Reset to default&quot; for both: on a page without defaults, the word &quot;default&quot; is confusing — default to what?\u003c/p>\n\u003cp>The product doesn&#39;t need to pick the label by hand: it is determined by whether default values are set. This removes inconsistency between products.\u003c/p>\n\u003cp>Button behavior:\u003c/p>\n\u003cul>\n\u003cli>the reset \u003cstrong>is applied immediately\u003c/strong> and the drawer closes — the same as Clear all on the page;\u003c/li>\n\u003cli>the button is always visible so the footer doesn&#39;t change. If there is nothing to reset, clicking it simply closes the drawer.\u003c/li>\n\u003c/ul>\n\u003ch3>Clear in a section\u003c/h3>\n\u003cul>\n\u003cli>Shown only when the filter has a value.\u003c/li>\n\u003cli>Clears \u003cstrong>only this section&#39;s draft\u003c/strong>: the value disappears, but the change is applied together with everything else on Apply.\u003c/li>\n\u003cli>If the filter has a default value, Clear in a section still empties the field completely. The default value can be restored with Reset to default.\u003c/li>\n\u003c/ul>\n"},{"md":"## C6. Syncing with the page chips\n\n- A quick filter is **duplicated** in the drawer. This keeps the drawer a complete list of the page's filters: the user can set everything in one place and apply it with one Apply.\n- In the drawer, quick filters come first, in the same order as on the page.\n- A value applied in the drawer is immediately visible in the quick filter on the page, and vice versa.\n- A quick filter **does not turn into** an applied-filter chip
